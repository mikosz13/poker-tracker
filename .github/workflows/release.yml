name: Build desktop app

# Builds PokerTracker for macOS (Apple Silicon) and Windows. Runs on demand and on version tags (v0.2.0, ...);
# for tags the files are attached to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PokerTracker-macOS.zip
          - os: windows-latest
            artifact: PokerTracker-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[app]" pyinstaller
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm packaging/pokertracker.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PokerTracker.app ${{ matrix.artifact }}
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PokerTracker -DestinationPath ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}
