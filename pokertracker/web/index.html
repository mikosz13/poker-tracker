<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Tracker</title>
<style>
:root{--bg:#fff;--fg:#14161a;--muted:#6b7280;--card:#f3f4f6;--line:#e5e7eb;--blue:#2f6fed;--orange:#e67e22;--pos:#0a7d2c;--neg:#c0392b;--red:#c0392b;--felt:#1f6f4a;--rail:#5a3d2b;--s-s:#14161a;--s-h:#c62828;--s-d:#1f62c9;--s-c:#1b7f37}
/* the system theme, unless a theme was picked with the switch (data-theme on <html>) */
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d;--s-s:#e8eaed;--s-h:#ff6b6b;--s-d:#5aa2ff;--s-c:#4cd37b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d;--s-s:#e8eaed;--s-h:#ff6b6b;--s-d:#5aa2ff;--s-c:#4cd37b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
nav{max-width:960px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav a{padding:6px 10px;border-radius:8px;color:var(--fg);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--card);font-weight:600}
main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.2em 0 .4em}h2{font-size:1.02rem;margin:1.4em 0 .5em}
a{color:var(--blue)}.m{color:var(--muted);font-size:.88rem}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k div{background:var(--card);border-radius:10px;padding:10px}.k b{display:block;font-size:1.2rem}
.box{background:var(--card);border-radius:12px;padding:12px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{white-space:normal;vertical-align:bottom}   /* long headers (e.g. in Polish) wrap instead of widening the table */
#list th:nth-child(2),#list td:nth-child(2){text-align:left;white-space:normal;min-width:10em}
@media (max-width:560px){#list th,#list td{padding:6px 4px}#list th:nth-child(2),#list td:nth-child(2){min-width:7em}
  #list th:nth-child(3),#list td:nth-child(3),#list th:nth-child(6),#list td:nth-child(6){display:none}
  #list .wide{display:none}}
#list .narrow{display:none}@media (max-width:560px){#list .narrow{display:inline}}tr.click{cursor:pointer}tr.click:hover{background:var(--card)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{display:inline-block;min-width:1.9em;padding:1px 4px;margin:1px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-weight:600}
.card.s-s{color:var(--s-s)}.card.s-h{color:var(--s-h)}.card.s-d{color:var(--s-d)}.card.s-c{color:var(--s-c)}
svg.chart{width:100%;height:auto;background:var(--card);border-radius:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.rt{grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:16/10.5;container-type:inline-size;user-select:none}
@media (max-width:560px){.stage{aspect-ratio:4/5}}
.oval{position:absolute;inset:13% 9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--felt) 78%,#fff) 0%,var(--felt) 62%,color-mix(in srgb,var(--felt) 70%,#000) 100%);
  border:clamp(6px,1.6cqw,12px) solid var(--rail);box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 0 26px rgba(0,0,0,.35)}
@media (max-width:560px){.oval{inset:11% 12%}}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:62%}
.street{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;min-height:1.1em}
.board{display:flex;gap:4px;justify-content:center;margin:4px 0 6px}
.pot{font-weight:700;font-size:1.02rem}.pot small{font-weight:400;opacity:.7}
.eqline{font-size:.8rem;margin-top:3px;opacity:.92}
.pc{--w:clamp(26px,5.6cqw,40px);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.14);background:#fff;color:#14161a;display:inline-flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;font-weight:700;font-size:calc(var(--w)*.46);box-shadow:0 1px 3px rgba(0,0,0,.35);flex:none}
.pc i{font-style:normal;font-size:.95em}.pc.s-s{color:#14161a}.pc.s-h{color:#c62828}.pc.s-d{color:#1f62c9}.pc.s-c{color:#1b7f37}
body.two-color .card.s-d{color:var(--s-h)}body.two-color .card.s-c{color:var(--s-s)}
body.two-color .pc.s-d{color:#c62828}body.two-color .pc.s-c{color:#14161a}
.pc.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.28);box-shadow:none}
.pc.back{background:repeating-linear-gradient(45deg,var(--blue) 0 3px,color-mix(in srgb,var(--blue) 70%,#fff) 3px 6px);border:2px solid #fff}
.pc.new{animation:deal .22s ease-out}
@keyframes deal{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .2s;z-index:1}
.st .hc{display:flex;gap:2px;margin-bottom:-8px;z-index:0}.st .hc .pc{--w:clamp(20px,4cqw,30px)}
.st.hero .hc .pc{--w:clamp(28px,5.8cqw,42px)}
.st .box{position:relative;z-index:1;min-width:clamp(64px,13cqw,104px);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:border-color .15s,box-shadow .15s}
.st .nick{font-size:.78rem;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.st:not(.hero) .nick{font-weight:700;letter-spacing:.02em}
.st .stk{font-weight:700;font-size:.9rem;white-space:nowrap}
.st .pt{position:absolute;top:-9px;left:-6px;font-size:.66rem;font-weight:700;background:var(--card);color:var(--muted);border-radius:6px;padding:0 5px;border:1px solid var(--line)}
.st.hero .box{border-color:var(--blue)}.st.hero .nick{font-weight:700;color:var(--blue)}
.st.act .box{border-color:#f5b301;box-shadow:0 0 0 3px rgba(245,179,1,.35)}
.st.nxt .box{border-style:dashed;border-color:#f5b301}
.st.fold{opacity:.38}.st.win .box{border-color:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 35%,transparent)}
.badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.badge.ai{background:var(--neg);color:#fff}.badge.eq.chg{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1.45);box-shadow:0 0 0 4px rgba(245,179,1,.45)}100%{transform:none;box-shadow:none}}.badge.eq{background:#f5b301;color:#14161a;right:-8px;left:auto;transform:none;bottom:auto;top:-9px}
.seat0{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,6cqw,44px);height:clamp(18px,3.4cqw,26px);border-radius:8px;border:1.5px dashed var(--line);opacity:.6}
.bet{position:absolute;transform:translate(-50%,-50%);font-size:.78rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);border-radius:10px;padding:1px 7px 1px 4px;white-space:nowrap;transition:opacity .18s;z-index:1}
.bet::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#f5b301;border:2px dashed #fff;margin-right:4px;vertical-align:-1px}
.bet.won{background:color-mix(in srgb,var(--pos) 85%,#000)}.bet.won::before{display:none}.bet.off{opacity:0}
.dealer{position:absolute;transform:translate(-50%,-50%);width:clamp(16px,2.8cqw,22px);height:clamp(16px,2.8cqw,22px);border-radius:50%;background:#fff;color:#14161a;font-size:.62rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}.ctl button{min-width:2.8em}.ctl select{padding:6px}
.log{background:var(--card);border-radius:12px;padding:6px;max-height:min(520px,60vh);overflow:auto;font-size:.86rem}
@media (max-width:760px){.log{max-height:240px}}
.log .sh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.log .li{padding:3px 6px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.log .li:hover{background:var(--bg)}.log .li.cur{background:var(--blue);color:#fff}.log .li.cur .m,.log .li.cur .pos,.log .li.cur .neg{color:#fff}
.log .li b{font-weight:700}.log .li .cs{display:flex;gap:2px}.log .li .card{margin:0;font-size:.8rem;padding:0 3px;min-width:1.7em}
.ctrl{display:flex;gap:6px;justify-content:center;margin:10px 0}.ctrl button{min-width:3em}
.pf td small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}.pf td.few,.pf td.few span{color:var(--muted)!important}
.pf tr.hl td{background:color-mix(in srgb,var(--blue) 8%,transparent)}.pf tr.tot td{border-top:2px solid var(--line);font-weight:600}
.def{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.sd-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;margin-top:6px}.sd-legend span{display:inline-flex;gap:6px;align-items:center;cursor:help}
.sd-legend i{width:16px;height:3px;border-radius:2px;display:inline-block}.sd-legend i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;margin:14px 0}
.trio .box h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lscale{display:flex;gap:4px}.lv{flex:1;text-align:center;font-size:.7rem;line-height:1.2;padding:6px 2px;border-radius:8px;
  background:var(--bg);color:var(--muted);border:1px solid var(--line)}.lv b{display:block;font-size:1rem;margin-bottom:2px}
.lv.on{color:#fff;font-weight:700;border-color:transparent}.lv.on.up{background:var(--pos)}.lv.on.mid{background:var(--blue)}
.lv.on.down{background:var(--neg)}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.hcards>div{background:var(--bg);border-radius:10px;
  padding:8px 4px;border:1px solid var(--line)}.hcards .hc{font-size:1.6rem;font-weight:800;letter-spacing:.04em}
.ptable{position:relative;height:150px;margin:4px 6px}.ptable .felt{position:absolute;inset:22px 34px;border-radius:50%;
  border:2px solid var(--line);background:color-mix(in srgb,var(--felt) 22%,transparent)}
.pc2{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.72rem;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--fg)}
.pc2.few{opacity:.4}.pc2.best{background:var(--pos);border-color:var(--pos);color:#fff}
.pc2.worst{background:var(--neg);border-color:var(--neg);color:#fff}
.finding{border-left:4px solid var(--line);margin:10px 0}.finding.likely{border-left-color:var(--neg)}
.finding.possible{border-left-color:var(--orange)}.finding.good{border-left-color:var(--pos)}
.finding h3{margin:0 0 4px;font-size:1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.conf{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--bg);border:1px solid var(--line)}
.finding .big{font-size:1.05rem;font-weight:700;margin:2px 0}.finding details{margin-top:6px}
.finding summary{cursor:pointer;color:var(--blue);font-size:.88rem}
.sess-sum{margin:8px 0 0;font-size:1rem;line-height:1.45}
.scrollbox{max-height:21rem;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.scrollbox table{border-collapse:separate;border-spacing:0}   /* collapsed borders let rows show above a sticky header */
.scrollbox th{position:sticky;top:0;background:var(--card);z-index:1;box-shadow:0 1px 0 var(--line)}
td.vcell{white-space:normal;min-width:6.5em;text-align:left}
.ci{position:relative;display:inline-block;width:80px;height:10px;background:var(--line);border-radius:5px;vertical-align:middle;margin-right:6px}
.ci-zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.ci-range{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--muted)}
.ci-range.neg{background:var(--neg)}.ci-range.pos{background:var(--pos)}
.conf.v-neg{color:var(--neg);border-color:var(--neg)}.conf.v-pos{color:var(--pos);border-color:var(--pos)}
.seg a{text-decoration:none}
.langs{margin-left:auto;display:flex;flex:none;align-items:center}.langs button{padding:4px 8px;font-size:.8rem;border-radius:0}
.langs button:first-child{border-radius:8px 0 0 8px}.langs button:last-child{border-radius:0 8px 8px 0;border-left:0}
.langs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.langs.themes{margin-left:6px}nav a.gear{display:flex;align-items:center;padding:4px 7px;margin-left:6px;flex:none}nav a.gear svg{width:17px;height:17px}
#notice .notice{max-width:936px;margin:0 auto 8px;padding:6px 12px;background:var(--card);border-left:4px solid var(--blue);border-radius:6px;display:flex;gap:12px;align-items:center}
#notice .notice button{margin-left:auto;padding:0 8px;border:0;background:none;font-size:1.1rem;color:var(--muted)}
.picks th:nth-child(3),.picks th:last-child,.names th:nth-child(2),.tickets th:nth-child(3),.tickets th:last-child{text-align:left}tr.off td{opacity:.5}tr.few td{color:var(--muted)}tr.few td span{color:inherit!important}.k div.few b{color:var(--muted)}
.wrap1 td:first-child{white-space:normal}details.more{margin-top:14px}details.more>summary{cursor:pointer;color:var(--blue);font-weight:600}th span.tip{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.band{display:grid;grid-template-columns:5.5em 1fr 6.5em;gap:10px;align-items:center;margin:6px 0}.band-l{font-size:.9rem}
.band-bar{position:relative;height:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px}
.band-fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:7px}
.band-exp,.band-key{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.7}
.band-key{position:relative;display:inline-block;height:12px;vertical-align:middle;top:0}.band-v{text-align:right}input.pick{width:16px;height:16px;padding:0}.themes button{display:flex;align-items:center;padding:4px 7px}.themes svg{width:15px;height:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}.seg button{padding:5px 10px;font-size:.88rem}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg[hidden]{display:none}
.p-custom{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:8px;font-size:.88rem}
.p-custom input{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tchart{position:relative;background:var(--card);border-radius:10px;padding:4px 0;touch-action:pan-y}
.tchart svg{display:block;width:100%}.tchart .tip{position:absolute;pointer-events:none;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 3px 10px rgba(0,0,0,.2);
  white-space:nowrap;display:none;z-index:2}
.legend{font-size:.85rem;color:var(--muted);margin:4px 0 0}.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;
  vertical-align:middle;margin:0 4px 0 10px}
.tag{display:inline-block;font-size:.78rem;background:var(--card);border-radius:6px;padding:1px 6px;margin:1px}
.warn{border-left:4px solid var(--orange);padding:8px 10px;background:var(--card);border-radius:6px}
</style>
</head>

<header><nav id="nav">
  <a href="#/" data-i18n="nav.dashboard"></a><a href="#/tournaments" data-i18n="nav.tournaments"></a><a href="#/analysis" data-i18n="nav.analysis"></a><a href="#/import" data-i18n="nav.import"></a><a href="#/luck" data-i18n="nav.luck"></a>

<script>
const TOKEN = "__TOKEN__";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUIT = {c:"♣", d:"♦", h:"♥", s:"♠"};

// ---- Language -----------------------------------------------------------------
// Texts come from i18n/<lang>.json (English for a missing key). A value is a string with {placeholders}, or plural
// forms picked with Intl.PluralRules; {n} is the count. Texts are trusted HTML; values are escaped by the caller.
const LANGS = ["en", "pl"], NB = "\u00a0";
let LANG = "en", STR = {}, EN = {};
const dicts = {};
const loadLang = async l => dicts[l] || (dicts[l] = await fetch(`/i18n/${l}.json`).then(r => r.json()));
function t(key, p = {}) {
  let v = STR[key], rule = LANG;
  if (v == null) { v = EN[key]; rule = "en"; }
  if (v == null) return key;
  if (typeof v === "object") v = v[new Intl.PluralRules(rule).select(Number(p.n))] ?? v.other ?? v.many;
  return v.replace(/\{(\w+)\}/g, (m, k) => !(k in p) ? m : k === "n" && typeof p.n === "number" ? num(p.n, 0) : p[k]);
}
async function setLang(l, save) {
  [EN, STR] = await Promise.all([loadLang("en"), loadLang(l)]);

// Numbers: a decimal comma and non-breaking thousands in Polish (1,5 BB; 2 445,05 $), a true minus sign
function num(x, d = 1) {
  if (x == null || x === "" || isNaN(x)) return "–";
  const v = Number(x), s = Math.abs(v).toFixed(d), [i, f] = s.split("."), pl = LANG === "pl";
  return (v < 0 && Number(s) !== 0 ? "−" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, pl ? NB : ",") + (f ? (pl ? "," : ".") + f : "");
}
const sgn = (x, d=1, unit="") => x == null ? "–" :
  `<span class="${Number(x) >= 0 ? "pos" : "neg"}">${Number(x) >= 0 ? "+" : ""}${num(x, d)}${unit.replace(/^ /, NB)}</span>`;
function money(x, d = 2) {
  if (x == null) return "–";
  if (LANG === "pl") return num(x, d) + NB + "$";
  const s = num(Math.abs(x), d);
  return (Number(x) < 0 && Number(Math.abs(x).toFixed(d)) !== 0 ? "−" : "") + "$" + s;
}
const pct = x => x == null ? "–" : num(x, 1) + "%";
const bbUnit = (x, d = 1) => num(x, d) + NB + "BB";
// chips on an axis or in a line: "9,3 mln" / "977 tys." / "850"
const chipsShort = x => {
  if (Math.abs(x) < 1e4) return num(x, 0);
  if (Math.abs(x) < 1e6) return t("chips.k", {x: num(x / 1e3, 0)});
  const m = Math.abs(x) >= 1e7 ? Math.round(x / 1e6) : Math.round(x / 1e5) / 10;          // "5 mln", "9,3 mln"
  return t("chips.m", {x: num(m, Number.isInteger(m) ? 0 : 1)});
};
// Dates: "2026-10-11 21:45" in English, "11.10.2026 21:45" in Polish; always a 24 h clock
const pad = n => String(n).padStart(2, "0");
function dateTime(s) {
  const m = String(s ?? "").match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d:\d\d))?/);
  if (!m) return esc(s);
  return (LANG === "pl" ? `${m[3]}.${m[2]}.${m[1]}` : `${m[1]}-${m[2]}-${m[3]}`) + (m[4] ? " " + m[4] : "");
}
const dayLabel = d => LANG === "pl" ? `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`

}
async function api(path, opts) {

}

const SEATS = ["BB", "UTG", "UTG+1", "MP", "LJ", "HJ", "CO", "BTN", "SB"];   // clockwise from the bottom, like the table
const blinds = by => ["SB", "BB"].some(p => by[p]) ? `<p class="m" style="margin:4px 0 0">${["SB", "BB"].filter(p => by[p]).map(p =>
    t("pos.blindLine", {blind: t(p === "SB" ? "pos.sb" : "pos.bb"), bb: sgn(by[p].bb_per_100_ev, 0), hands: t("common.handsN", {n: by[p].hands})})).join(" · ")}.
    ${t("pos.blindsNote")}</p>` : "";
function positionBox(list, rank) {
  const by = Object.fromEntries(list.map(p => [p.position, p]));
  const ring = SEATS.filter(p => by[p]);

    const a = Math.PI / 2 + (k + .5) * 2 * Math.PI / n, p = by[pos];
    const cls = rank.best && rank.best.position === pos ? "best" : rank.worst && rank.worst.position === pos ? "worst"
      : p.hands < rank.min_hands ? "few" : "";
    return `<div class="pc2 ${cls}" style="left:${50 + 42 * Math.cos(a)}%;top:${50 + 38 * Math.sin(a)}%"
      title="${esc(t("pos.tip", {pos, bb: sgn(p.bb_per_100_ev, 0).replace(/<[^>]+>/g, ""), hands: t("common.handsN", {n: p.hands})}))}">${esc(pos)}</div>`;
  };
  const line = (title, p) => p ? `${title} <b>${esc(p.position)}</b> ${sgn(p.bb_per_100_ev, 0)} bb/100 <span class="m">(${t("common.handsN", {n: p.hands})})</span>` : "";
  const body = rank.ranked ? `<div class="ptable"><div class="felt"></div>${ring.map((p, k) => spot(p, k, ring.length)).join("")}</div>
      <p style="margin:6px 0 0;font-size:.88rem">${line(t("pos.strongest"), rank.best)}${rank.worst ? "<br>" + line(t("pos.weakest"), rank.worst) : ""}</p>

      ${by["BTN/SB"] ? `<p class="m" style="margin:4px 0 0">${t("pos.headsUp", {bb: sgn(by["BTN/SB"].bb_per_100_ev, 0), hands: t("common.handsN", {n: by["BTN/SB"].hands})})}</p>` : ""}`
    : `<p class="m">${t("pos.noRanking", {hands: t("common.handsN", {n: rank.min_hands})})}</p>`;

}

function bindPeriods() {
  const pick = async (period, from, to) => {
    try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                     body: JSON.stringify({dashboard_period: period, ...(from ? {dashboard_from: from, dashboard_to: to} : {})})});

  for (const id of ["periods", "p-panel", "p-session"]) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", e => { const b = e.target.closest("button[data-p]"); if (b) pick(b.dataset.p); });
  }

// ---- Time charts: a date axis, a labelled value axis and a tooltip; drawn at the real width so text stays readable
let charts = [];
function addChart(id, pts, series, fmtY, tip, opts = {}) {
  const box = document.getElementById(id);
  const draw = () => drawTimeChart(box, pts, series, fmtY, tip, opts);
  charts.push({box, draw});
  draw();
}
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => charts.forEach(c => document.body.contains(c.box) && c.draw()), 120);
});
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function drawTimeChart(box, pts, series, fmtY, tip, opts = {}) {
  if (pts.length < 2) { box.innerHTML = `<p class="m" style="padding:8px 12px">${t("chart.notEnough")}</p>`; return; }
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.max(170, Math.min(260, W * .38)));
  const L = 58, R = 14, B = 26, iw = W - L - R;
  const ts = pts.map(p => Date.parse(p.at.replace(" ", "T")));
  // x by time, or by position in the series (opts.byIndex: p.n, e.g. the hand number) with the date in the tooltip
  const xs = opts.byIndex ? pts.map(p => p.n) : ts;
  let t0 = Math.min(...xs), t1 = Math.max(...xs);
  if (t1 === t0) t1 = t0 + (opts.byIndex ? 1 : 3600e3);
  const vals = series.flatMap(s => pts.map(p => p[s.key]));
  const step = niceStep((Math.max(0, ...vals) - Math.min(0, ...vals)) / 4 || 1);
  const lo = Math.floor(Math.min(0, ...vals) / step) * step, hi = Math.ceil(Math.max(0, ...vals) / step) * step || step;
  const x = t => L + (t - t0) / (t1 - t0) * iw;
  // annotation labels go in rows above the plot so that labels close in time do not overlap
  const rowEnds = [], placed = (opts.markers || []).filter(m => !m.dot).map(m => {
    const mx = x(xs[m.i]), w = m.label.length * 6.3, end = mx > W - w - 10;
    const a = end ? mx - w - 4 : mx + 4, b = a + w;
    let row = rowEnds.findIndex(e => a > e + 8);
    if (row < 0) row = rowEnds.length < 3 ? rowEnds.length : rowEnds.indexOf(Math.min(...rowEnds));
    rowEnds[row] = b;
    return {...m, mx, row, end};
  });
  const T = 12 + rowEnds.length * 15, ih = H - T - B, y = v => T + (hi - v) / (hi - lo) * ih;
  let g = "";
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:${Math.abs(v) < step / 2 ? 1.6 : 1}"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${fmtY(Math.round(v * 100) / 100)}</text>`;
  }
  const spanH = (t1 - t0) / 3600e3, nx = Math.max(2, Math.min(6, Math.floor(iw / 110)));
  let prevLab = "";
  for (let k = 0; k <= nx; k++) {
    const t = t0 + (t1 - t0) * k / nx, d = new Date(t);
    const lab = opts.byIndex ? num(Math.round(t), 0) : spanH <= 36 ? timeLabel(d) : dayLabel(d);
    if (lab === prevLab) continue;                       // a few days on a wide axis: one label per day
    prevLab = lab;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${k === 0 ? "start" : k === nx ? "end" : "middle"}" style="fill:var(--muted);font-size:11px">${lab}</text>`;
  }
  // annotations: a dashed line and a label at the point they belong to; "dot" ones mark a single point (e.g. a bust)
  const marks = (opts.markers || []).filter(m => m.dot).map(m => `<text x="${x(xs[m.i])}" y="${y(pts[m.i][series[0].key]) + 4}"
      text-anchor="middle" style="fill:var(--neg);font-size:14px;font-weight:700">✕</text>`).join("") + placed.map(m => {
    const ly = 12 + m.row * 15;
    return `<line x1="${m.mx}" x2="${m.mx}" y1="${ly - 4}" y2="${T + ih}" style="stroke:var(--orange);stroke-dasharray:4 3"/>
      <text x="${m.mx + (m.end ? -4 : 4)}" y="${ly + 4}" text-anchor="${m.end ? "end" : "start"}"
        style="fill:var(--orange);font-size:11px;font-weight:700">${m.title ? `<title>${esc(m.title)}</title>` : ""}${esc(m.label)}</text>`;
  }).join("");
  const lines = series.map(s => `<polyline fill="none" style="stroke:${s.color};stroke-width:2;stroke-linejoin:round${s.dash ? ";stroke-dasharray:6 4" : ""}"
    points="${pts.map((p, i) => `${x(xs[i]).toFixed(1)},${y(p[s.key]).toFixed(1)}`).join(" ")}"/>`).join("");
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"${opts.onPick ? ' style="cursor:pointer"' : ""}>${g}${marks}${lines}
    <g id="hover" style="display:none"><line y1="${T}" y2="${T + ih}" style="stroke:var(--muted);stroke-dasharray:3 3"/>
      ${series.map(s => `<circle r="4" style="fill:${s.color};stroke:var(--bg);stroke-width:2"/>`).join("")}</g>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = box.querySelector("svg"), hov = svg.querySelector("#hover"), tipEl = box.querySelector(".tip");
  const show = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let i = 0;
    xs.forEach((t, k) => { if (Math.abs(x(t) - mx) < Math.abs(x(xs[i]) - mx)) i = k; });
    const px = x(xs[i]);
    hov.style.display = "";
    hov.querySelector("line").setAttribute("x1", px); hov.querySelector("line").setAttribute("x2", px);
    hov.querySelectorAll("circle").forEach((c, k) => { c.setAttribute("cx", px); c.setAttribute("cy", y(pts[i][series[k].key])); });
    const at = new Date(ts[i]), when = LANG === "pl" ? `${dayLabel(at)}, ${timeLabel(at)}`
      : at.toLocaleString("en-GB", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
    tipEl.innerHTML = `<span class="m">${when}</span><br>${tip(pts[i])}`;
    tipEl.style.display = "block";
    const left = px * r.width / W, w = tipEl.offsetWidth;
    tipEl.style.left = Math.max(4, Math.min(r.width - w - 4, left + (left > r.width / 2 ? -w - 12 : 12))) + "px";
    tipEl.style.top = "8px";
  };
  const nearest = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    return xs.reduce((best, t, k) => Math.abs(x(t) - mx) < Math.abs(x(xs[best]) - mx) ? k : best, 0);
  };
  if (opts.onPick) svg.addEventListener("click", e => opts.onPick(pts[nearest(e)]));
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => { hov.style.display = "none"; tipEl.style.display = "none"; });
}


// ---- Tournaments ------------------------------------------------------------

// the period's bounds come from the server, so the list and the dashboard agree (sessions, custom days, time zone)

const inPeriod = date => (!bounds.since || String(date) >= bounds.since.slice(0, 16)) && (!bounds.until || String(date) <= bounds.until.slice(0, 16));
async function loadBounds() { bounds = await api("/api/period" + periodQuery(filters.period, filters.from, filters.to)); }
// "Oct 10" / "10.10", with the year only when it is not this year: keeps the date column narrow
const shortDate = s => {
  const d = new Date(String(s).slice(0, 10) + "T12:00");
  if (isNaN(d)) return esc(String(s).slice(0, 10));
  const other = d.getFullYear() !== new Date().getFullYear();
  if (LANG === "pl") return dayLabel(d) + (other ? "." + d.getFullYear() : "");
  return d.toLocaleDateString("en-US", {month: "short", day: "numeric", ...(other ? {year: "numeric"} : {})});
};

    <select id="fb">${opts(all.map(x => x.buyin_total), filters.buyin, t("filter.allBuyins"), money)}</select>
    <select id="ff">${opts(all.map(x => x.format), filters.format, t("filter.allFormats"), v => t("format." + v))}</select>
    <select id="fe"><option value="">${t("filter.anyEntry")}</option><option value="start" ${filters.entry === "start" ? "selected" : ""}>${t("filter.fromStart")}</option>
      <option value="late" ${filters.entry === "late" ? "selected" : ""}>${t("filter.late")}</option></select></div><div id="list"></div>`;

// the stack in big blinds or in chips (a deep run can grow in chips while it falls in big blinds); remembered per viewer
let stackUnit = "bb";
try { stackUnit = localStorage.getItem("stackUnit") === "chips" ? "chips" : "bb"; } catch (e) { /* storage blocked */ }
function stackLine(d) {
  const pts = d.stack.points, s = d.stack;
  if (stackUnit === "bb")
    return t("tour.stackLine", {start: bbUnit(s.start_bb, 0), end: bbUnit(s.end_bb, 0), peak: bbUnit(s.peak_bb, 0), n: s.peak_after_hands});
  const path = [pts[0].before, ...pts.map(p => p.after)], k = path.reduce((b, v, i) => v > path[b] ? i : b, 0);
  return t("tour.stackLine", {start: chipsShort(path[0]), end: chipsShort(path[path.length - 1]), peak: chipsShort(path[k]), n: k});
}
function stackChart(d) {
  const pts = d.stack.points, idx = Object.fromEntries(pts.map((p, i) => [p.hand_id, i])), chips = stackUnit === "chips";
  const markers = d.entries.filter(e => e.first_hand_id in idx).map(e => ({
    i: idx[e.first_hand_id],
    label: `${e.entry_no === 1 ? t(e.level > 1 ? "stack.lateReg" : "stack.start") : t("stack.reentry", {no: e.entry_no})} · L${e.level} · ${chips ? chipsShort(e.stack) : bbUnit(e.stack_bb, 0)}`,
    title: t("stack.entryTitle", {no: e.entry_no, level: e.level, chips: num(e.stack, 0), bb: num(e.stack_bb, 1)})
      + (d.starting_stack == null ? "" : Math.abs(e.stack - d.starting_stack) < 1 ? t("stack.full") : "")}));
  pts.forEach((p, i) => { if (p.after_bb <= 0) markers.push({i, dot: true}); });
  charts = [];
  addChart("c-stack", pts, [{key: chips ? "after" : "after_bb", color: "var(--blue)"}], v => chips ? chipsShort(v) : bbUnit(v, 0),
    p => t("stack.tip", {level: p.level, pos: esc(p.position || ""), cards: p.cards ? cards(p.cards) : "", net: sgn(p.net_bb),
                         before: num(p.before_bb, 0), after: num(p.after_bb, 0), beforeChips: num(p.before, 0),
                         afterChips: num(p.after, 0), bb: num(p.big_blind, 0)}),
    {markers, onPick: p => { location.hash = `#/hand/${p.hand_id}`; }});
}

// ---- Replayer -----------------------------------------------------------------
// The server sends full snapshots (pot, stacks, bets, board); this code only draws them.
let replay = null, step = 0, playTimer = null;
const SPEEDS = {slow: 1500, normal: 900, fast: 450};
const VERBS = {folds: "folds", checks: "checks", calls: "calls", bets: "bets", raises: "raises to"};
const bbs = (x, bb) => num(x / bb, Math.abs(x / bb) >= 100 ? 0 : 1);
const pcard = (c, cls = "") => `<span class="pc s-${esc(c[1])} ${cls}">${esc(c[0])}<i>${SUIT[c[1]] || ""}</i></span>`;

function seatPoint(r, seat, f = 1) {
  // Seats are numbered clockwise; slot 0 (Hero) is bottom centre, angles grow clockwise on screen.
  const n = r.max_seats || Math.max(...r.steps[0].players.map(p => p.seat)), hero = r.steps[0].players.find(p => p.hero);
  const k = ((seat - (hero ? hero.seat : 1)) % n + n) % n, t = Math.PI / 2 + k * 2 * Math.PI / n;
  const narrow = matchMedia("(max-width:560px)").matches, rx = narrow ? 40 : 43, ry = narrow ? 41 : 39;
  return [50 + rx * f * Math.cos(t), 50 + ry * f * Math.sin(t)];
}
const at = ([x, y]) => `left:${x.toFixed(2)}%;top:${y.toFixed(2)}%`;

function logLine(s, r) {
  const bb = r.big_blind;
  if (s.kind === "start") return t("replay.blinds", {sb: num(r.small_blind, 0), bb: num(r.big_blind, 0)}) + (r.ante ? t("replay.ante", {x: num(r.ante, 0)}) : "");
  if (s.kind === "deal") return `<span class="cs">${cards(s.board)}</span>`;
  if (s.kind === "return") return `<span>${t("replay.returned", {who: s.action.nick === "Hero" ? "<b>Hero</b>" : esc(s.action.nick)})}</span><span>${bbs(s.action.amount, bb)} BB</span>`;
  if (s.kind === "result") {
    const w = s.players.filter(p => p.net > 0);
    return w.length ? w.map(p => `<span>${t("replay.wins", {who: p.hero ? "<b>Hero</b>" : esc(p.nick)})}</span><span>${sgn(p.net / bb, 1)} BB</span>`).join("") : t("replay.noWinner");
  }
  if (s.kind === "action") {
    const a = s.action, who = a.nick === "Hero" ? "<b>Hero</b>" : esc(a.nick);
    const amt = a.amount && a.type !== "folds" ? ` <span>${bbs(a.amount, bb)} BB</span>` : "";
    return `<span>${who} ${VERBS[a.type] || esc(a.type)}${a.all_in ? " <b>all-in</b>" : ""}</span>${amt}`;
  }
  return esc(s.label);
}

async function viewHand(id) {
  stopPlay();
  const mine = routeSeq, r = await api(`/api/hand/${id}`);
  if (mine !== routeSeq) return;
  replay = r; step = 0;
  renderHand();
}
function renderHand() {
  const r = replay, [i, n] = r.position_in_tournament;
  let log = "", street = null;
  r.steps.forEach((s, k) => {
    if (s.kind !== "result" && s.street !== street) { street = s.street; log += `<div class="sh">${esc(street)}</div>`; }
    if (s.kind === "result") log += `<div class="sh">${t("replay.result")}</div>`;
    log += `<div class="li" data-k="${k}">${s.kind === "deal" ? `<span class=m>${t("replay.board")}</span>` : ""}${logLine(s, r)}</div>`;
  });
  const n0 = r.max_seats || 9, taken = new Set(r.steps[0].players.map(p => p.seat));
  const empty = Array.from({length: n0}, (_, k) => k + 1).filter(k => !taken.has(k))
    .map(k => `<div class="seat0" style="${at(seatPoint(r, k))}"></div>`).join("");
  const btn = r.steps[0].players.find(p => (p.position || "").startsWith("BTN"));
  app.innerHTML = `<p><a href="#/t/${r.tournament_id}">${t("replay.back")}</a></p>
    <h1>${t("replay.title", {i, n})}</h1><p class="m">${t("replay.info", {level: r.level, sb: num(r.small_blind, 0), bb: num(r.big_blind, 0),
      ante: num(r.ante, 0), table: esc(r.table), at: dateTime(r.played_at)})}</p>
    <div class="rt"><div>
      <div class="stage" id="stage"><div class="oval"></div>${empty}
        ${btn ? `<div class="dealer" style="${at(seatPoint(r, btn.seat + .32, .74))}">D</div>` : ""}
        <div class="center"><div class="street" id="street"></div><div class="board" id="board"></div><div class="pot" id="pot"></div><div class="eqline" id="eq"></div></div>
        <div id="seats"></div></div>
      <div class="ctl">
        <button id="b0" title="${t("replay.startKey")}">⏮</button><button id="b1" title="${t("replay.backKey")}">◀</button>
        <button id="bp" class="primary" title="${t("replay.playKey")}">${t("replay.play")}</button>
        <button id="b2" title="${t("replay.nextKey")}">▶</button><button id="b3" title="${t("replay.endKey")}">⏭</button>
        <select id="spd" title="${t("replay.speed")}">${["slow", "normal", "fast"].map(k => `<option value="${k}" ${k === "normal" ? "selected" : ""}>${t("replay." + k)}</option>`).join("")}</select>
        <span class="m" id="cnt"></span>
        <label class="m" title="${t("replay.deckTip")}"><input type="checkbox" id="deck4" ${document.body.classList.contains("two-color") ? "" : "checked"}> ${t("replay.deck")}</label>
      </div>
      <p class="ctl">${r.prev_id ? `<a href="#/hand/${r.prev_id}">${t("replay.prev")}</a>` : ""} &nbsp; ${r.next_id ? `<a href="#/hand/${r.next_id}">${t("replay.next")}</a>` : ""}</p>
    </div><div class="log" id="log">${log}</div></div>`;
  const go = k => { step = Math.max(0, Math.min(r.steps.length - 1, k)); drawStep(); };
  replay.go = go;
  document.getElementById("b0").onclick = () => { stopPlay(); go(0); };
  document.getElementById("b1").onclick = () => { stopPlay(); go(step - 1); };
  document.getElementById("b2").onclick = () => { stopPlay(); go(step + 1); };
  document.getElementById("b3").onclick = () => { stopPlay(); go(r.steps.length - 1); };
  document.getElementById("bp").onclick = togglePlay;
  document.getElementById("spd").onchange = () => { if (playTimer) { stopPlay(); togglePlay(); } };
  document.getElementById("deck4").onchange = e => setDeck(e.target.checked);
  document.getElementById("log").onclick = e => { const li = e.target.closest(".li"); if (li) { stopPlay(); go(+li.dataset.k); } };
  drawStep();
}

async function setDeck(fourColor) {
  document.body.classList.toggle("two-color", !fourColor);
  try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                   body: JSON.stringify({four_color: fourColor})}); } catch (e) { /* still applied for this session */ }
}

function togglePlay() {
  if (playTimer) return stopPlay();
  if (step >= replay.steps.length - 1) replay.go(0);
  playTimer = setInterval(() => {
    if (!replay || !document.getElementById("stage")) return stopPlay();
    replay.go(step + 1);
    if (step >= replay.steps.length - 1) stopPlay();
  }, SPEEDS[document.getElementById("spd").value]);
  document.getElementById("bp").textContent = t("replay.pause");
}
function stopPlay() {
  clearInterval(playTimer); playTimer = null;
  const b = document.getElementById("bp"); if (b) b.textContent = t("replay.play");
}

function drawStep() {
  const r = replay, s = r.steps[step], bb = r.big_blind, prev = r.steps[step - 1];
  document.getElementById("street").textContent = s.result ? t("replay.result") : s.street;
  const fresh = step === 0 || !prev ? 0 : prev.board.length;
  document.getElementById("board").innerHTML = [0, 1, 2, 3, 4].map(k => s.board[k]
    ? pcard(s.board[k], k >= fresh && s.board.length > fresh && step ? "new" : "") : `<span class="pc slot"></span>`).join("");
  document.getElementById("pot").innerHTML = s.result
    ? t("replay.potPaid", {bb: bbs(r.total_pot, bb), chips: num(r.total_pot, 0)})
    : t("replay.pot", {bb: bbs(s.pot, bb), chips: num(s.pot, 0)});
  const hero = s.players.find(p => p.hero);
  document.getElementById("eq").innerHTML = !(hero && hero.equity != null && r.hero_allin) ? ""
    : s.result ? `${t("replay.eqResult", {eq: num(100 * r.hero_allin.equity, 1), luck: sgn(r.hero_allin.luck / bb, 1, " BB")})}
        <a href="#/luck" style="color:#fff">${t("replay.how")}</a>`
    : t("replay.eq", {eq: num(100 * hero.equity, 1)}) + (prev && prev.players.find(p => p.hero).equity == null ? t("replay.atAllin") : "");
  const eqChanged = p => { const q = prev && prev.players.find(x => x.nick === p.nick); return q && q.equity != null && q.equity !== p.equity; };
  document.getElementById("seats").innerHTML = s.players.map(p => {
    const won = s.result && (r.collected[p.nick] || 0) > 0;
    const cls = ["st", p.hero && "hero", p.folded && "fold", p.acting && "act", !p.acting && s.next === p.nick && "nxt", won && "win"].filter(Boolean).join(" ");
    const hole = p.folded && !p.hero ? "" : p.cards.length ? p.cards.map(c => pcard(c)).join("") : `<span class="pc back"></span><span class="pc back"></span>`;
    const bet = won ? `<div class="bet won" style="${at(seatPoint(r, p.seat, .6))}">+${bbs(r.collected[p.nick], bb)} BB</div>`
      : `<div class="bet ${p.commit ? "" : "off"}" style="${at(seatPoint(r, p.seat, .6))}">${p.commit ? bbs(p.commit, bb) : 0} BB</div>`;
    const res = p.net != null ? ` <span style="font-size:.78rem">${sgn(p.net / bb, 1)}</span>` : "";
    return `<div class="${cls}" style="${at(seatPoint(r, p.seat))}" title="${esc(t("replay.chips", {nick: p.nick, chips: num(p.stack, 0)}))}">
        <div class="hc">${hole}</div>
        <div class="box">${p.hero ? `<span class="pt">${esc(p.position || "")}</span>` : ""}
          ${p.equity != null && !s.result ? `<span class="badge eq ${eqChanged(p) ? "chg" : ""}">${num(100 * p.equity, 0)}%</span>` : ""}
          <div class="nick">${esc(p.nick)}</div><div class="stk">${bbs(p.stack, bb)} BB${res}</div>
          ${p.all_in && !s.result ? `<span class="badge ai">ALL-IN</span>` : ""}</div></div>${bet}`;
  }).join("");
  document.getElementById("cnt").textContent = `${step + 1} / ${r.steps.length}`;
  const log = document.getElementById("log");
  log.querySelectorAll(".li").forEach(li => li.classList.toggle("cur", +li.dataset.k === step));
  const cur = log.querySelector(".li.cur");
  if (cur && log.scrollHeight > log.clientHeight)
    log.scrollTop = Math.max(0, cur.offsetTop - log.offsetTop - log.clientHeight / 2 + cur.offsetHeight / 2);
}
document.addEventListener("keydown", e => {
  if (!replay || !location.hash.startsWith("#/hand/") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = {ArrowRight: "b2", ArrowLeft: "b1", Home: "b0", End: "b3", " ": "bp"}[e.key];

});
// Seat positions depend on the table shape, which changes at the narrow breakpoint
matchMedia("(max-width:560px)").addEventListener("change", () => {

});

// Always the whole history. Built-in tips from clear rules; a finding shows only when it stands out from chance.
const conf = c => t(c === "likely" ? "conf.likely" : "conf.possible");
function findingNumber(l) {
  const inHands = t("find.inHands", {n: l.hands});
  if (l.kind === "vs_fold") return `${t("find.vsFold", {value: sgn(l.value, 2, " BB")})}
    <div class="m" style="font-weight:400">${t("find.vsFoldDetail", {played: sgn(l.played, 2), folded: sgn(l.folded, 2), hands: t("common.handsN", {n: l.hands})})}</div>`;
  if (l.kind === "vs_fold_total") return t("find.vsFoldTotal", {value: sgn(l.value, 0, " BB"), inHands});
  if (l.kind === "frequency") return `${t("find.freq", {value: num(l.value, 1), n: l.hands})} <div class="m" style="font-weight:400">${esc(l.guide)}</div>`;
  if (l.kind === "bb_per_100") return t("find.per100", {value: sgn(l.value, 1), inHands});
  return t("find.total", {value: sgn(l.value, 0, " BB"), inHands});
}
const worstList = hands => `<details><summary>${t("find.showWorst", {n: hands.length})}</summary>${table([t("col.when"), t("col.pos"), t("col.cards"), t("col.stack"), t("col.bbEvAdj"), "BB"],
  hands.map(x => `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'"><td>${dateTime(x.at)}</td><td>${esc(x.position || "")}</td>
    <td>${x.cards ? cards(x.cards) : "–"}</td><td>${bbUnit(x.stack_bb, 0)}</td><td>${sgn(x.adj_bb)}</td><td>${sgn(x.net_bb)}</td></tr>`))}</details>`;

const ANALYSIS_TABS = ["overview", "preflop", "depth", "leaks", "money"];   // labels: an.tab.<key>

// Analysis v2: a rate over its opportunities, "31,1%" with n under it; greyed below the minimum; definitions in tooltips
const defHead = (label, key) => `<span class="def" title="${esc(t("def." + key))}">${label}</span>`;
function rateCell(r, key, title) {
  if (!r || !r.n) return `<td class="m">–</td>`;
  const tip = r.few ? t("common.few", {min: t("common.opps", {n: 30})}) : title || t("def." + key);
  return `<td class="${r.few ? "few" : ""}" title="${esc(tip)}">${pct(r.pct)}<small>${t("common.n", {n: num(r.n, 0)})}</small></td>`;
}
const STAT_LABEL = {vpip: "VPIP", pfr: "PFR", threebet: "3-bet"};
function trendArrow(tr, key) {
  if (!tr.arrow || tr.arrow.key !== key) return "";
  return ` <span class="${tr.arrow.up ? "pos" : "neg"}" title="${esc(t(tr.arrow.up ? "trend.up" : "trend.down"))}">${tr.arrow.up ? "▲" : "▼"}</span>`;
}
function trendNote(tr) {
  const stats = Object.entries(tr.stats);
  let state;
  if (!stats.length) state = t("trend.few", {recent: num(tr.recent_hands, 0), older: num(tr.older_hands, 0)});
  else {
    const [k, s] = tr.arrow ? [tr.arrow.key, tr.stats[tr.arrow.key]] : stats.reduce((a, b) => Math.abs(b[1].z) > Math.abs(a[1].z) ? b : a);
    state = t(tr.arrow ? "trend.shown" : "trend.none", {stat: STAT_LABEL[k], recent: pct(s.recent), older: pct(s.older)});
  }
  return `<p class="m">${t("trend.note", {state})}</p>`;
}
function rateTile(label, key, r, tr) {
  const s = tr.stats[key];
  return `<div class="${r.few ? "few" : ""}"><span>${defHead(label, key)}${trendArrow(tr, key)}</span><b>${pct(r.pct)}</b>
    <span class="m">${t("common.n", {n: num(r.n, 0)})}${s ? " · " + t("trend.recent", {x: pct(s.recent)}) : ""}</span></div>`;
}
// cumulative BB over hand number: total, with and without showdown, and the total by all-in EV (dashed)
const SD_LINES = [["total", "sd.total", "sd.tipTotal", "var(--fg)"], ["sd", "sd.sd", "sd.tipSd", "var(--blue)"],
  ["nsd", "sd.nsd", "sd.tipNsd", "var(--neg)"], ["ev", "sd.ev", "sd.tipEv", "var(--muted)", true]];
function showdownBox(sd) {
  if (!sd || sd.hands < 30) return `<p class="m">${t("sd.few")}</p>`;
  return `<div class="box" style="margin:14px 0"><h3 style="margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">${t("sd.title")}</h3>
    <div class="tchart" id="c-sd"></div>
    <div class="sd-legend">${SD_LINES.map(([k, label, tip, color, dash]) => `<span title="${esc(t(tip))}"><i class="${dash ? "dash" : ""}" style="background:${color}"></i>${t(label)}: <b>${sgn(sd.final[k], 0, " BB")}</b></span>`).join("")}</div>
    <p class="m" style="margin:6px 0 0">${t("sd.note", {hands: t("common.handsN", {n: sd.hands}), showdowns: num(sd.showdowns, 0)})}</p></div>`;
}
function showdownChart(sd) {
  if (!sd || sd.hands < 30 || !document.getElementById("c-sd")) return;
  addChart("c-sd", sd.points, SD_LINES.map(([key, , , color, dash]) => ({key, color, dash})), v => bbUnit(v, 0),
    p => t("sd.point", {n: num(p.n, 0), total: sgn(p.total, 0), sd: sgn(p.sd, 0), nsd: sgn(p.nsd, 0), ev: sgn(p.ev, 0)}),
    {byIndex: true});
}
function preflopTable(rows, total, first, firstLabel, depth) {
  const head = [firstLabel, t("col.hands"), defHead("VPIP", "vpip"), defHead("PFR", "pfr"), defHead(t("col.rfi"), "rfi"),
    ...(depth ? [defHead(t("col.openShove"), "shove")] : []), defHead(t("col.threebet"), "threebet"),
    ...(depth ? [] : [defHead(t("col.fold3"), "fold3")]), defHead(t("col.ev100"), "ev100")];
  const row = (r, label, cls = "") => `<tr class="${cls}"><td>${label}</td><td class="${r.few ? "few" : ""}">${num(r.hands, 0)}</td>
    ${rateCell(r.vpip, "vpip")}${rateCell(r.pfr, "pfr")}${rateCell(r.rfi, "rfi")}
    ${depth ? rateCell(r.shove, "shove", t("def.shoveCell", {band: esc(label), count: r.shove.count, n: r.shove.n})) : ""}${rateCell(r.threebet, "threebet")}
    ${depth ? "" : rateCell(r.fold3, "fold3")}<td class="${r.few ? "few" : ""}">${sgn(r.ev100, 1)}</td></tr>`;
  return table(head, [...rows.map(r => row(r, esc(r[first]), depth && r.high <= 15 ? "hl" : "")),
                      ...(total ? [row(total, `<b>${t("an.total")}</b>`, "tot")] : [])], "pf");
}

// a 95 % interval as a small bar with the zero line; red when wholly below zero, green when above
function ciBar(iv) {
  if (!iv) return '<span class="m">–</span>';
  const lo = Math.min(-100, iv.low), hi = Math.max(100, iv.high), x = v => 100 * (v - lo) / (hi - lo);
  const cls = iv.high < 0 ? "neg" : iv.low > 0 ? "pos" : "mid";
  return `<span class="ci" title="${esc(t("an.ciTitle", {lo: num(iv.low, 0), hi: num(iv.high, 0)}))}"><span class="ci-zero" style="left:${x(0)}%"></span>
    <span class="ci-range ${cls}" style="left:${x(iv.low)}%;width:${Math.max(1.5, x(iv.high) - x(iv.low))}%"></span></span>
    <span class="m" style="font-size:.8rem">${num(iv.low, 0)}…${num(iv.high, 0)}%</span>`;
}
const verdict = g => g.confidence ? `<span class="conf ${g.profit < 0 ? "v-neg" : "v-pos"}">${esc(g.verdict)}${g.confidence === "possible" ? t("money.possible") : ""}</span>`
  : `<span class="m">${esc(g.verdict)}</span>`;

          <td>${money(g.returned)}</td><td>${g.roi_pct == null ? "–" : sgn(g.roi_pct, 0, "%")}</td>

// ---- Import -----------------------------------------------------------------
let poller = null;
const REASONS = {"Sit & Go": "sng", "PLO/Omaha": "omaha", "other game": "other", "not in $": "currency", "cash game": "cash",
                 "freeroll": "freeroll", "unrecognised summary": "unrecognised", "ignored": "ignored"};
const fileList = files => `<ul style="margin:4px 0 0 18px;padding:0">${files.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
const resultBox = r => `<div class="box"><b>${t(r.source === "auto" ? "imp.auto" : "imp.done")}</b>
  <span class="m">${dateTime(String(r.finished_at || "").replace("T", " "))}</span><br>
  ${t("imp.result", {files: r.files, hand_files: r.hand_files, summary_files: r.summary_files, unchanged: r.unchanged,
    new: r.hands_new, dup: r.hands_duplicate, allins: r.allins, tournaments: r.tournaments})}
  ${Object.keys(r.ignored || {}).length ? `<p class="m">${t("imp.ignored", {list:
    Object.entries(r.ignored).map(([why, n]) => REASONS[why] ? t("imp.reason." + REASONS[why], {n}) : `${n} ${esc(why)}`).join(", ")})}</p>` : ""}
  ${Object.entries(r.ignored_files || {}).map(([why, files]) => `<div class="m" style="margin-top:6px">${t("imp.filesOf." + REASONS[why])}${fileList(files)}</div>`).join("")}
  ${(r.to_check || []).length ? `<div class="warn" style="margin-top:8px">${t("imp.formatWarning", {n: r.to_check.length})}${fileList(r.to_check)}</div>` : ""}
  <p><a href="#/">${t("imp.openDashboard")}</a></p>${r.skipped.length ? `<p class="m">${t("imp.skipped")} ${r.skipped.map(x => typeof x === "string" ? esc(x)          // saved by an older version
    : `${esc(x.file)}: ${t("imp.skip." + x.code, {detail: esc(x.detail)})}`).join("<br>")}</p>` : ""}</div>`;
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                        body: JSON.stringify(body)});
const reasonText = r => t(REASONS[r] ? "reason." + REASONS[r] : "reason.other");
// tournaments with a checkbox each: ticked ones are imported or kept; ones a rule leaves out are greyed and disabled
function pickRows(list) {
  return list.map(r => {
    const note = r.reason ? reasonText(r.reason) : r.to_check ? t("reason.toCheck") : r.in_database ? t("imp.already") : "";
    return `<tr class="${r.reason ? "off" : ""}"><td><input type="checkbox" class="pick" data-id="${r.tournament_id}" ${r.reason ? "disabled" : "checked"}></td>
      <td>${r.date ? shortDate(r.date) : "–"}</td><td style="text-align:left;white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td>
      <td>${r.buyin == null ? "–" : money(r.buyin)}</td>
      <td>${r.hands || (r.hands_stored ? `<span class="m">${t("imp.inDb", {n: r.hands_stored})}</span>` : 0)}</td>
      <td>${t(r.summary ? "common.yes" : "common.no")}</td><td class="vcell m">${note}</td></tr>`;
  });
}
const pickHead = () => ["", t("col.date"), t("col.tournament"), t("col.buyin"), t("col.hands"), t("col.summary"), t("col.note")];
function bindPicks(box, button, label) {
  const picks = [...box.querySelectorAll("input.pick:not([disabled])")];
  const count = () => { button.textContent = label(picks.filter(c => c.checked).length); };
  picks.forEach(c => { c.onchange = count; });
  count();
  return {all: () => { picks.forEach(c => { c.checked = true; }); count(); },
          unticked: () => picks.filter(c => !c.checked).map(c => +c.dataset.id)};
}

let previewAsked = false;                               // a preview shows only for the import started on this screen
async function viewImport() {
  const mine = routeSeq, st = await api("/api/settings");
  if (mine !== routeSeq) return;
  app.innerHTML = `<h1>${t("nav.import")}</h1>
    <p>${t("imp.intro")}</p>
    <div class="filters"><input id="folder" style="flex:1;min-width:240px" placeholder="${esc(t("imp.placeholder"))}" value="${esc(st.import_folder || "")}">
    <button id="go" class="primary">${t("imp.go")}</button></div>
    <p><label><input type="checkbox" id="watch" ${st.watch ? "checked" : ""}> ${t("imp.watch")}</label><br>
       <label><input type="checkbox" id="rescan"> ${t("imp.rescan")}</label></p>
    <div id="out"></div><p class="m">${t("imp.database", {db: esc(st.database)})}</p>`;
  const out = document.getElementById("out"), btn = document.getElementById("go");
  const folder = () => document.getElementById("folder").value, rescan = () => document.getElementById("rescan").checked;
  const picker = p => {
    if (!p.tournaments.length) { out.innerHTML = `<div class="box">${t("imp.previewNone")}</div>`; return; }
    out.innerHTML = `<div class="box"><b>${t("imp.previewTitle", {tournaments: t("common.tournaments", {n: p.tournaments.length})})}</b>
      ${p.fuse ? `<p class="warn">${t("imp.formatWarning", {n: p.tournaments.filter(r => r.to_check).length})}</p>` : ""}
      ${table(pickHead(), pickRows(p.tournaments), "scrollbox picks")}
      <p class="m">${t("imp.untickNote")}</p>
      <div class="filters"><button id="pick-all">${t("imp.selectAll")}</button><button id="pick-go" class="primary"></button>
        <button id="pick-cancel">${t("common.cancel")}</button></div></div>`;
    const picks = bindPicks(out, document.getElementById("pick-go"), n => t("imp.importSelected", {n}));
    document.getElementById("pick-all").onclick = picks.all;
    document.getElementById("pick-cancel").onclick = () => { previewAsked = false; out.innerHTML = ""; };
    document.getElementById("pick-go").onclick = async () => {
      const off = new Set(picks.unticked());
      const ignore = p.tournaments.filter(r => off.has(r.tournament_id)).map(r => ({id: r.tournament_id, name: r.name, files: r.files}));
      previewAsked = false;
      try { await post("/api/import", {path: folder(), rescan: rescan(), ignore}); poll(); }
      catch (err) { out.innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
    };
  };
  const show = s => {
    if (s.running) {
      btn.disabled = true;
      out.innerHTML = `<div class="box"><b>${t(s.mode === "preview" ? "imp.previewing" : s.source === "auto" ? "imp.runningAuto" : "imp.running")}</b>
        <progress max="${s.total || 1}" value="${s.done}" style="width:100%"></progress>
        <p class="m">${t("imp.progress", {done: s.done, total: s.total})}${s.current ? " · " + esc(s.current) : ""}.${s.mode === "preview" ? "" : " " + t("imp.slow")}</p></div>`;
      return;
    }
    btn.disabled = false;
    if (s.error) out.innerHTML = `<p class="warn">${t("imp.failed", {e: esc(s.error)})}</p>`;
    else if (s.mode === "preview" && s.preview && previewAsked) picker(s.preview);
    else if (s.result || s.last_import) out.innerHTML = resultBox(s.result || s.last_import);
  };
  const poll = async () => {
    const s = await api("/api/status");
    show(s);
    clearTimeout(poller);
    if (s.running && location.hash === "#/import") poller = setTimeout(poll, 700);
  };
  btn.onclick = async () => {                             // first a preview: nothing is written until "Import selected"
    try { previewAsked = true; await post("/api/import/preview", {path: folder(), rescan: rescan()}); poll(); }
    catch (err) { out.innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
  };
  document.getElementById("watch").onchange = e => post("/api/watch", {enabled: e.target.checked});
  poll();
}

// ---- After an automatic import: a notice on every screen, and a review of what came in -------------------------
const notice = document.getElementById("notice");
const markSeen = async at => { notice.innerHTML = ""; try { await post("/api/display", {import_seen: at}); } catch (e) { /* shown again later */ } };
async function checkNotice() {
  try {
    const s = await api("/api/status"), li = s.last_import;
    const show = li && li.source === "auto" && li.tournaments && li.finished_at !== s.import_seen && location.hash !== "#/review";
    notice.innerHTML = show ? `<div class="notice">${t("notice.auto", {tournaments: t("common.tournaments", {n: li.tournaments})})}
      <a href="#/review">${t("notice.review")}</a><button id="notice-x" title="${esc(t("notice.dismiss"))}">×</button></div>` : "";
    if (show) document.getElementById("notice-x").onclick = () => markSeen(li.finished_at);
  } catch (e) { /* the notice can wait */ }
}
setInterval(checkNotice, 15000);

async function viewReview(msg) {
  const mine = routeSeq, r = await api("/api/review");
  if (mine !== routeSeq) return;
  if (r.finished_at) markSeen(r.finished_at);
  let h = `<h1>${t("rev.title")}</h1>${msg ? `<p class="box">${msg}</p>` : ""}`;
  if (!r.tournaments.length) { app.innerHTML = h + (msg ? "" : `<p class="m">${t("rev.none")}</p>`); return; }
  const rows = r.tournaments.map(x => ({tournament_id: x.tournament_id, date: x.date, name: x.name, buyin: x.buyin_total,
                                        hands: x.hands, summary: x.has_summary}));
  app.innerHTML = h + `<p class="m">${dateTime(String(r.finished_at || "").replace("T", " "))} · ${t("rev.intro")}</p>
    ${table(pickHead(), pickRows(rows), "scrollbox picks")}
    <div class="filters" style="margin-top:10px"><button id="pick-all">${t("imp.selectAll")}</button><button id="rev-save" class="primary">${t("rev.save")}</button></div>`;
  const picks = bindPicks(app, document.createElement("span"), () => "");
  document.getElementById("pick-all").onclick = picks.all;
  document.getElementById("rev-save").onclick = async () => {
    const ids = picks.unticked();
    if (ids.length) await post("/api/ignore", {ids});
    viewReview(ids.length ? t("rev.saved", {n: ids.length}) : "");
  };
}

// ---- Settings: the ignore list ---------------------------------------------------------------------------------
async function viewSettings(msg) {
  const mine = routeSeq, x = await api("/api/excluded");
  if (mine !== routeSeq) return;
  const ign = x.ignored.map(r => `<tr><td>${dateTime(String(r.excluded_at || "").replace("T", " "))}</td>
    <td style="text-align:left;white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td>
    <td><button data-restore="${r.tournament_id}">${t("set.restore")}</button></td></tr>`);
  const rules = x.rules.map(r => `<tr><td style="white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td><td>${reasonText(r.reason)}</td></tr>`);
  app.innerHTML = `<h1>${t("nav.settings")}</h1>${msg ? `<p class="box">${msg}</p>` : ""}
    <h2>${t("set.ignored")}</h2><p class="m">${t("set.ignoredIntro")}</p>
    ${ign.length ? table([t("col.ignoredAt"), t("col.tournament"), ""], ign, "names") : `<p class="m">${t("set.none")}</p>`}
    <h2>${t("set.rules")}</h2><p class="m">${t("set.rulesIntro")}</p>
    ${rules.length ? table([t("col.tournament"), t("col.reason")], rules) : `<p class="m">${t("set.rulesNone")}</p>`}`;
  app.querySelectorAll("[data-restore]").forEach(b => {
    b.onclick = async () => {
      const r = await post("/api/restore", {id: +b.dataset.restore});
      viewSettings(t(r.files_found ? "set.restored" : "set.restoredNoFiles"));
    };
  });
}

// ---- Router -----------------------------------------------------------------
let routeSeq = 0;                                       // views drawn after a newer route started are dropped
async function route(keepScroll) {
  routeSeq++;
  const h = location.hash || "#/", y = window.scrollY;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on",
    a.getAttribute("href") === h || h.startsWith(a.getAttribute("href") + "?")
      || (a.getAttribute("href") === "#/tournaments" && /^#\/(t|hand)\//.test(h))));
  if (!h.startsWith("#/hand/")) { replay = null; stopPlay(); }
  try {
    let m;
    if (h === "#/" || h === "#") await viewDashboard();
    else if (h === "#/tournaments" || h.startsWith("#/tournaments?")) {
      const q = new URLSearchParams(h.split("?")[1] || "");
      if (q.get("period")) Object.assign(filters, {period: q.get("period"), from: q.get("from") || "", to: q.get("to") || ""});
      await viewTournaments();
    }
    else if ((m = h.match(/^#\/t\/(\d+)$/))) await viewTournament(m[1]);
    else if ((m = h.match(/^#\/hand\/(\w+)$/))) await viewHand(m[1]);
    else if (h === "#/analysis" || h.startsWith("#/analysis?")) await viewAnalysis(new URLSearchParams(h.split("?")[1] || "").get("tab"));
    else if (h === "#/import") await viewImport();
    else if (h === "#/luck") viewLuck();
    else if (h === "#/review") await viewReview();
    else if (h === "#/settings") await viewSettings();
    else app.innerHTML = `<p>${t("common.notFound")}</p>`;
  } catch (err) { app.innerHTML = `<p class="warn">${t("common.error", {e: esc(err.message)})}</p>`; }
  window.scrollTo(0, keepScroll === true ? y : 0);
  checkNotice();
}
window.addEventListener("hashchange", () => route());
// the saved language, or the system language the first time
api("/api/settings").then(st => {
  document.body.classList.toggle("two-color", st.four_color === false);
  return st.lang;
}).catch(() => null).then(saved => setLang(LANGS.includes(saved) ? saved
  : (navigator.language || "").toLowerCase().startsWith("pl") ? "pl" : "en")).finally(() => route());
</script>
