<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Tracker</title>
<style>
:root{--bg:#fff;--fg:#14161a;--muted:#6b7280;--card:#f3f4f6;--line:#e5e7eb;--blue:#2f6fed;--orange:#e67e22;--pos:#0a7d2c;--neg:#c0392b;--red:#c0392b;--felt:#1f6f4a;--rail:#5a3d2b;--s-s:#14161a;--s-h:#c62828;--s-d:#1f62c9;--s-c:#1b7f37}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d;--s-s:#e8eaed;--s-h:#ff6b6b;--s-d:#5aa2ff;--s-c:#4cd37b}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
nav{max-width:960px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav a{padding:6px 10px;border-radius:8px;color:var(--fg);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--card);font-weight:600}
main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.2em 0 .4em}h2{font-size:1.02rem;margin:1.4em 0 .5em}
a{color:var(--blue)}.m{color:var(--muted);font-size:.88rem}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k div{background:var(--card);border-radius:10px;padding:10px}.k b{display:block;font-size:1.2rem}
.box{background:var(--card);border-radius:12px;padding:12px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
#list th:nth-child(2),#list td:nth-child(2){text-align:left;white-space:normal;min-width:10em}
@media (max-width:560px){#list th,#list td{padding:6px 4px}#list th:nth-child(2),#list td:nth-child(2){min-width:7em}
  #list th:nth-child(3),#list td:nth-child(3),#list th:nth-child(6),#list td:nth-child(6){display:none}
  #list .wide{display:none}}
#list .narrow{display:none}@media (max-width:560px){#list .narrow{display:inline}}tr.click{cursor:pointer}tr.click:hover{background:var(--card)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{display:inline-block;min-width:1.9em;padding:1px 4px;margin:1px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-weight:600}
.card.s-s{color:var(--s-s)}.card.s-h{color:var(--s-h)}.card.s-d{color:var(--s-d)}.card.s-c{color:var(--s-c)}
svg.chart{width:100%;height:auto;background:var(--card);border-radius:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.rt{grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:16/10.5;container-type:inline-size;user-select:none}
@media (max-width:560px){.stage{aspect-ratio:4/5}}
.oval{position:absolute;inset:13% 9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--felt) 78%,#fff) 0%,var(--felt) 62%,color-mix(in srgb,var(--felt) 70%,#000) 100%);
  border:clamp(6px,1.6cqw,12px) solid var(--rail);box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 0 26px rgba(0,0,0,.35)}
@media (max-width:560px){.oval{inset:11% 12%}}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:62%}
.street{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;min-height:1.1em}
.board{display:flex;gap:4px;justify-content:center;margin:4px 0 6px}
.pot{font-weight:700;font-size:1.02rem}.pot small{font-weight:400;opacity:.7}
.eqline{font-size:.8rem;margin-top:3px;opacity:.92}
.pc{--w:clamp(26px,5.6cqw,40px);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.14);background:#fff;color:#14161a;display:inline-flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;font-weight:700;font-size:calc(var(--w)*.46);box-shadow:0 1px 3px rgba(0,0,0,.35);flex:none}
.pc i{font-style:normal;font-size:.95em}.pc.s-s{color:#14161a}.pc.s-h{color:#c62828}.pc.s-d{color:#1f62c9}.pc.s-c{color:#1b7f37}
body.two-color .card.s-d{color:var(--s-h)}body.two-color .card.s-c{color:var(--s-s)}
body.two-color .pc.s-d{color:#c62828}body.two-color .pc.s-c{color:#14161a}
.pc.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.28);box-shadow:none}
.pc.back{background:repeating-linear-gradient(45deg,var(--blue) 0 3px,color-mix(in srgb,var(--blue) 70%,#fff) 3px 6px);border:2px solid #fff}
.pc.new{animation:deal .22s ease-out}
@keyframes deal{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .2s;z-index:1}
.st .hc{display:flex;gap:2px;margin-bottom:-8px;z-index:0}.st .hc .pc{--w:clamp(20px,4cqw,30px)}
.st.hero .hc .pc{--w:clamp(28px,5.8cqw,42px)}
.st .box{position:relative;z-index:1;min-width:clamp(64px,13cqw,104px);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:border-color .15s,box-shadow .15s}
.st .nick{font-size:.78rem;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.st:not(.hero) .nick{font-weight:700;letter-spacing:.02em}
.st .stk{font-weight:700;font-size:.9rem;white-space:nowrap}
.st .pt{position:absolute;top:-9px;left:-6px;font-size:.66rem;font-weight:700;background:var(--card);color:var(--muted);border-radius:6px;padding:0 5px;border:1px solid var(--line)}
.st.hero .box{border-color:var(--blue)}.st.hero .nick{font-weight:700;color:var(--blue)}
.st.act .box{border-color:#f5b301;box-shadow:0 0 0 3px rgba(245,179,1,.35)}
.st.nxt .box{border-style:dashed;border-color:#f5b301}
.st.fold{opacity:.38}.st.win .box{border-color:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 35%,transparent)}
.badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.badge.ai{background:var(--neg);color:#fff}.badge.eq.chg{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1.45);box-shadow:0 0 0 4px rgba(245,179,1,.45)}100%{transform:none;box-shadow:none}}.badge.eq{background:#f5b301;color:#14161a;right:-8px;left:auto;transform:none;bottom:auto;top:-9px}
.seat0{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,6cqw,44px);height:clamp(18px,3.4cqw,26px);border-radius:8px;border:1.5px dashed var(--line);opacity:.6}
.bet{position:absolute;transform:translate(-50%,-50%);font-size:.78rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);border-radius:10px;padding:1px 7px 1px 4px;white-space:nowrap;transition:opacity .18s;z-index:1}
.bet::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#f5b301;border:2px dashed #fff;margin-right:4px;vertical-align:-1px}
.bet.won{background:color-mix(in srgb,var(--pos) 85%,#000)}.bet.won::before{display:none}.bet.off{opacity:0}
.dealer{position:absolute;transform:translate(-50%,-50%);width:clamp(16px,2.8cqw,22px);height:clamp(16px,2.8cqw,22px);border-radius:50%;background:#fff;color:#14161a;font-size:.62rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}.ctl button{min-width:2.8em}.ctl select{padding:6px}
.log{background:var(--card);border-radius:12px;padding:6px;max-height:min(520px,60vh);overflow:auto;font-size:.86rem}
@media (max-width:760px){.log{max-height:240px}}
.log .sh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.log .li{padding:3px 6px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.log .li:hover{background:var(--bg)}.log .li.cur{background:var(--blue);color:#fff}.log .li.cur .m,.log .li.cur .pos,.log .li.cur .neg{color:#fff}
.log .li b{font-weight:700}.log .li .cs{display:flex;gap:2px}.log .li .card{margin:0;font-size:.8rem;padding:0 3px;min-width:1.7em}
.ctrl{display:flex;gap:6px;justify-content:center;margin:10px 0}.ctrl button{min-width:3em}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:14px 0}
.trio .box h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lscale{display:flex;gap:4px}.lv{flex:1;text-align:center;font-size:.7rem;line-height:1.2;padding:6px 2px;border-radius:8px;
  background:var(--bg);color:var(--muted);border:1px solid var(--line)}.lv b{display:block;font-size:1rem;margin-bottom:2px}
.lv.on{color:#fff;font-weight:700;border-color:transparent}.lv.on.up{background:var(--pos)}.lv.on.mid{background:var(--blue)}
.lv.on.down{background:var(--neg)}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.hcards>div{background:var(--bg);border-radius:10px;
  padding:8px 4px;border:1px solid var(--line)}.hcards .hc{font-size:1.6rem;font-weight:800;letter-spacing:.04em}
.ptable{position:relative;height:150px;margin:4px 6px}.ptable .felt{position:absolute;inset:22px 34px;border-radius:50%;
  border:2px solid var(--line);background:color-mix(in srgb,var(--felt) 22%,transparent)}
.pc2{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:.72rem;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--fg)}
.pc2.few{opacity:.4}.pc2.best{background:var(--pos);border-color:var(--pos);color:#fff}
.pc2.worst{background:var(--neg);border-color:var(--neg);color:#fff}
.finding{border-left:4px solid var(--line);margin:10px 0}.finding.likely{border-left-color:var(--neg)}
.finding.possible{border-left-color:var(--orange)}.finding.good{border-left-color:var(--pos)}
.finding h3{margin:0 0 4px;font-size:1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.conf{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--bg);border:1px solid var(--line)}
.finding .big{font-size:1.05rem;font-weight:700;margin:2px 0}.finding details{margin-top:6px}
.finding summary{cursor:pointer;color:var(--blue);font-size:.88rem}
.sess-sum{margin:8px 0 0;font-size:1rem;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}.seg button{padding:5px 10px;font-size:.88rem}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tchart{position:relative;background:var(--card);border-radius:10px;padding:4px 0;touch-action:pan-y}
.tchart svg{display:block;width:100%}.tchart .tip{position:absolute;pointer-events:none;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 3px 10px rgba(0,0,0,.2);
  white-space:nowrap;display:none;z-index:2}
.legend{font-size:.85rem;color:var(--muted);margin:4px 0 0}.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;
  vertical-align:middle;margin:0 4px 0 10px}
.tag{display:inline-block;font-size:.78rem;background:var(--card);border-radius:6px;padding:1px 6px;margin:1px}
.warn{border-left:4px solid var(--orange);padding:8px 10px;background:var(--card);border-radius:6px}
</style>
</head>
<body>
<header><nav id="nav">
  <a href="#/">Dashboard</a><a href="#/tournaments">Tournaments</a><a href="#/analysis">Analysis</a><a href="#/import">Import</a><a href="#/luck">How luck works</a>
</nav></header>
<main id="app">Loading…</main>
<script>
const TOKEN = "__TOKEN__";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUIT = {c:"♣", d:"♦", h:"♥", s:"♠"};
const num = (x, d=1) => x == null ? "–" : Number(x).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (x, d=1, unit="") => x == null ? "–" :
  `<span class="${Number(x) >= 0 ? "pos" : "neg"}">${Number(x) >= 0 ? "+" : ""}${num(x, d)}${unit}</span>`;
const money = x => x == null ? "–" : "$" + num(x, 2);
function cards(t) {
  const a = Array.isArray(t) ? t : String(t || "").split(" ").filter(Boolean);
  return a.length ? a.map(c => `<span class="card s-${esc(c[1])}">${esc(c[0])}${SUIT[c[1]] || ""}</span>`).join("") : '<span class="m">–</span>';
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function chart(series, colors = ["var(--blue)", "var(--orange)"]) {
  const vals = series.flat();
  if (vals.length < 2) return '<p class="m">Not enough data for a chart yet.</p>';
  const w = 300, h = 110, lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = (hi - lo) || 1;
  const y = v => (h - 8 - (v - lo) / span * (h - 16)).toFixed(1);
  const lines = series.map((s, k) => `<polyline fill="none" stroke="${colors[k]}" stroke-width="2" points="${
    s.map((v, i) => `${(i * w / Math.max(s.length - 1, 1)).toFixed(1)},${y(v)}`).join(" ")}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".25"/>${lines}</svg>`;
}
const table = (head, rows) => `<div class="scroll"><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table></div>`;
const luckLink = '<a href="#/luck">How is luck calculated?</a>';

// ---- Dashboard -------------------------------------------------------------
const PERIODS = [["24h", "24 h"], ["3d", "3 days"], ["1w", "1 week"], ["2w", "2 weeks"], ["4w", "4 weeks"],
                 ["3m", "3 months"], ["6m", "6 months"], ["max", "Max"]];
const pct = x => x == null ? "–" : num(x, 1) + "%";

async function viewDashboard(period) {
  const mine = routeSeq, q = period ? `?period=${encodeURIComponent(period)}` : "";
  const [{dashboard: d, session: s}, st] = await Promise.all([api("/api/dashboard" + q), api("/api/status")]);
  if (mine !== routeSeq) return;                         // the user went elsewhere while this was loading
  const banner = st.running ? `<p class="warn">Importing ${st.done}/${st.total} files… <a href="#/import">details</a>. The numbers below will update when it finishes.</p>` : "";
  if (!d.tournaments && !d.hands && d.period === "max") {
    app.innerHTML = banner + `<h1>Welcome</h1><p>No data yet. Go to <a href="#/import">Import</a> and point the app at the folder where you save PokerCraft exports.</p>`;
    return;
  }
  let h = "<h1>Dashboard</h1>" + banner;
  if (s) {
    const si = s.insights || {}, sn = si.numbers || {};
    h += `<div class="box"><b>Last session</b> <span class="m">${esc(s.from)} – ${esc(s.to)}</span>
      ${si.summary ? `<p class="sess-sum">${esc(si.summary)}</p>` : ""}
      <div class="k" style="margin-top:8px"><div>Tournaments<b>${s.count}</b></div><div>Hands<b>${s.hands}</b></div>
      <div>Profit<b>${s.profit == null ? "–" : sgn(s.profit, 2, " $")}</b></div><div>All-in luck<b>${sgn(s.luck_bb, 1, " BB")}</b></div></div>
      ${si.numbers ? `<p class="m" style="margin:8px 0 0">${[
        sn.minutes != null ? `played ${Math.floor(sn.minutes / 60)} h ${sn.minutes % 60} min` : "",
        `up to ${sn.max_at_once} at once`, `${sn.knockouts} knockouts`,
        sn.reentries ? `${sn.reentries} re-entries (${money(sn.reentry_cost)})` : "no re-entries",
        sn.best ? `best: ${sn.best.place}/${sn.best.players} in ${esc(sn.best.name)}` : ""].filter(Boolean).join(" · ")}</p>` : ""}
      ${si.luck && si.luck.count ? sessionLuck(si.luck) : ""}
      ${si.vs_usual && si.vs_usual.length ? vsUsual(si.vs_usual) : ""}
      ${si.busts ? reviewHands(si) : ""}
      ${table(["Tournament", "Place", "Profit $", "Luck BB"], s.tournaments.map(t => `<tr class="click" onclick="location.hash='#/t/${t.tournament_id}'">
        <td>${esc(t.name)} <span class="m">$${num(t.buyin_total, 2)}</span></td><td>${t.finish_place ?? "–"}/${t.players ?? "–"}</td>
        <td>${t.profit == null ? '<span class="m">no summary</span>' : sgn(t.profit, 2)}</td><td>${sgn(t.luck_bb)}</td></tr>`))}</div>`;
  }
  const label = PERIODS.find(p => p[0] === d.period)[1];
  h += `<h2>${d.period === "max" ? "All tournaments" : "Last " + esc(label)}</h2>
    <div class="seg" id="periods">${PERIODS.map(([k, t]) => `<button data-p="${k}" class="${k === d.period ? "on" : ""}">${t}</button>`).join("")}</div>`;
  if (!d.tournaments && !d.hands) {
    app.innerHTML = h + `<p class="m">Nothing played in the last ${esc(label)}. Pick a longer period.</p>`;
    bindPeriods();
    return;
  }
  const roi = d.roi_pct == null ? "–" : sgn(d.roi_pct, 0, "%");
  h += `<div class="k"><div>Tournaments<b>${d.tournaments}</b></div><div>Profit (cash)<b>${sgn(d.profit, 0, " $")}</b></div>
    <div>ROI<b>${roi}</b></div><div>In the money<b>${pct(d.itm_pct)}</b><span class="m">${d.itm} of ${d.tournaments}</span></div>
    <div>Knockouts<b>${d.knockouts.sole}</b><span class="m">${d.knockouts.per_tournament == null ? "" : num(d.knockouts.per_tournament, 2) + " per tournament"}</span></div></div>
    <p class="m">cost ${money(d.cost)} · cash ${money(d.cash)}${d.tickets ? ` · tickets ${money(d.tickets)} (not in ROI)` : ""} · ${d.hands} hands</p>`;
  if (d.tournaments < 30) h += `<p class="warn">Small sample (${d.tournaments} tournaments). Tournament results this small are mostly variance.</p>`;
  h += `<div class="trio">${luckBox(d.luck_badge)}${handsBox(d.starting_hands)}${positionBox(d.positions, d.position_rank)}</div>`;
  h += `<h2>Cash profit, cumulative</h2><div class="tchart" id="c-profit"></div>`;
  h += `<h2>Luck</h2><div class="tchart" id="c-luck"></div>
    <p class="legend"><i style="background:var(--blue);margin-left:0"></i>actual result in BB<i style="background:var(--orange)"></i>luck-adjusted (all-in luck removed) · ${luckLink}</p>`;
  if (d.allins.count) h += `<p>${d.allins.count} all-ins: actual ${sgn(d.allins.net_bb)} BB, expected ${sgn(d.allins.ev_bb)} BB, luck ${sgn(d.allins.luck_bb)} BB.</p>`;
  const tagRows = pre => d.tags.filter(t => t.tag.startsWith(pre)).map(t =>
    `<tr><td>${esc(t.tag.split(":")[1])}</td><td>${t.n}</td><td>${t.itm}</td><td>${pct(t.itm_pct)}</td><td>${sgn(t.roi_pct, 0, "%")}</td></tr>`);
  const entry = tagRows("entry:");
  if (entry.length) h += `<h2>Late registration vs start</h2>${table(["Entered", "n", "ITM", "ITM %", "ROI"], entry)}` +
    (d.entry_incomplete ? `<p class="m">${d.entry_incomplete} tournament${d.entry_incomplete === 1 ? "" : "s"} with an incomplete entry history left out.</p>` : "");
  if (d.by_buyin.length) h += `<h2>By buy-in</h2>${table(["Buy-in", "n", "ITM", "ITM %", "Profit $", "ROI"], d.by_buyin.map(b =>
    `<tr><td>${money(b.buyin)}</td><td>${b.n}</td><td>${b.itm}</td><td>${pct(b.itm_pct)}</td><td>${sgn(b.profit, 2)}</td><td>${sgn(b.roi_pct, 0, "%")}</td></tr>`))}`;

      total: actual ${sgn(p.actual)} BB, adjusted ${sgn(p.adjusted)} BB`);
}

const LEVELS = [["Very lucky", "▲▲", "up"], ["Lucky", "▲", "up"], ["Average", "●", "mid"], ["Bad run", "▼", "down"],
                ["Worst run", "▼▼", "down"]];
function luckBox(b) {
  const scale = `<div class="lscale">${LEVELS.map(([name, sym, cls]) =>
    `<div class="lv ${cls} ${b.level === name ? "on" : ""}"><b>${sym}</b>${name}</div>`).join("")}</div>`;
  const note = b.count ? `${b.count} all-ins · luck ${sgn(b.luck_bb, 1, " BB")} · ${b.z >= 0 ? "+" : ""}${num(b.z, 2)} typical swings`
    + (b.small_sample ? ` · <b>small sample</b>` : "") : "No all-ins with known cards in this period.";
  const rare = b.count && b.one_in ? `<p style="margin:8px 0 0;font-size:.9rem">A run this ${b.direction === "worse" ? "bad or worse" : "good or better"}
      happens to about <b>1 in ${b.one_in}</b> players with average luck.</p>` : "";
  return `<div class="box"><h3>Luck</h3>${scale}${rare}<p class="m" style="margin:6px 0 0">${note} · ${luckLink}</p></div>`;
}
function handsBox(sh) {
  const kind = h => h.length === 2 ? "pair" : h.endsWith("s") ? "suited" : "offsuit";
  const card = (title, g) => g ? `<div><span class="m">${title}</span><div class="hc">${esc(g.hand.slice(0, 2))}</div>
      <span class="m">${kind(g.hand)}</span><br>${sgn(g.net_bb, 1, " BB")}<br><span class="m">${g.hands} hands</span></div>`
    : `<div><span class="m">${title}</span><div class="hc">–</div></div>`;
  const body = sh.ranked ? `<div class="hcards">${card("Best hand", sh.best)}${card("Worst hand", sh.worst)}</div>`
    : `<p class="m">No starting hand has ${sh.min_hands} hands in this period yet, so there is no ranking.</p>`;
  return `<div class="box"><h3>Best &amp; worst starting hand</h3>${body}
    ${sh.ranked ? `<p class="m" style="margin:8px 0 0">Ranked by result among ${sh.ranked} hand types with ${sh.min_hands}+ hands.
      With this many hands, a result depends mostly on a few big pots.</p>` : ""}</div>`;
}
const SEATS = ["BB", "UTG", "UTG+1", "MP", "LJ", "HJ", "CO", "BTN", "SB"];   // clockwise from the bottom, like the table
const blinds = by => ["SB", "BB"].some(p => by[p]) ? `<p class="m" style="margin:4px 0 0">${["SB", "BB"].filter(p => by[p]).map(p =>
    `${p === "SB" ? "Small blind" : "Big blind"} ${sgn(by[p].bb_per_100, 0)} bb/100 (${by[p].hands} hands)`).join(" · ")}.
    Not ranked: the blinds lose money for almost every player.</p>` : "";
function positionBox(list, rank) {
  const by = Object.fromEntries(list.map(p => [p.position, p]));
  const ring = SEATS.filter(p => by[p]);
  const spot = (pos, k, n) => {
    const t = Math.PI / 2 + (k + .5) * 2 * Math.PI / n, p = by[pos];
    const cls = rank.best && rank.best.position === pos ? "best" : rank.worst && rank.worst.position === pos ? "worst"
      : p.hands < rank.min_hands ? "few" : "";
    return `<div class="pc2 ${cls}" style="left:${50 + 42 * Math.cos(t)}%;top:${50 + 38 * Math.sin(t)}%"
      title="${esc(pos)}: ${sgn(p.bb_per_100, 0).replace(/<[^>]+>/g, "")} bb/100 in ${p.hands} hands">${esc(pos)}</div>`;
  };
  const line = (title, p) => p ? `${title} <b>${esc(p.position)}</b> ${sgn(p.bb_per_100, 0)} bb/100 <span class="m">(${p.hands} hands)</span>` : "";
  const body = rank.ranked ? `<div class="ptable"><div class="felt"></div>${ring.map((p, k) => spot(p, k, ring.length)).join("")}</div>
      <p style="margin:6px 0 0;font-size:.88rem">${line("Strongest", rank.best)}${rank.worst ? "<br>" + line("Weakest", rank.worst) : ""}</p>
      ${blinds(by)}
      ${by["BTN/SB"] ? `<p class="m" style="margin:4px 0 0">Heads-up (BTN/SB): ${sgn(by["BTN/SB"].bb_per_100, 0)} bb/100, ${by["BTN/SB"].hands} hands.</p>` : ""}`
    : `<p class="m">No position has ${rank.min_hands} hands in this period yet, so there is no ranking.</p>`;
  return `<div class="box"><h3>Strongest &amp; weakest position</h3>${body}</div>`;
}

// ---- Last session: luck, the session against your usual play, hands to review --------------------------------
function sessionLuck(b) {
  const cls = LEVELS.find(l => l[0] === b.level)?.[2] || "mid", sym = LEVELS.find(l => l[0] === b.level)?.[1] || "";
  return `<p style="margin:8px 0 0"><span class="lv on ${cls}" style="display:inline-block;padding:2px 8px">${sym} ${esc(b.level)}</span>
    <span class="m">${b.count} all-ins · luck ${sgn(b.luck_bb, 1, " BB")}${b.one_in && b.level !== "Average" ? ` · a run like this happens to about 1 in ${b.one_in} players` : ""}${b.small_sample ? " · small sample" : ""}</span></p>`;
}
function vsUsual(rows) {

    const diff = r.confidence ? ` <b style="color:var(--orange)">${r.session > r.usual ? "higher" : "lower"}${r.confidence === "possible" ? " (could be chance)" : ""}</b>` : "";

  }).join(" · ")}</p>`;
}
function reviewHands(si) {
  const story = x => `${x.hero_cards ? cards(x.hero_cards) : "–"} vs ${x.rival ? esc(x.rival) + " " : ""}${x.rival_cards ? cards(x.rival_cards) : '<span class="m">cards not shown</span>'}${

// ---- Time charts: a date axis, a labelled value axis and a tooltip; drawn at the real width so text stays readable
let charts = [];
function addChart(id, pts, series, fmtY, tip, opts = {}) {
  const box = document.getElementById(id);
  const draw = () => drawTimeChart(box, pts, series, fmtY, tip, opts);
  charts.push({box, draw});
  draw();
}
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => charts.forEach(c => document.body.contains(c.box) && c.draw()), 120);
});
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function drawTimeChart(box, pts, series, fmtY, tip, opts = {}) {
  if (pts.length < 2) { box.innerHTML = '<p class="m" style="padding:8px 12px">Not enough data for a chart in this period yet.</p>'; return; }
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.max(170, Math.min(260, W * .38)));
  const L = 58, R = 14, B = 26, iw = W - L - R;
  const ts = pts.map(p => Date.parse(p.at.replace(" ", "T")));
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 === t0) t1 = t0 + 3600e3;
  const vals = series.flatMap(s => pts.map(p => p[s.key]));
  const step = niceStep((Math.max(0, ...vals) - Math.min(0, ...vals)) / 4 || 1);
  const lo = Math.floor(Math.min(0, ...vals) / step) * step, hi = Math.ceil(Math.max(0, ...vals) / step) * step || step;
  const x = t => L + (t - t0) / (t1 - t0) * iw;
  // annotation labels go in rows above the plot so that labels close in time do not overlap
  const rowEnds = [], placed = (opts.markers || []).filter(m => !m.dot).map(m => {
    const mx = x(ts[m.i]), w = m.label.length * 6.3, end = mx > W - w - 10;
    const a = end ? mx - w - 4 : mx + 4, b = a + w;
    let row = rowEnds.findIndex(e => a > e + 8);
    if (row < 0) row = rowEnds.length < 3 ? rowEnds.length : rowEnds.indexOf(Math.min(...rowEnds));
    rowEnds[row] = b;
    return {...m, mx, row, end};
  });
  const T = 12 + rowEnds.length * 15, ih = H - T - B, y = v => T + (hi - v) / (hi - lo) * ih;
  let g = "";
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:${Math.abs(v) < step / 2 ? 1.6 : 1}"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${fmtY(Math.round(v * 100) / 100)}</text>`;
  }
  const spanH = (t1 - t0) / 3600e3, nx = Math.max(2, Math.min(6, Math.floor(iw / 110)));
  let prevLab = "";
  for (let k = 0; k <= nx; k++) {
    const t = t0 + (t1 - t0) * k / nx, d = new Date(t);
    const lab = spanH <= 36 ? d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"})
      : d.toLocaleDateString("en-US", {month: "short", day: "numeric"});
    if (lab === prevLab) continue;                       // a few days on a wide axis: one label per day
    prevLab = lab;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${k === 0 ? "start" : k === nx ? "end" : "middle"}" style="fill:var(--muted);font-size:11px">${lab}</text>`;
  }
  // annotations: a dashed line and a label at the point they belong to; "dot" ones mark a single point (e.g. a bust)
  const marks = (opts.markers || []).filter(m => m.dot).map(m => `<text x="${x(ts[m.i])}" y="${y(pts[m.i][series[0].key]) + 4}"
      text-anchor="middle" style="fill:var(--neg);font-size:14px;font-weight:700">✕</text>`).join("") + placed.map(m => {
    const ly = 12 + m.row * 15;
    return `<line x1="${m.mx}" x2="${m.mx}" y1="${ly - 4}" y2="${T + ih}" style="stroke:var(--orange);stroke-dasharray:4 3"/>
      <text x="${m.mx + (m.end ? -4 : 4)}" y="${ly + 4}" text-anchor="${m.end ? "end" : "start"}"
        style="fill:var(--orange);font-size:11px;font-weight:700">${m.title ? `<title>${esc(m.title)}</title>` : ""}${esc(m.label)}</text>`;
  }).join("");
  const lines = series.map(s => `<polyline fill="none" style="stroke:${s.color};stroke-width:2;stroke-linejoin:round"
    points="${pts.map((p, i) => `${x(ts[i]).toFixed(1)},${y(p[s.key]).toFixed(1)}`).join(" ")}"/>`).join("");
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"${opts.onPick ? ' style="cursor:pointer"' : ""}>${g}${marks}${lines}
    <g id="hover" style="display:none"><line y1="${T}" y2="${T + ih}" style="stroke:var(--muted);stroke-dasharray:3 3"/>
      ${series.map(s => `<circle r="4" style="fill:${s.color};stroke:var(--bg);stroke-width:2"/>`).join("")}</g>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = box.querySelector("svg"), hov = svg.querySelector("#hover"), tipEl = box.querySelector(".tip");
  const show = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let i = 0;
    ts.forEach((t, k) => { if (Math.abs(x(t) - mx) < Math.abs(x(ts[i]) - mx)) i = k; });
    const px = x(ts[i]);
    hov.style.display = "";
    hov.querySelector("line").setAttribute("x1", px); hov.querySelector("line").setAttribute("x2", px);
    hov.querySelectorAll("circle").forEach((c, k) => { c.setAttribute("cx", px); c.setAttribute("cy", y(pts[i][series[k].key])); });
    const when = new Date(ts[i]).toLocaleString("en-GB", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
    tipEl.innerHTML = `<span class="m">${when}</span><br>${tip(pts[i])}`;
    tipEl.style.display = "block";
    const left = px * r.width / W, w = tipEl.offsetWidth;
    tipEl.style.left = Math.max(4, Math.min(r.width - w - 4, left + (left > r.width / 2 ? -w - 12 : 12))) + "px";
    tipEl.style.top = "8px";
  };
  const nearest = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    return ts.reduce((best, t, k) => Math.abs(x(t) - mx) < Math.abs(x(ts[best]) - mx) ? k : best, 0);
  };
  if (opts.onPick) svg.addEventListener("click", e => opts.onPick(pts[nearest(e)]));
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => { hov.style.display = "none"; tipEl.style.display = "none"; });
}

  h += `<h2>Stack in BB</h2><div class="tchart" id="c-stack"></div><p class="m">${num(s.start_bb, 0)} → ${num(s.end_bb, 0)} BB, peak ${num(s.peak_bb, 0)} BB after ${s.peak_after_hands} hands · click the chart to replay a hand</p>`;
  h += `<h2>Positions</h2>${table(["Position", "Hands", "BB", "bb/100"], d.positions.map(p => `<tr><td>${esc(p.position)}</td><td>${p.hands}</td><td>${sgn(p.net_bb)}</td><td>${sgn(p.bb_per_100, 0)}</td></tr>`))}`;
  if (!d.best_position) h += `<p class="m">Fewer than 8 hands per position, too small to rank.</p>`;
  else h += `<p class="m">Best: ${esc(d.best_position.position)}${d.worst_position ? ` · worst: ${esc(d.worst_position.position)}` : ""} (positions with 8+ hands)</p>`;
  const moments = (title, list) => list.length ? `<h2>${title}</h2>` + table(["Cards", "Pos", "Board", "BB", ""], list.map(m =>
    `<tr class="click" onclick="location.hash='#/hand/${m.hand_id}'"><td>${cards(m.hole_cards)}</td><td>${esc(m.position)}</td><td>${cards(m.board)}</td><td>${sgn(m.net_bb)}</td><td>▶</td></tr>`)) : "";
  h += moments("Biggest wins", d.biggest_wins) + moments("Biggest losses", d.biggest_losses);
  if (d.strongest_showdown) h += `<h2>Strongest showdown hand</h2><p><a href="#/hand/${d.strongest_showdown.hand_id}">${esc(d.strongest_showdown.hand)}</a>: ${cards(d.strongest_showdown.hole_cards)} on ${cards(d.strongest_showdown.board)}</p>`;
  if (a.count) h += `<h2>All-ins</h2><p>${a.count} all-ins: actual ${sgn(a.net_bb)} BB, expected ${sgn(a.ev_bb)} BB, luck ${sgn(a.luck_bb)} BB. Won ${a.won} (expected ${num(a.expected_won)}). ${luckLink}</p>` +
    a.notable.map(n => `<p><a href="#/hand/${n.hand_id}">${esc(n.kind)}</a>: ${cards(n.hole_cards)} on ${cards(n.board)} (${esc(n.street)}), equity ${num(100 * n.equity, 1)}%, luck ${sgn(n.luck_bb)} BB</p>`).join("");
  h += `<h2>All hands (${d.hand_list.length})</h2>` + table(["Time", "Lvl", "Pos", "Cards", "Board", "BB"], d.hand_list.map(x =>
    `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'"><td>${esc(String(x.played_at).slice(11, 16))}</td><td>${x.level}</td><td>${esc(x.position)}</td>
     <td>${cards(x.hole_cards)}</td><td>${cards(x.board)}</td><td>${sgn(x.net_bb)}</td></tr>`));
  app.innerHTML = h;
  stackChart(d);
}

// ---- Replayer -----------------------------------------------------------------
// The server sends full snapshots (pot, stacks, bets, board); this code only draws them.
let replay = null, step = 0, playTimer = null;
const SPEEDS = {slow: 1500, normal: 900, fast: 450};
const VERBS = {folds: "folds", checks: "checks", calls: "calls", bets: "bets", raises: "raises to"};
const bbs = (x, bb) => num(x / bb, Math.abs(x / bb) >= 100 ? 0 : 1);
const pcard = (c, cls = "") => `<span class="pc s-${esc(c[1])} ${cls}">${esc(c[0])}<i>${SUIT[c[1]] || ""}</i></span>`;

function seatPoint(r, seat, f = 1) {
  // Seats are numbered clockwise; slot 0 (Hero) is bottom centre, angles grow clockwise on screen.
  const n = r.max_seats || Math.max(...r.steps[0].players.map(p => p.seat)), hero = r.steps[0].players.find(p => p.hero);
  const k = ((seat - (hero ? hero.seat : 1)) % n + n) % n, t = Math.PI / 2 + k * 2 * Math.PI / n;
  const narrow = matchMedia("(max-width:560px)").matches, rx = narrow ? 40 : 43, ry = narrow ? 41 : 39;
  return [50 + rx * f * Math.cos(t), 50 + ry * f * Math.sin(t)];
}
const at = ([x, y]) => `left:${x.toFixed(2)}%;top:${y.toFixed(2)}%`;

function logLine(s, r) {
  const bb = r.big_blind;
  if (s.kind === "start") return `Blinds ${num(r.small_blind, 0)}/${num(r.big_blind, 0)}${r.ante ? `, ante ${num(r.ante, 0)}` : ""}`;
  if (s.kind === "deal") return `<span class="cs">${cards(s.board)}</span>`;
  if (s.kind === "return") return `<span>Returned to ${s.action.nick === "Hero" ? "<b>Hero</b>" : esc(s.action.nick)}</span><span>${bbs(s.action.amount, bb)} BB</span>`;
  if (s.kind === "result") {
    const w = s.players.filter(p => p.net > 0);
    return w.length ? w.map(p => `<span>${p.hero ? "<b>Hero</b>" : esc(p.nick)} wins</span><span>${sgn(p.net / bb, 1)} BB</span>`).join("") : esc(s.label);
  }
  if (s.kind === "action") {
    const a = s.action, who = a.nick === "Hero" ? "<b>Hero</b>" : esc(a.nick);
    const amt = a.amount && a.type !== "folds" ? ` <span>${bbs(a.amount, bb)} BB</span>` : "";
    return `<span>${who} ${VERBS[a.type] || esc(a.type)}${a.all_in ? " <b>all-in</b>" : ""}</span>${amt}`;
  }
  return esc(s.label);
}

async function viewHand(id) {
  stopPlay();
  const mine = routeSeq, r = await api(`/api/hand/${id}`);
  if (mine !== routeSeq) return;
  replay = r; step = 0;
  renderHand();
}
function renderHand() {
  const r = replay, [i, n] = r.position_in_tournament;
  let log = "", street = null;
  r.steps.forEach((s, k) => {
    if (s.kind !== "result" && s.street !== street) { street = s.street; log += `<div class="sh">${esc(street)}</div>`; }
    if (s.kind === "result") log += `<div class="sh">result</div>`;
    log += `<div class="li" data-k="${k}">${s.kind === "deal" ? "<span class=m>Board</span>" : ""}${logLine(s, r)}</div>`;
  });
  const n0 = r.max_seats || 9, taken = new Set(r.steps[0].players.map(p => p.seat));
  const empty = Array.from({length: n0}, (_, k) => k + 1).filter(k => !taken.has(k))
    .map(k => `<div class="seat0" style="${at(seatPoint(r, k))}"></div>`).join("");
  const btn = r.steps[0].players.find(p => (p.position || "").startsWith("BTN"));
  app.innerHTML = `<p><a href="#/t/${r.tournament_id}">← Tournament</a></p>
    <h1>Hand ${i} of ${n}</h1><p class="m">Level ${r.level} · blinds ${num(r.small_blind, 0)}/${num(r.big_blind, 0)} ante ${num(r.ante, 0)} · table ${esc(r.table)} · ${esc(r.played_at)}</p>
    <div class="rt"><div>
      <div class="stage" id="stage"><div class="oval"></div>${empty}
        ${btn ? `<div class="dealer" style="${at(seatPoint(r, btn.seat + .32, .74))}">D</div>` : ""}
        <div class="center"><div class="street" id="street"></div><div class="board" id="board"></div><div class="pot" id="pot"></div><div class="eqline" id="eq"></div></div>
        <div id="seats"></div></div>
      <div class="ctl">
        <button id="b0" title="Start (Home)">⏮</button><button id="b1" title="Back (←)">◀</button>
        <button id="bp" class="primary" title="Play / pause (space)">▶ Play</button>
        <button id="b2" title="Next (→)">▶</button><button id="b3" title="End (End)">⏭</button>
        <select id="spd" title="Autoplay speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select>
        <span class="m" id="cnt"></span>
        <label class="m" title="Diamonds blue and clubs green, as on GGPoker"><input type="checkbox" id="deck4" ${document.body.classList.contains("two-color") ? "" : "checked"}> 4-colour deck</label>
      </div>
      <p class="ctl">${r.prev_id ? `<a href="#/hand/${r.prev_id}">← previous hand</a>` : ""} &nbsp; ${r.next_id ? `<a href="#/hand/${r.next_id}">next hand →</a>` : ""}</p>
    </div><div class="log" id="log">${log}</div></div>`;
  const go = k => { step = Math.max(0, Math.min(r.steps.length - 1, k)); drawStep(); };
  replay.go = go;
  document.getElementById("b0").onclick = () => { stopPlay(); go(0); };
  document.getElementById("b1").onclick = () => { stopPlay(); go(step - 1); };
  document.getElementById("b2").onclick = () => { stopPlay(); go(step + 1); };
  document.getElementById("b3").onclick = () => { stopPlay(); go(r.steps.length - 1); };
  document.getElementById("bp").onclick = togglePlay;
  document.getElementById("spd").onchange = () => { if (playTimer) { stopPlay(); togglePlay(); } };
  document.getElementById("deck4").onchange = e => setDeck(e.target.checked);
  document.getElementById("log").onclick = e => { const li = e.target.closest(".li"); if (li) { stopPlay(); go(+li.dataset.k); } };
  drawStep();
}

async function setDeck(fourColor) {
  document.body.classList.toggle("two-color", !fourColor);
  try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                   body: JSON.stringify({four_color: fourColor})}); } catch (e) { /* still applied for this session */ }
}

function togglePlay() {
  if (playTimer) return stopPlay();
  if (step >= replay.steps.length - 1) replay.go(0);
  playTimer = setInterval(() => {
    if (!replay || !document.getElementById("stage")) return stopPlay();
    replay.go(step + 1);
    if (step >= replay.steps.length - 1) stopPlay();
  }, SPEEDS[document.getElementById("spd").value]);
  document.getElementById("bp").textContent = "⏸ Pause";
}
function stopPlay() {
  clearInterval(playTimer); playTimer = null;
  const b = document.getElementById("bp"); if (b) b.textContent = "▶ Play";
}

function drawStep() {
  const r = replay, s = r.steps[step], bb = r.big_blind, prev = r.steps[step - 1];
  document.getElementById("street").textContent = s.result ? "result" : s.street;
  const fresh = step === 0 || !prev ? 0 : prev.board.length;
  document.getElementById("board").innerHTML = [0, 1, 2, 3, 4].map(k => s.board[k]
    ? pcard(s.board[k], k >= fresh && s.board.length > fresh && step ? "new" : "") : `<span class="pc slot"></span>`).join("");
  document.getElementById("pot").innerHTML = s.result
    ? `Pot ${bbs(r.total_pot, bb)} BB <small>(${num(r.total_pot, 0)}) paid out</small>`
    : `Pot ${bbs(s.pot, bb)} BB <small>(${num(s.pot, 0)})</small>`;
  const hero = s.players.find(p => p.hero);
  document.getElementById("eq").innerHTML = !(hero && hero.equity != null && r.hero_allin) ? ""
    : s.result ? `Hero all-in equity <b>${num(100 * r.hero_allin.equity, 1)}%</b> · luck ${sgn(r.hero_allin.luck / bb, 1, " BB")}
        <a href="#/luck" style="color:#fff">how?</a>`
    : `Hero equity <b>${num(100 * hero.equity, 1)}%</b>${prev && prev.players.find(p => p.hero).equity == null ? " at the all-in" : ""}`;
  const eqChanged = p => { const q = prev && prev.players.find(x => x.nick === p.nick); return q && q.equity != null && q.equity !== p.equity; };
  document.getElementById("seats").innerHTML = s.players.map(p => {
    const won = s.result && (r.collected[p.nick] || 0) > 0;
    const cls = ["st", p.hero && "hero", p.folded && "fold", p.acting && "act", !p.acting && s.next === p.nick && "nxt", won && "win"].filter(Boolean).join(" ");
    const hole = p.folded && !p.hero ? "" : p.cards.length ? p.cards.map(c => pcard(c)).join("") : `<span class="pc back"></span><span class="pc back"></span>`;
    const bet = won ? `<div class="bet won" style="${at(seatPoint(r, p.seat, .6))}">+${bbs(r.collected[p.nick], bb)} BB</div>`
      : `<div class="bet ${p.commit ? "" : "off"}" style="${at(seatPoint(r, p.seat, .6))}">${p.commit ? bbs(p.commit, bb) : 0} BB</div>`;
    const res = p.net != null ? ` <span style="font-size:.78rem">${sgn(p.net / bb, 1)}</span>` : "";
    return `<div class="${cls}" style="${at(seatPoint(r, p.seat))}" title="${esc(p.nick)}: ${num(p.stack, 0)} chips">
        <div class="hc">${hole}</div>
        <div class="box">${p.hero ? `<span class="pt">${esc(p.position || "")}</span>` : ""}
          ${p.equity != null && !s.result ? `<span class="badge eq ${eqChanged(p) ? "chg" : ""}">${num(100 * p.equity, 0)}%</span>` : ""}
          <div class="nick">${esc(p.nick)}</div><div class="stk">${bbs(p.stack, bb)} BB${res}</div>
          ${p.all_in && !s.result ? `<span class="badge ai">ALL-IN</span>` : ""}</div></div>${bet}`;
  }).join("");
  document.getElementById("cnt").textContent = `${step + 1} / ${r.steps.length}`;
  const log = document.getElementById("log");
  log.querySelectorAll(".li").forEach(li => li.classList.toggle("cur", +li.dataset.k === step));
  const cur = log.querySelector(".li.cur");
  if (cur && log.scrollHeight > log.clientHeight)
    log.scrollTop = Math.max(0, cur.offsetTop - log.offsetTop - log.clientHeight / 2 + cur.offsetHeight / 2);
}
document.addEventListener("keydown", e => {
  if (!replay || !location.hash.startsWith("#/hand/") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = {ArrowRight: "b2", ArrowLeft: "b1", Home: "b0", End: "b3", " ": "bp"}[e.key];
  if (k) { e.preventDefault(); document.getElementById(k).click(); }
});
// Seat positions depend on the table shape, which changes at the narrow breakpoint
matchMedia("(max-width:560px)").addEventListener("change", () => {
  if (replay && document.getElementById("stage")) { const k = step; stopPlay(); renderHand(); replay.go(k); }
});

// ---- Analysis ---------------------------------------------------------------
// Always the whole history. Built-in tips from clear rules; a finding shows only when it stands out from chance.
const CONF = {likely: "likely", possible: "possible – could still be chance"};
function findingNumber(l) {
  if (l.kind === "vs_fold") return `${sgn(l.value, 2, " BB")} per hand compared with folding
    <div class="m" style="font-weight:400">playing ${sgn(l.played, 2)} BB per hand · folding would have lost exactly
    your blind and ante, ${sgn(l.folded, 2)} BB per hand · ${l.hands} hands</div>`;
  if (l.kind === "vs_fold_total") return `${sgn(l.value, 0, " BB")} compared with folding it every time, in ${l.hands} hands`;
  if (l.kind === "frequency") return `${num(l.value, 0)}% of ${l.hands} times <div class="m" style="font-weight:400">${esc(l.guide)}</div>`;
  if (l.kind === "bb_per_100") return `${sgn(l.value, 1)} bb/100 in ${l.hands} hands`;
  return `${sgn(l.value, 0, " BB")} in ${l.hands} hands`;
}
const worstList = hands => `<details><summary>Show the ${hands.length} worst hands</summary>${table(["When", "Pos", "Cards", "Stack", "BB (EV-adj.)", "BB"],
  hands.map(x => `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'"><td>${esc(x.at)}</td><td>${esc(x.position || "")}</td>
    <td>${x.cards ? cards(x.cards) : "–"}</td><td>${num(x.stack_bb, 0)} BB</td><td>${sgn(x.adj_bb)}</td><td>${sgn(x.net_bb)}</td></tr>`))}</details>`;

async function viewAnalysis() {
  const mine = routeSeq, a = await api("/api/analysis");
  if (mine !== routeSeq) return;
  const o = a.overview, m = a.money;
  const ri = m.roi_interval;
  let h = `<h1>Analysis</h1><p class="m">Your whole history (${o.tournaments} tournaments with a summary, ${o.hands} hands).
    Results are EV-adjusted: in all-in hands the all-in EV replaces the actual result, so single coinflips do not
    create findings. <b>${a.tested} spots checked</b>; the chance of false alarms is corrected for all of them together
    (Benjamini–Hochberg): <b>likely</b> means a false-discovery rate under 5 %, <b>possible</b> under 20 %.</p>`;
  h += `<div class="k"><div>Hands<b>${o.hands}</b></div><div>VPIP / PFR<b>${num(o.vpip_pct, 0)} / ${num(o.pfr_pct, 0)}</b></div>
    <div>bb/100<b>${sgn(o.bb_per_100, 1)}</b><span class="m">EV-adjusted ${sgn(o.bb_per_100_ev, 1)}</span></div>
    <div>ROI<b>${sgn(m.roi_pct, 0, "%")}</b><span class="m">${ri ? `95%: ${num(ri.low, 0)}% to ${num(ri.high, 0)}%` : ""}</span></div>
    <div>ITM<b>${num(o.itm_pct, 1)}%</b></div><div>All-in EV<b>${sgn(o.allins.ev_bb, 0, " BB")}</b>
    <span class="m">actual ${sgn(o.allins.actual_bb, 0)} · luck ${sgn(o.allins.luck_bb, 0)}</span></div></div>`;

  h += `<h2>Leaks</h2>`;
  h += a.leaks.length ? a.leaks.map(l => `<div class="box finding ${l.confidence}">
      <h3>${esc(l.title)} <span class="conf">${CONF[l.confidence]}</span></h3>
      <div class="big">${findingNumber(l)}</div><p style="margin:6px 0 0">${esc(l.tip)}</p>
      <p class="m" style="margin:4px 0 0">${l.sample === "small" ? "Small sample. " : ""}About ${num(l.cost_bb, 0)} BB over this history.</p>
      ${l.worst && l.worst.length ? worstList(l.worst) : ""}</div>`).join("")
    : `<p class="m">Nothing stands out from chance among the ${a.tested} spots checked. No spot is clearly costing you
        money beyond what luck can explain; with more hands smaller leaks can show up here.</p>`;

  h += `<h2>Strengths</h2>`;
  h += a.strengths.length ? a.strengths.map(x => `<div class="box finding good"><h3>${esc(x.title)}
      ${x.confidence ? `<span class="conf">${CONF[x.confidence]}</span>` : ""}</h3><p style="margin:0">${esc(x.text)}</p></div>`).join("")
    : `<p class="m">Nothing stands out from chance yet.</p>`;

  h += `<h2>Money and variance</h2>
    <p>ROI ${sgn(m.roi_pct, 0, "%")} over ${m.tournaments} tournaments.${ri ? ` With 95% confidence it lies between
      <b>${num(ri.low, 0)}%</b> and <b>${num(ri.high, 0)}%</b> (bootstrap over your tournaments, re-entries included).
      ${ri.high < 0 ? "The whole interval is below zero: despite the swings, these tournaments have cost you money so far; only how much is uncertain."
        : ri.low > 0 ? "The whole interval is above zero: you have been winning, beyond what the swings explain."
        : "The interval includes zero: at this sample the ROI cannot tell a winning player from a losing one."}` : ""}</p>
    ${table(["Buy-in", "Tournaments", "Spend", "Share of spend", "Profit $", "ROI"], m.tiers.map(t => `<tr><td>${esc(t.tier)}</td>
      <td>${t.tournaments}</td><td>${money(t.cost)}</td><td>${num(t.share_of_spend_pct, 0)}%</td><td>${sgn(t.profit, 2)}</td><td>${sgn(t.roi_pct, 0, "%")}</td></tr>`))}
    <p class="m">Re-entries: ${m.reentries.tournaments} tournaments with a re-entry cost ${money(m.reentries.extra_cost)} extra;
      those tournaments ended ${sgn(m.reentries.profit, 2, " $")}.</p>`;
  app.innerHTML = h;
}

// ---- How luck works ------------------------------------------------------------
function viewLuck() {
  app.innerHTML = `<h1>How luck is calculated</h1>
  <p>An <b>all-in</b> here means: all the chips are in the middle, cards are still to come, and nobody can act any more.
     From that moment the result depends only on the cards that are dealt, so it is a clean measure of luck.</p>
  <div class="box"><p><b>Equity</b>: your share of the pot if this exact situation were played out over and over. It is not estimated:
     the app goes through <i>every</i> possible remaining board (up to 1,712,304 of them preflop) with the real cards of everyone involved.
     Ties split the pot, and side pots are handled.</p>
  <p><b>Expected (EV)</b>: equity × pot, minus what you put in. What you win <i>on average</i> in this spot.</p>
  <p><b>Actual</b>: what really happened.</p>
  <p><b>Luck = actual − expected.</b> Positive: you won more than the cards deserved. Negative: less.</p>
  <h2>The luck badge</h2>
  <p>The dashboard sums the luck of every all-in in the period and compares it with how much that luck could swing by
     chance: an all-in with 50% equity for a big pot swings a lot, one with 95% equity hardly at all. The result is the
     number of "typical swings" your luck is away from zero.</p>
  <p>Very lucky: +1.5 or more · Lucky: +0.5 to +1.5 · Average: between −0.5 and +0.5 · Bad run: −0.5 to −1.5 ·
     Worst run: −1.5 or less. Two lost coinflips are "Average"; losing a series of 80% all-ins is a bad run. With fewer
     than 20 all-ins the badge says the sample is small.</p>
  <p>Everything is counted in big blinds, so an all-in at 25/50 weighs the same as the same all-in at 500/1,000. Under the
     badge the app says how rare your result is for a player with average luck, e.g. "a run this bad or worse happens to
     about 1 in 6 players" (from the normal distribution: −1 typical swing or worse is about 16%).</p>
  <p>Luck always uses the equity <b>at the moment of the all-in</b>. The replayer also shows how the equity changes as the
     flop, turn and river come, but those numbers are only for watching; they do not change your luck.</p></div>
  <h2>Example</h2>
  <p>You have ${cards("As Ah")} against ${cards("Kd Kc")}, 100 BB each, all-in before the flop. Your equity is about 81%.</p>
  <p>Expected = 0.81 × 200 − 100 = <b>+62 BB</b>. If you win: actual +100 BB, luck <span class="pos">+38 BB</span>.
     If you lose: actual −100 BB, luck <span class="neg">−162 BB</span>.</p>
  <h2>Reading it</h2>
  <p>Good decisions show up as a positive <b>expected</b> number: you get your chips in as the favourite.
     <b>Luck</b> swings up and down and tends towards zero over many tournaments. The orange line on the dashboard is your result with
     that luck removed.</p>
  <p class="m">Limits: measured in chips and big blinds, not dollars (no payout structures needed). Only all-ins where every player's
     cards are known count, as in PokerTracker. A "bad beat" is losing with 80%+ equity, a "suckout" winning with 20% or less.</p>`;
}

// ---- Router -----------------------------------------------------------------
let routeSeq = 0;                                       // views drawn after a newer route started are dropped
async function route() {
  routeSeq++;
  const h = location.hash || "#/";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on",
    a.getAttribute("href") === h || (a.getAttribute("href") === "#/tournaments" && /^#\/(t|hand)\//.test(h))));
  if (!h.startsWith("#/hand/")) { replay = null; stopPlay(); }
  try {
    let m;
    if (h === "#/" || h === "#") await viewDashboard();
    else if (h === "#/tournaments") await viewTournaments();
    else if ((m = h.match(/^#\/t\/(\d+)$/))) await viewTournament(m[1]);
    else if ((m = h.match(/^#\/hand\/(\w+)$/))) await viewHand(m[1]);
    else if (h === "#/analysis") await viewAnalysis();
    else if (h === "#/import") await viewImport();
    else if (h === "#/luck") viewLuck();
    else app.innerHTML = "<p>Page not found.</p>";
  } catch (err) { app.innerHTML = `<p class="warn">Something went wrong: ${esc(err.message)}</p>`; }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
api("/api/settings").then(st => document.body.classList.toggle("two-color", st.four_color === false)).catch(() => {}).finally(route);
</script>
