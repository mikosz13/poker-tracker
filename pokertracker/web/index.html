<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Tracker</title>
<style>
:root{--bg:#fff;--fg:#14161a;--muted:#6b7280;--card:#f3f4f6;--line:#e5e7eb;--blue:#2f6fed;--orange:#e67e22;--pos:#0a7d2c;--neg:#c0392b;--red:#c0392b;--felt:#1f6f4a;--rail:#5a3d2b}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
nav{max-width:960px;margin:0 auto;display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
nav a{padding:6px 10px;border-radius:8px;color:var(--fg);text-decoration:none;white-space:nowrap}
nav a.on{background:var(--card);font-weight:600}
main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.2em 0 .4em}h2{font-size:1.02rem;margin:1.4em 0 .5em}
a{color:var(--blue)}.m{color:var(--muted);font-size:.88rem}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k div{background:var(--card);border-radius:10px;padding:10px}.k b{display:block;font-size:1.2rem}
.box{background:var(--card);border-radius:12px;padding:12px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}tr.click{cursor:pointer}tr.click:hover{background:var(--card)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{display:inline-block;min-width:1.9em;padding:1px 4px;margin:1px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-weight:600}
.card.red{color:var(--red)}
svg.chart{width:100%;height:auto;background:var(--card);border-radius:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.rt{grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:16/10.5;container-type:inline-size;user-select:none}
@media (max-width:560px){.stage{aspect-ratio:4/5}}
.oval{position:absolute;inset:13% 9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--felt) 78%,#fff) 0%,var(--felt) 62%,color-mix(in srgb,var(--felt) 70%,#000) 100%);
  border:clamp(6px,1.6cqw,12px) solid var(--rail);box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 0 26px rgba(0,0,0,.35)}
@media (max-width:560px){.oval{inset:11% 12%}}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:62%}
.street{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;min-height:1.1em}
.board{display:flex;gap:4px;justify-content:center;margin:4px 0 6px}
.pot{font-weight:700;font-size:1.02rem}.pot small{font-weight:400;opacity:.7}
.eqline{font-size:.8rem;margin-top:3px;opacity:.92}
.pc{--w:clamp(26px,5.6cqw,40px);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.14);background:#fff;color:#14161a;display:inline-flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;font-weight:700;font-size:calc(var(--w)*.46);box-shadow:0 1px 3px rgba(0,0,0,.35);flex:none}
.pc i{font-style:normal;font-size:.95em}.pc.red{color:#d0302b}
.pc.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.28);box-shadow:none}
.pc.back{background:repeating-linear-gradient(45deg,var(--blue) 0 3px,color-mix(in srgb,var(--blue) 70%,#fff) 3px 6px);border:2px solid #fff}
.pc.new{animation:deal .22s ease-out}
@keyframes deal{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .2s;z-index:1}
.st .hc{display:flex;gap:2px;margin-bottom:-8px;z-index:0}.st .hc .pc{--w:clamp(20px,4cqw,30px)}
.st.hero .hc .pc{--w:clamp(28px,5.8cqw,42px)}
.st .box{position:relative;z-index:1;min-width:clamp(64px,13cqw,104px);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:border-color .15s,box-shadow .15s}
.st .nick{font-size:.78rem;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.st:not(.hero) .nick{font-weight:700;letter-spacing:.02em}
.st .stk{font-weight:700;font-size:.9rem;white-space:nowrap}
.st .pt{position:absolute;top:-9px;left:-6px;font-size:.66rem;font-weight:700;background:var(--card);color:var(--muted);border-radius:6px;padding:0 5px;border:1px solid var(--line)}
.st.hero .box{border-color:var(--blue)}.st.hero .nick{font-weight:700;color:var(--blue)}
.st.act .box{border-color:#f5b301;box-shadow:0 0 0 3px rgba(245,179,1,.35)}
.st.nxt .box{border-style:dashed;border-color:#f5b301}
.st.fold{opacity:.38}.st.win .box{border-color:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 35%,transparent)}
.badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.badge.ai{background:var(--neg);color:#fff}.badge.eq.chg{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1.45);box-shadow:0 0 0 4px rgba(245,179,1,.45)}100%{transform:none;box-shadow:none}}.badge.eq{background:#f5b301;color:#14161a;right:-8px;left:auto;transform:none;bottom:auto;top:-9px}
.seat0{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,6cqw,44px);height:clamp(18px,3.4cqw,26px);border-radius:8px;border:1.5px dashed var(--line);opacity:.6}
.bet{position:absolute;transform:translate(-50%,-50%);font-size:.78rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);border-radius:10px;padding:1px 7px 1px 4px;white-space:nowrap;transition:opacity .18s;z-index:1}
.bet::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#f5b301;border:2px dashed #fff;margin-right:4px;vertical-align:-1px}
.bet.won{background:color-mix(in srgb,var(--pos) 85%,#000)}.bet.won::before{display:none}.bet.off{opacity:0}
.dealer{position:absolute;transform:translate(-50%,-50%);width:clamp(16px,2.8cqw,22px);height:clamp(16px,2.8cqw,22px);border-radius:50%;background:#fff;color:#14161a;font-size:.62rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:8px 0}.ctl button{min-width:2.8em}.ctl select{padding:6px}
.log{background:var(--card);border-radius:12px;padding:6px;max-height:min(520px,60vh);overflow:auto;font-size:.86rem}
@media (max-width:760px){.log{max-height:240px}}
.log .sh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 6px 2px}
.log .li{padding:3px 6px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.log .li:hover{background:var(--bg)}.log .li.cur{background:var(--blue);color:#fff}.log .li.cur .m,.log .li.cur .pos,.log .li.cur .neg{color:#fff}
.log .li b{font-weight:700}.log .li .cs{display:flex;gap:2px}.log .li .card{margin:0;font-size:.8rem;padding:0 3px;min-width:1.7em}
.ctrl{display:flex;gap:6px;justify-content:center;margin:10px 0}.ctrl button{min-width:3em}
.tag{display:inline-block;font-size:.78rem;background:var(--card);border-radius:6px;padding:1px 6px;margin:1px}
.warn{border-left:4px solid var(--orange);padding:8px 10px;background:var(--card);border-radius:6px}
</style>
</head>
<body>
<header><nav id="nav">
  <a href="#/">Dashboard</a><a href="#/tournaments">Tournaments</a><a href="#/import">Import</a><a href="#/luck">How luck works</a>
</nav></header>
<main id="app">Loading…</main>
<script>
const TOKEN = "__TOKEN__";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUIT = {c:"♣", d:"♦", h:"♥", s:"♠"};
const num = (x, d=1) => x == null ? "–" : Number(x).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = (x, d=1, unit="") => x == null ? "–" :
  `<span class="${Number(x) >= 0 ? "pos" : "neg"}">${Number(x) >= 0 ? "+" : ""}${num(x, d)}${unit}</span>`;
const money = x => x == null ? "–" : "$" + num(x, 2);
function cards(t) {
  const a = Array.isArray(t) ? t : String(t || "").split(" ").filter(Boolean);
  return a.length ? a.map(c => `<span class="card ${"dh".includes(c[1]) ? "red" : ""}">${esc(c[0])}${SUIT[c[1]] || ""}</span>`).join("") : '<span class="m">–</span>';
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function chart(series, colors = ["var(--blue)", "var(--orange)"]) {
  const vals = series.flat();
  if (vals.length < 2) return '<p class="m">Not enough data for a chart yet.</p>';
  const w = 300, h = 110, lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), span = (hi - lo) || 1;
  const y = v => (h - 8 - (v - lo) / span * (h - 16)).toFixed(1);
  const lines = series.map((s, k) => `<polyline fill="none" stroke="${colors[k]}" stroke-width="2" points="${
    s.map((v, i) => `${(i * w / Math.max(s.length - 1, 1)).toFixed(1)},${y(v)}`).join(" ")}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".25"/>${lines}</svg>`;
}
const table = (head, rows) => `<div class="scroll"><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table></div>`;
const luckLink = '<a href="#/luck">How is luck calculated?</a>';

// ---- Dashboard -------------------------------------------------------------
async function viewDashboard() {
  const [{dashboard: d, session: s}, st] = await Promise.all([api("/api/dashboard"), api("/api/status")]);
  const banner = st.running ? `<p class="warn">Importing ${st.done}/${st.total} files… <a href="#/import">details</a>. The numbers below will update when it finishes.</p>` : "";
  if (!d.tournaments && !d.hands) {
    app.innerHTML = banner + `<h1>Welcome</h1><p>No data yet. Go to <a href="#/import">Import</a> and point the app at the folder where you save PokerCraft exports.</p>`;
    return;
  }
  let h = "<h1>Dashboard</h1>" + banner;
  if (s) {
    h += `<div class="box"><b>Last session</b> <span class="m">${esc(s.from)} – ${esc(s.to)}</span>
      <div class="k" style="margin-top:8px"><div>Tournaments<b>${s.count}</b></div><div>Hands<b>${s.hands}</b></div>
      <div>Profit<b>${s.profit == null ? "–" : sgn(s.profit, 2, " $")}</b></div><div>All-in luck<b>${sgn(s.luck_bb, 1, " BB")}</b></div></div>
      ${table(["Tournament", "Place", "Profit $", "Luck BB"], s.tournaments.map(t => `<tr class="click" onclick="location.hash='#/t/${t.tournament_id}'">
        <td>${esc(t.name)} <span class="m">$${num(t.buyin_total, 2)}</span></td><td>${t.finish_place ?? "–"}/${t.players ?? "–"}</td>
        <td>${t.profit == null ? '<span class="m">no summary</span>' : sgn(t.profit, 2)}</td><td>${sgn(t.luck_bb)}</td></tr>`))}</div>`;
  }
  const roi = d.roi_pct == null ? "–" : sgn(d.roi_pct, 0, "%");
  h += `<h2>All tournaments</h2><div class="k"><div>Tournaments<b>${d.tournaments}</b></div><div>Profit (cash)<b>${sgn(d.profit, 0, " $")}</b></div>
    <div>ROI<b>${roi}</b></div><div>In the money<b>${d.itm}/${d.tournaments}</b></div>
    <div>Knockouts<b>${d.knockouts.sole}</b><span class="m">${d.knockouts.per_tournament == null ? "" : num(d.knockouts.per_tournament, 2) + " per tournament"}</span></div></div>
    <p class="m">cost ${money(d.cost)} · cash ${money(d.cash)}${d.tickets ? ` · tickets ${money(d.tickets)} (not in ROI)` : ""} · ${d.hands} hands</p>`;
  if (d.tournaments < 30) h += `<p class="warn">Small sample (${d.tournaments} tournaments). Tournament results this small are mostly variance.</p>`;
  h += `<h2>Cash profit, cumulative</h2>${chart([d.profit_curve])}`;
  h += `<h2>Luck</h2>${chart([d.bb_actual, d.bb_adjusted])}
    <p class="m"><span style="color:var(--blue)">■</span> actual result in BB &nbsp; <span style="color:var(--orange)">■</span> luck-adjusted (all-in luck removed) · ${luckLink}</p>`;
  if (d.allins.count) h += `<p>${d.allins.count} all-ins: actual ${sgn(d.allins.net_bb)} BB, expected ${sgn(d.allins.ev_bb)} BB, luck ${sgn(d.allins.luck_bb)} BB.</p>`;
  const tagRows = pre => d.tags.filter(t => t.tag.startsWith(pre)).map(t =>
    `<tr><td>${esc(t.tag.split(":")[1])}</td><td>${t.n}</td><td>${t.itm}</td><td>${sgn(t.roi_pct, 0, "%")}</td></tr>`);
  const entry = tagRows("entry:");
  if (entry.length) h += `<h2>Late registration vs start</h2>${table(["Entered", "n", "ITM", "ROI"], entry)}`;
  if (d.by_buyin.length) h += `<h2>By buy-in</h2>${table(["Buy-in", "n", "ITM", "Profit $", "ROI"], d.by_buyin.map(b =>
    `<tr><td>${money(b.buyin)}</td><td>${b.n}</td><td>${b.itm}</td><td>${sgn(b.profit, 2)}</td><td>${sgn(b.roi_pct, 0, "%")}</td></tr>`))}`;
  if (d.positions.length) h += `<h2>By position</h2>${table(["Position", "Hands", "VPIP", "PFR", "BB", "bb/100"], d.positions.map(p =>
    `<tr><td>${esc(p.position)}</td><td>${p.hands}</td><td>${num(p.vpip_pct, 0)}%</td><td>${num(p.pfr_pct, 0)}%</td><td>${sgn(p.net_bb)}</td><td>${sgn(p.bb_per_100, 0)}</td></tr>`))}`;
  const other = d.tags.filter(t => !t.tag.startsWith("entry:")).map(t =>
    `<tr><td>${esc(t.tag)}</td><td>${t.n}</td><td>${t.itm}</td><td>${sgn(t.roi_pct, 0, "%")}</td></tr>`);
  if (other.length) h += `<h2>Other categories</h2>${table(["Tag", "n", "ITM", "ROI"], other)}`;
  app.innerHTML = h;
}

// ---- Tournaments ------------------------------------------------------------
let filters = {buyin: "", format: "", entry: ""};
async function viewTournaments() {
  const all = await api("/api/tournaments");
  const opts = (vals, cur, label) => `<option value="">${label}</option>` + [...new Set(vals)].filter(v => v !== "" && v != null)
    .sort((a, b) => a - b).map(v => `<option ${String(v) === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  const draw = () => {
    const rows = all.filter(t => (!filters.buyin || String(t.buyin_total) === filters.buyin)
      && (!filters.format || t.format === filters.format)
      && (!filters.entry || t.tags.includes("entry:" + filters.entry)));
    const done = rows.filter(t => t.profit != null);
    const cost = done.reduce((a, t) => a + Number(t.total_cost), 0), profit = done.reduce((a, t) => a + Number(t.profit), 0);
    document.getElementById("list").innerHTML = `<p class="m">${rows.length} tournaments · profit ${sgn(profit, 2, " $")} · ROI ${cost ? sgn(100 * profit / cost, 0, "%") : "–"}</p>` +
      table(["Date", "Tournament", "Buy-in", "Place", "Profit $", "KOs", "Luck BB"], rows.map(t => `<tr class="click" onclick="location.hash='#/t/${t.tournament_id}'">
        <td>${esc(t.date.slice(0, 10))}</td><td>${esc(t.name)}</td><td>${t.buyin_total == null ? "–" : money(t.buyin_total)}</td>
        <td>${t.finish_place ?? "–"}/${t.players ?? "–"}</td><td>${t.profit == null ? '<span class="m">no summary</span>' : sgn(t.profit, 2)}${t.prize_is_ticket ? " +ticket" : ""}</td>
        <td>${t.hands ? (t.knockouts || 0) : "–"}</td><td>${t.luck_bb == null ? "–" : sgn(t.luck_bb)}</td></tr>`));
  };
  app.innerHTML = `<h1>Tournaments</h1><div class="filters">
    <select id="fb">${opts(all.map(t => t.buyin_total), filters.buyin, "All buy-ins")}</select>
    <select id="ff">${opts(all.map(t => t.format), filters.format, "All formats")}</select>
    <select id="fe"><option value="">Any entry</option><option value="start" ${filters.entry === "start" ? "selected" : ""}>From the start</option>
      <option value="late" ${filters.entry === "late" ? "selected" : ""}>Late registration</option></select></div><div id="list"></div>`;
  for (const [id, key] of [["fb", "buyin"], ["ff", "format"], ["fe", "entry"]])
    document.getElementById(id).onchange = e => { filters[key] = e.target.value; draw(); };
  draw();
}

// ---- Tournament detail -------------------------------------------------------
async function viewTournament(id) {
  const d = await api(`/api/tournament/${id}`);
  let h = `<p><a href="#/tournaments">← Tournaments</a></p><h1>${esc(d.name)} <span class="m">#${d.tournament_id}</span></h1>`;
  const r = d.result;
  if (r) h += `<div class="k"><div>Place<b>${r.place}/${r.players}</b></div><div>Prize<b>${money(r.prize)}${r.ticket ? " ticket" : ""}</b></div>
    <div>Cost<b>${money(r.cost)}</b></div><div>ROI (cash)<b>${sgn(r.roi_pct, 0, "%")}</b></div></div>`;
  else h += `<p class="m">No summary imported yet, so no result or ROI.</p>`;
  h += `<p>${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</p>`;
  h += d.entries.map(e => `<p class="m">Entry ${e.entry_no}: level ${e.level}, ${num(e.stack_bb, 0)} BB${e.fresh ? "" : " · earlier hands missing from the export"}</p>`).join("");
  if (!d.hands) { app.innerHTML = h + '<p class="m">No hand history imported for this tournament.</p>'; return; }
  const s = d.stack, a = d.allins;
  h += `<div class="k"><div>Hands<b>${d.hands}</b></div><div>VPIP / PFR<b>${num(d.vpip_pct, 0)} / ${num(d.pfr_pct, 0)}</b></div><div>Net<b>${sgn(d.net_bb, 0, " BB")}</b></div>
    <div>Knockouts<b>${d.knockouts.sole}${d.knockouts.shared ? ` <span class="m">+${d.knockouts.shared} shared</span>` : ""}</b></div></div>`;
  h += `<h2>Stack in BB</h2>${chart([s.path])}<p class="m">${num(s.start_bb, 0)} → ${num(s.end_bb, 0)} BB, peak ${num(s.peak_bb, 0)} BB after ${s.peak_after_hands} hands</p>`;
  h += `<h2>Positions</h2>${table(["Position", "Hands", "BB", "bb/100"], d.positions.map(p => `<tr><td>${esc(p.position)}</td><td>${p.hands}</td><td>${sgn(p.net_bb)}</td><td>${sgn(p.bb_per_100, 0)}</td></tr>`))}`;
  if (!d.best_position) h += `<p class="m">Fewer than 8 hands per position, too small to rank.</p>`;
  else h += `<p class="m">Best: ${esc(d.best_position.position)}${d.worst_position ? ` · worst: ${esc(d.worst_position.position)}` : ""} (positions with 8+ hands)</p>`;
  const moments = (title, list) => list.length ? `<h2>${title}</h2>` + table(["Cards", "Pos", "Board", "BB", ""], list.map(m =>
    `<tr class="click" onclick="location.hash='#/hand/${m.hand_id}'"><td>${cards(m.hole_cards)}</td><td>${esc(m.position)}</td><td>${cards(m.board)}</td><td>${sgn(m.net_bb)}</td><td>▶</td></tr>`)) : "";
  h += moments("Biggest wins", d.biggest_wins) + moments("Biggest losses", d.biggest_losses);
  if (d.strongest_showdown) h += `<h2>Strongest showdown hand</h2><p><a href="#/hand/${d.strongest_showdown.hand_id}">${esc(d.strongest_showdown.hand)}</a>: ${cards(d.strongest_showdown.hole_cards)} on ${cards(d.strongest_showdown.board)}</p>`;
  if (a.count) h += `<h2>All-ins</h2><p>${a.count} all-ins: actual ${sgn(a.net_bb)} BB, expected ${sgn(a.ev_bb)} BB, luck ${sgn(a.luck_bb)} BB. Won ${a.won} (expected ${num(a.expected_won)}). ${luckLink}</p>` +
    a.notable.map(n => `<p><a href="#/hand/${n.hand_id}">${esc(n.kind)}</a>: ${cards(n.hole_cards)} on ${cards(n.board)} (${esc(n.street)}), equity ${num(100 * n.equity, 1)}%, luck ${sgn(n.luck_bb)} BB</p>`).join("");
  h += `<h2>All hands (${d.hand_list.length})</h2>` + table(["Time", "Lvl", "Pos", "Cards", "Board", "BB"], d.hand_list.map(x =>
    `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'"><td>${esc(String(x.played_at).slice(11, 16))}</td><td>${x.level}</td><td>${esc(x.position)}</td>
     <td>${cards(x.hole_cards)}</td><td>${cards(x.board)}</td><td>${sgn(x.net_bb)}</td></tr>`));
  app.innerHTML = h;
}

// ---- Replayer -----------------------------------------------------------------
// The server sends full snapshots (pot, stacks, bets, board); this code only draws them.
let replay = null, step = 0, playTimer = null;
const SPEEDS = {slow: 1500, normal: 900, fast: 450};
const VERBS = {folds: "folds", checks: "checks", calls: "calls", bets: "bets", raises: "raises to"};
const bbs = (x, bb) => num(x / bb, Math.abs(x / bb) >= 100 ? 0 : 1);
const pcard = (c, cls = "") => `<span class="pc ${"dh".includes(c[1]) ? "red" : ""} ${cls}">${esc(c[0])}<i>${SUIT[c[1]] || ""}</i></span>`;

function seatPoint(r, seat, f = 1) {
  // Seats are numbered clockwise; slot 0 (Hero) is bottom centre, angles grow clockwise on screen.
  const n = r.max_seats || Math.max(...r.steps[0].players.map(p => p.seat)), hero = r.steps[0].players.find(p => p.hero);
  const k = ((seat - (hero ? hero.seat : 1)) % n + n) % n, t = Math.PI / 2 + k * 2 * Math.PI / n;
  const narrow = matchMedia("(max-width:560px)").matches, rx = narrow ? 40 : 43, ry = narrow ? 41 : 39;
  return [50 + rx * f * Math.cos(t), 50 + ry * f * Math.sin(t)];
}
const at = ([x, y]) => `left:${x.toFixed(2)}%;top:${y.toFixed(2)}%`;

function logLine(s, r) {
  const bb = r.big_blind;
  if (s.kind === "start") return `Blinds ${num(r.small_blind, 0)}/${num(r.big_blind, 0)}${r.ante ? `, ante ${num(r.ante, 0)}` : ""}`;
  if (s.kind === "deal") return `<span class="cs">${cards(s.board)}</span>`;
  if (s.kind === "return") return `<span>Returned to ${s.action.nick === "Hero" ? "<b>Hero</b>" : esc(s.action.nick)}</span><span>${bbs(s.action.amount, bb)} BB</span>`;
  if (s.kind === "result") {
    const w = s.players.filter(p => p.net > 0);
    return w.length ? w.map(p => `<span>${p.hero ? "<b>Hero</b>" : esc(p.nick)} wins</span><span>${sgn(p.net / bb, 1)} BB</span>`).join("") : esc(s.label);
  }
  if (s.kind === "action") {
    const a = s.action, who = a.nick === "Hero" ? "<b>Hero</b>" : esc(a.nick);
    const amt = a.amount && a.type !== "folds" ? ` <span>${bbs(a.amount, bb)} BB</span>` : "";
    return `<span>${who} ${VERBS[a.type] || esc(a.type)}${a.all_in ? " <b>all-in</b>" : ""}</span>${amt}`;
  }
  return esc(s.label);
}

async function viewHand(id) {
  stopPlay();
  replay = await api(`/api/hand/${id}`); step = 0;
  renderHand();
}
function renderHand() {
  const r = replay, [i, n] = r.position_in_tournament;
  let log = "", street = null;
  r.steps.forEach((s, k) => {
    if (s.kind !== "result" && s.street !== street) { street = s.street; log += `<div class="sh">${esc(street)}</div>`; }
    if (s.kind === "result") log += `<div class="sh">result</div>`;
    log += `<div class="li" data-k="${k}">${s.kind === "deal" ? "<span class=m>Board</span>" : ""}${logLine(s, r)}</div>`;
  });
  const n0 = r.max_seats || 9, taken = new Set(r.steps[0].players.map(p => p.seat));
  const empty = Array.from({length: n0}, (_, k) => k + 1).filter(k => !taken.has(k))
    .map(k => `<div class="seat0" style="${at(seatPoint(r, k))}"></div>`).join("");
  const btn = r.steps[0].players.find(p => (p.position || "").startsWith("BTN"));
  app.innerHTML = `<p><a href="#/t/${r.tournament_id}">← Tournament</a></p>
    <h1>Hand ${i} of ${n}</h1><p class="m">Level ${r.level} · blinds ${num(r.small_blind, 0)}/${num(r.big_blind, 0)} ante ${num(r.ante, 0)} · table ${esc(r.table)} · ${esc(r.played_at)}</p>
    <div class="rt"><div>
      <div class="stage" id="stage"><div class="oval"></div>${empty}
        ${btn ? `<div class="dealer" style="${at(seatPoint(r, btn.seat + .32, .74))}">D</div>` : ""}
        <div class="center"><div class="street" id="street"></div><div class="board" id="board"></div><div class="pot" id="pot"></div><div class="eqline" id="eq"></div></div>
        <div id="seats"></div></div>
      <div class="ctl">
        <button id="b0" title="Start (Home)">⏮</button><button id="b1" title="Back (←)">◀</button>
        <button id="bp" class="primary" title="Play / pause (space)">▶ Play</button>
        <button id="b2" title="Next (→)">▶</button><button id="b3" title="End (End)">⏭</button>
        <select id="spd" title="Autoplay speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select>
        <span class="m" id="cnt"></span>
      </div>
      <p class="ctl">${r.prev_id ? `<a href="#/hand/${r.prev_id}">← previous hand</a>` : ""} &nbsp; ${r.next_id ? `<a href="#/hand/${r.next_id}">next hand →</a>` : ""}</p>
    </div><div class="log" id="log">${log}</div></div>`;
  const go = k => { step = Math.max(0, Math.min(r.steps.length - 1, k)); drawStep(); };
  replay.go = go;
  document.getElementById("b0").onclick = () => { stopPlay(); go(0); };
  document.getElementById("b1").onclick = () => { stopPlay(); go(step - 1); };
  document.getElementById("b2").onclick = () => { stopPlay(); go(step + 1); };
  document.getElementById("b3").onclick = () => { stopPlay(); go(r.steps.length - 1); };
  document.getElementById("bp").onclick = togglePlay;
  document.getElementById("spd").onchange = () => { if (playTimer) { stopPlay(); togglePlay(); } };
  document.getElementById("log").onclick = e => { const li = e.target.closest(".li"); if (li) { stopPlay(); go(+li.dataset.k); } };
  drawStep();
}

function togglePlay() {
  if (playTimer) return stopPlay();
  if (step >= replay.steps.length - 1) replay.go(0);
  playTimer = setInterval(() => {
    if (!replay || !document.getElementById("stage")) return stopPlay();
    replay.go(step + 1);
    if (step >= replay.steps.length - 1) stopPlay();
  }, SPEEDS[document.getElementById("spd").value]);
  document.getElementById("bp").textContent = "⏸ Pause";
}
function stopPlay() {
  clearInterval(playTimer); playTimer = null;
  const b = document.getElementById("bp"); if (b) b.textContent = "▶ Play";
}

function drawStep() {
  const r = replay, s = r.steps[step], bb = r.big_blind, prev = r.steps[step - 1];
  document.getElementById("street").textContent = s.result ? "result" : s.street;
  const fresh = step === 0 || !prev ? 0 : prev.board.length;
  document.getElementById("board").innerHTML = [0, 1, 2, 3, 4].map(k => s.board[k]
    ? pcard(s.board[k], k >= fresh && s.board.length > fresh && step ? "new" : "") : `<span class="pc slot"></span>`).join("");
  document.getElementById("pot").innerHTML = s.result
    ? `Pot ${bbs(r.total_pot, bb)} BB <small>(${num(r.total_pot, 0)}) paid out</small>`
    : `Pot ${bbs(s.pot, bb)} BB <small>(${num(s.pot, 0)})</small>`;
  const hero = s.players.find(p => p.hero);
  document.getElementById("eq").innerHTML = !(hero && hero.equity != null && r.hero_allin) ? ""
    : s.result ? `Hero all-in equity <b>${num(100 * r.hero_allin.equity, 1)}%</b> · luck ${sgn(r.hero_allin.luck / bb, 1, " BB")}
        <a href="#/luck" style="color:#fff">how?</a>`
    : `Hero equity <b>${num(100 * hero.equity, 1)}%</b>${prev && prev.players.find(p => p.hero).equity == null ? " at the all-in" : ""}`;
  const eqChanged = p => { const q = prev && prev.players.find(x => x.nick === p.nick); return q && q.equity != null && q.equity !== p.equity; };
  document.getElementById("seats").innerHTML = s.players.map(p => {
    const won = s.result && (r.collected[p.nick] || 0) > 0;
    const cls = ["st", p.hero && "hero", p.folded && "fold", p.acting && "act", !p.acting && s.next === p.nick && "nxt", won && "win"].filter(Boolean).join(" ");
    const hole = p.folded && !p.hero ? "" : p.cards.length ? p.cards.map(c => pcard(c)).join("") : `<span class="pc back"></span><span class="pc back"></span>`;
    const bet = won ? `<div class="bet won" style="${at(seatPoint(r, p.seat, .6))}">+${bbs(r.collected[p.nick], bb)} BB</div>`
      : `<div class="bet ${p.commit ? "" : "off"}" style="${at(seatPoint(r, p.seat, .6))}">${p.commit ? bbs(p.commit, bb) : 0} BB</div>`;
    const res = p.net != null ? ` <span style="font-size:.78rem">${sgn(p.net / bb, 1)}</span>` : "";
    return `<div class="${cls}" style="${at(seatPoint(r, p.seat))}" title="${esc(p.nick)}: ${num(p.stack, 0)} chips">
        <div class="hc">${hole}</div>
        <div class="box">${p.hero ? `<span class="pt">${esc(p.position || "")}</span>` : ""}
          ${p.equity != null && !s.result ? `<span class="badge eq ${eqChanged(p) ? "chg" : ""}">${num(100 * p.equity, 0)}%</span>` : ""}
          <div class="nick">${esc(p.nick)}</div><div class="stk">${bbs(p.stack, bb)} BB${res}</div>
          ${p.all_in && !s.result ? `<span class="badge ai">ALL-IN</span>` : ""}</div></div>${bet}`;
  }).join("");
  document.getElementById("cnt").textContent = `${step + 1} / ${r.steps.length}`;
  const log = document.getElementById("log");
  log.querySelectorAll(".li").forEach(li => li.classList.toggle("cur", +li.dataset.k === step));
  const cur = log.querySelector(".li.cur");
  if (cur && log.scrollHeight > log.clientHeight)
    log.scrollTop = Math.max(0, cur.offsetTop - log.offsetTop - log.clientHeight / 2 + cur.offsetHeight / 2);
}
document.addEventListener("keydown", e => {
  if (!replay || !location.hash.startsWith("#/hand/") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = {ArrowRight: "b2", ArrowLeft: "b1", Home: "b0", End: "b3", " ": "bp"}[e.key];
  if (k) { e.preventDefault(); document.getElementById(k).click(); }
});
// Seat positions depend on the table shape, which changes at the narrow breakpoint
matchMedia("(max-width:560px)").addEventListener("change", () => {
  if (replay && document.getElementById("stage")) { const k = step; stopPlay(); renderHand(); replay.go(k); }
});

// ---- Import -----------------------------------------------------------------
let poller = null;
const resultBox = r => `<div class="box"><b>${r.source === "auto" ? "Imported automatically" : "Done"}</b>
  <span class="m">${esc(String(r.finished_at || "").replace("T", " "))}</span><br>
  ${r.files} files read (${r.hand_files} hand histories, ${r.summary_files} summaries), ${r.unchanged} unchanged ·
  ${r.hands_new} new hands, ${r.hands_duplicate} already imported · ${r.allins} all-ins analysed · ${r.tournaments} tournaments
  <p><a href="#/">Open the dashboard →</a></p>${r.skipped.length ? `<p class="m">Skipped: ${r.skipped.map(esc).join("<br>")}</p>` : ""}</div>`;
async function viewImport() {
  const st = await api("/api/settings");
  app.innerHTML = `<h1>Import</h1>
    <p>Paste the folder where you save your PokerCraft exports (hand histories and tournament summaries: .txt, .zip or .pdf).
       Files that were already imported and did not change are skipped, so importing the whole folder again is quick.</p>
    <div class="filters"><input id="folder" style="flex:1;min-width:240px" placeholder="/Users/you/Downloads/PokerCraft" value="${esc(st.import_folder || "")}">
    <button id="go" class="primary">Import</button></div>
    <p><label><input type="checkbox" id="watch" ${st.watch ? "checked" : ""}> Watch this folder and import new exports automatically while the app is open</label><br>
       <label><input type="checkbox" id="rescan"> Re-read every file (only needed after an app update)</label></p>
    <div id="out"></div><p class="m">Database: ${esc(st.database)}</p>`;
  const out = document.getElementById("out"), btn = document.getElementById("go");
  const show = s => {
    if (s.running) {
      btn.disabled = true;
      out.innerHTML = `<div class="box"><b>Importing${s.source === "auto" ? " (automatic)" : ""}…</b>
        <progress max="${s.total || 1}" value="${s.done}" style="width:100%"></progress>
        <p class="m">${s.done} of ${s.total} files${s.current ? " · " + esc(s.current) : ""}. All-in equity is computed exactly,
        so a first import of many tournaments takes a while.</p></div>`;
      return;
    }
    btn.disabled = false;
    if (s.error) out.innerHTML = `<p class="warn">Import failed: ${esc(s.error)}</p>`;
    else if (s.result || s.last_import) out.innerHTML = resultBox(s.result || s.last_import);
  };
  const poll = async () => {
    const s = await api("/api/status");
    show(s);
    clearTimeout(poller);
    if (s.running && location.hash === "#/import") poller = setTimeout(poll, 700);
  };
  btn.onclick = async () => {
    try {
      await api("/api/import", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
        body: JSON.stringify({path: document.getElementById("folder").value, rescan: document.getElementById("rescan").checked})});
      poll();
    } catch (err) { out.innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
  };
  document.getElementById("watch").onchange = e => api("/api/watch", {method: "POST",
    headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify({enabled: e.target.checked})});
  poll();
}

// ---- How luck works ------------------------------------------------------------
function viewLuck() {
  app.innerHTML = `<h1>How luck is calculated</h1>
  <p>An <b>all-in</b> here means: all the chips are in the middle, cards are still to come, and nobody can act any more.
     From that moment the result depends only on the cards that are dealt, so it is a clean measure of luck.</p>
  <div class="box"><p><b>Equity</b>: your share of the pot if this exact situation were played out over and over. It is not estimated:
     the app goes through <i>every</i> possible remaining board (up to 1,712,304 of them preflop) with the real cards of everyone involved.
     Ties split the pot, and side pots are handled.</p>
  <p><b>Expected (EV)</b>: equity × pot, minus what you put in. What you win <i>on average</i> in this spot.</p>
  <p><b>Actual</b>: what really happened.</p>
  <p><b>Luck = actual − expected.</b> Positive: you won more than the cards deserved. Negative: less.</p>
  <p>Luck always uses the equity <b>at the moment of the all-in</b>. The replayer also shows how the equity changes as the
     flop, turn and river come, but those numbers are only for watching; they do not change your luck.</p></div>
  <h2>Example</h2>
  <p>You have ${cards("As Ah")} against ${cards("Kd Kc")}, 100 BB each, all-in before the flop. Your equity is about 81%.</p>
  <p>Expected = 0.81 × 200 − 100 = <b>+62 BB</b>. If you win: actual +100 BB, luck <span class="pos">+38 BB</span>.
     If you lose: actual −100 BB, luck <span class="neg">−162 BB</span>.</p>
  <h2>Reading it</h2>
  <p>Good decisions show up as a positive <b>expected</b> number: you get your chips in as the favourite.
     <b>Luck</b> swings up and down and tends towards zero over many tournaments. The orange line on the dashboard is your result with
     that luck removed.</p>
  <p class="m">Limits: measured in chips and big blinds, not dollars (no payout structures needed). Only all-ins where every player's
     cards are known count, as in PokerTracker. A "bad beat" is losing with 80%+ equity, a "suckout" winning with 20% or less.</p>`;
}

// ---- Router -----------------------------------------------------------------
async function route() {
  const h = location.hash || "#/";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on",
    a.getAttribute("href") === h || (a.getAttribute("href") === "#/tournaments" && /^#\/(t|hand)\//.test(h))));
  if (!h.startsWith("#/hand/")) { replay = null; stopPlay(); }
  try {
    let m;
    if (h === "#/" || h === "#") await viewDashboard();
    else if (h === "#/tournaments") await viewTournaments();
    else if ((m = h.match(/^#\/t\/(\d+)$/))) await viewTournament(m[1]);
    else if ((m = h.match(/^#\/hand\/(\w+)$/))) await viewHand(m[1]);
    else if (h === "#/import") await viewImport();
    else if (h === "#/luck") viewLuck();
    else app.innerHTML = "<p>Page not found.</p>";
  } catch (err) { app.innerHTML = `<p class="warn">Something went wrong: ${esc(err.message)}</p>`; }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
