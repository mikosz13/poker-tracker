<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Tracker</title>
<style>
:root{--bg:#fff;--fg:#14161a;--muted:#6b7280;--card:#f3f4f6;--line:#e5e7eb;--blue:#2f6fed;--orange:#e67e22;--pos:#0a7d2c;--neg:#c0392b;--red:#c0392b;--felt:#1f6f4a;--rail:#5a3d2b;--s-s:#14161a;--s-h:#c62828;--s-d:#1f62c9;--s-c:#1b7f37}
/* the system theme, unless a theme was picked with the switch (data-theme on <html>) */
:root{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d;--s-s:#e8eaed;--s-h:#ff6b6b;--s-d:#5aa2ff;--s-c:#4cd37b}}
:root[data-theme=dark]{color-scheme:dark;--bg:#121417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1d2026;--line:#2c3038;--pos:#4cd37b;--neg:#ff7b6b;--red:#ff6b6b;--felt:#1b5c3e;--rail:#2f241d;--s-s:#e8eaed;--s-h:#ff6b6b;--s-d:#5aa2ff;--s-c:#4cd37b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}

main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:.2em 0 .4em}h2{font-size:1.02rem;margin:1.4em 0 .5em}
a{color:var(--blue)}.m{color:var(--muted);font-size:.88rem}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k div{background:var(--card);border-radius:10px;padding:10px}.k b{display:block;font-size:1.2rem}
.box{background:var(--card);border-radius:12px;padding:12px}
.boxh{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{white-space:normal;vertical-align:bottom}   /* long headers (e.g. in Polish) wrap instead of widening the table */

  #list th:nth-child(3),#list td:nth-child(3),#list th:nth-child(6),#list td:nth-child(6){display:none}
  #list .wide{display:none}}
#list .narrow{display:none}@media (max-width:560px){#list .narrow{display:inline}}tr.click{cursor:pointer}tr.click:hover{background:var(--card)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.card{display:inline-block;min-width:1.9em;padding:1px 4px;margin:1px;border:1px solid var(--line);border-radius:5px;background:var(--bg);text-align:center;font-weight:600}
.card.s-s{color:var(--s-s)}.card.s-h{color:var(--s-h)}.card.s-d{color:var(--s-d)}.card.s-c{color:var(--s-c)}
svg.chart{width:100%;height:auto;background:var(--card);border-radius:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input,button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.rt{grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:16/10.5;container-type:inline-size;user-select:none}
@media (max-width:560px){.stage{aspect-ratio:4/5}}
.oval{position:absolute;inset:13% 9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--felt) 78%,#fff) 0%,var(--felt) 62%,color-mix(in srgb,var(--felt) 70%,#000) 100%);
  border:clamp(6px,1.6cqw,12px) solid var(--rail);box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 0 26px rgba(0,0,0,.35)}
@media (max-width:560px){.oval{inset:11% 12%}}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:62%}
.street{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7;min-height:1.1em}
.board{display:flex;gap:4px;justify-content:center;margin:4px 0 6px}
.pot{font-weight:700;font-size:1.02rem}.pot small{font-weight:400;opacity:.7}
.eqline{font-size:.8rem;margin-top:3px;opacity:.92}
.pc{--w:clamp(26px,5.6cqw,40px);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.14);background:#fff;color:#14161a;display:inline-flex;flex-direction:column;

body.two-color .card.s-d{color:var(--s-h)}body.two-color .card.s-c{color:var(--s-s)}
body.two-color .pc.s-d{color:#c62828}body.two-color .pc.s-c{color:#14161a}
.pc.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.28);box-shadow:none}
.pc.back{background:repeating-linear-gradient(45deg,var(--blue) 0 3px,color-mix(in srgb,var(--blue) 70%,#fff) 3px 6px);border:2px solid #fff}
.pc.new{animation:deal .22s ease-out}

.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .2s;z-index:1}
.st .hc{display:flex;gap:2px;margin-bottom:-8px;z-index:0}.st .hc .pc{--w:clamp(20px,4cqw,30px)}
.st.hero .hc .pc{--w:clamp(28px,5.8cqw,42px)}
.st .box{position:relative;z-index:1;min-width:clamp(64px,13cqw,104px);background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:3px 8px;text-align:center;

.st .nick{font-size:.78rem;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.st:not(.hero) .nick{font-weight:700;letter-spacing:.02em}
.st .stk{font-weight:700;font-size:.9rem;white-space:nowrap}

.st.hero .box{border-color:var(--blue)}.st.hero .nick{font-weight:700;color:var(--blue)}
.st.act .box{border-color:#f5b301;box-shadow:0 0 0 3px rgba(245,179,1,.35)}
.st.nxt .box{border-style:dashed;border-color:#f5b301}
.st.fold{opacity:.38}.st.win .box{border-color:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 35%,transparent)}
.badge{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:.62rem;font-weight:800;border-radius:6px;padding:0 5px;white-space:nowrap}
.badge.ai{background:var(--neg);color:#fff}.badge.eq.chg{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1.45);box-shadow:0 0 0 4px rgba(245,179,1,.45)}100%{transform:none;box-shadow:none}}.badge.eq{background:#f5b301;color:#14161a;right:-8px;left:auto;transform:none;bottom:auto;top:-9px}
.seat0{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,6cqw,44px);height:clamp(18px,3.4cqw,26px);border-radius:8px;border:1.5px dashed var(--line);opacity:.6}

.dealer{position:absolute;transform:translate(-50%,-50%);width:clamp(16px,2.8cqw,22px);height:clamp(16px,2.8cqw,22px);border-radius:50%;background:#fff;color:#14161a;font-size:.62rem;font-weight:800;

.copybox{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}

.sess-nums{display:flex;gap:18px}.sess-nums div{font-size:.78rem;color:var(--muted)}.sess-nums b{display:block;font-size:1.1rem;color:var(--fg)}

.chart-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.cols{display:grid;grid-template-columns:1fr;gap:4px 14px;align-items:start}@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:6px}.facts li{background:var(--card);border-radius:10px;padding:8px 12px;font-size:.92rem}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;margin:14px 0}

  justify-content:center;font-size:.72rem;font-weight:700;background:var(--bg);border:2px solid var(--line);color:var(--fg)}

.pc2.worst{background:var(--neg);border-color:var(--neg);color:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px}.cards .finding{margin:0}
.card-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}

.band-key{position:relative;display:inline-block;height:12px;vertical-align:middle;top:0}.band-v{text-align:right}input.pick{width:16px;height:16px;padding:0}.themes button{display:flex;align-items:center;padding:4px 7px}.themes svg{width:15px;height:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 12px}.seg button{padding:5px 10px;font-size:.88rem}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg[hidden]{display:none}
.p-custom{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:8px;font-size:.88rem}
.p-custom input{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.tchart{position:relative;background:var(--card);border-radius:10px;padding:4px 0;touch-action:pan-y}
.tchart svg{display:block;width:100%}.tchart .tip{position:absolute;pointer-events:none;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 3px 10px rgba(0,0,0,.2);
  white-space:nowrap;display:none;z-index:2}
.legend{font-size:.85rem;color:var(--muted);margin:4px 0 0}.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;
  vertical-align:middle;margin:0 4px 0 10px}
.tag{display:inline-block;font-size:.78rem;background:var(--card);border-radius:6px;padding:1px 6px;margin:1px}
.warn{border-left:4px solid var(--orange);padding:8px 10px;background:var(--card);border-radius:6px}
</style>
</head>
<body>
<header><nav id="nav">
  <a href="#/" data-i18n="nav.dashboard"></a><a href="#/tournaments" data-i18n="nav.tournaments"></a><a href="#/hands" data-i18n="nav.hands"></a><a href="#/analysis" data-i18n="nav.analysis"></a><a href="#/import" data-i18n="nav.import"></a><a href="#/luck" data-i18n="nav.luck"></a>
  <span id="langs" class="langs"><button data-l="pl" title="Polski">PL</button><button data-l="en" title="English">EN</button></span>
  <span id="themes" class="langs themes"><button data-t="light" data-i18n-title="theme.light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button><button data-t="dark" data-i18n-title="theme.dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button></span>
  <a href="#/help" class="gear helpq" data-i18n-title="nav.help">?</a>
  <a href="#/settings" class="gear" data-i18n-title="nav.settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</nav><div id="demo-bar"></div><div id="notice"></div></header>
<main id="app"></main>
<script>
const TOKEN = "__TOKEN__";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUIT = {c:"♣", d:"♦", h:"♥", s:"♠"};

// ---- Language -----------------------------------------------------------------
// Texts come from i18n/<lang>.json (English for a missing key). A value is a string with {placeholders}, or plural
// forms picked with Intl.PluralRules; {n} is the count. Texts are trusted HTML; values are escaped by the caller.
const LANGS = ["en", "pl"], NB = "\u00a0";
let LANG = "en", STR = {}, EN = {};
const dicts = {};
const loadLang = async l => dicts[l] || (dicts[l] = await fetch(`/i18n/${l}.json`).then(r => r.json()));
function t(key, p = {}) {
  let v = STR[key], rule = LANG;
  if (v == null) { v = EN[key]; rule = "en"; }
  if (v == null) return key;
  if (typeof v === "object") v = v[new Intl.PluralRules(rule).select(Number(p.n))] ?? v.other ?? v.many;
  return v.replace(/\{(\w+)\}/g, (m, k) => !(k in p) ? m : k === "n" && typeof p.n === "number" ? num(p.n, 0) : p[k]);
}
async function setLang(l, save) {
  [EN, STR] = await Promise.all([loadLang("en"), loadLang(l)]);
  LANG = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-title]").forEach(e => { e.title = t(e.dataset.i18nTitle); });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  if (save) try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                             body: JSON.stringify({lang: l})}); } catch (e) { /* still applied now */ }
}
document.getElementById("langs").onclick = async e => {
  const b = e.target.closest("button");
  if (!b || b.dataset.l === LANG) return;
  await setLang(b.dataset.l, true);
  if (replay && document.getElementById("stage")) { const k = step; stopPlay(); renderHand(); replay.go(k); }
  else route(true);
};

// ---- Theme: the system's until one is picked; the server puts the saved choice on <html> so the page does not flash
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const markTheme = () => document.querySelectorAll("#themes button").forEach(b => b.classList.toggle("on",
  b.dataset.t === (document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light"))));
systemDark.addEventListener("change", markTheme);
markTheme();
document.getElementById("themes").onclick = async e => {
  const b = e.target.closest("button");
  if (!b) return;
  document.documentElement.dataset.theme = b.dataset.t;
  markTheme();
  try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                   body: JSON.stringify({theme: b.dataset.t})}); } catch (err) { /* still applied now */ }
};

// Numbers: a decimal comma and non-breaking thousands in Polish (1,5 BB; 2 445,05 $), a true minus sign
function num(x, d = 1) {
  if (x == null || x === "" || isNaN(x)) return "–";
  const v = Number(x), s = Math.abs(v).toFixed(d), [i, f] = s.split("."), pl = LANG === "pl";
  return (v < 0 && Number(s) !== 0 ? "−" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, pl ? NB : ",") + (f ? (pl ? "," : ".") + f : "");
}
const sgn = (x, d=1, unit="") => x == null ? "–" :
  `<span class="${Number(x) >= 0 ? "pos" : "neg"}">${Number(x) >= 0 ? "+" : ""}${num(x, d)}${unit.replace(/^ /, NB)}</span>`;
function money(x, d = 2) {
  if (x == null) return "–";
  if (LANG === "pl") return num(x, d) + NB + "$";
  const s = num(Math.abs(x), d);
  return (Number(x) < 0 && Number(Math.abs(x).toFixed(d)) !== 0 ? "−" : "") + "$" + s;
}
const pct = x => x == null ? "–" : num(x, 1) + "%";
const bbUnit = (x, d = 1) => num(x, d) + NB + "BB";
// chips on an axis or in a line: "9,3 mln" / "977 tys." / "850"
const chipsShort = x => {
  if (Math.abs(x) < 1e4) return num(x, 0);
  if (Math.abs(x) < 1e6) return t("chips.k", {x: num(x / 1e3, 0)});
  const m = Math.abs(x) >= 1e7 ? Math.round(x / 1e6) : Math.round(x / 1e5) / 10;          // "5 mln", "9,3 mln"
  return t("chips.m", {x: num(m, Number.isInteger(m) ? 0 : 1)});
};
// Dates: "2026-10-11 21:45" in English, "11.10.2026 21:45" in Polish; always a 24 h clock
const pad = n => String(n).padStart(2, "0");
function dateTime(s) {
  const m = String(s ?? "").match(/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d:\d\d))?/);
  if (!m) return esc(s);
  return (LANG === "pl" ? `${m[3]}.${m[2]}.${m[1]}` : `${m[1]}-${m[2]}-${m[3]}`) + (m[4] ? " " + m[4] : "");
}
const dayLabel = d => LANG === "pl" ? `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`
  : d.toLocaleDateString("en-US", {month: "short", day: "numeric"});
const timeLabel = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

function cards(x) {
  const a = Array.isArray(x) ? x : String(x || "").split(" ").filter(Boolean);
  return a.length ? a.map(c => `<span class="card s-${esc(c[1])}">${esc(c[0])}${SUIT[c[1]] || ""}</span>`).join("") : '<span class="m">–</span>';
}
async function api(path, opts) {
  // texts made on the server (session summary, analysis) come in the page's language
  const url = opts ? path : path + (path.includes("?") ? "&" : "?") + "lang=" + LANG;
  const r = await fetch(url, opts);
  const j = await r.json();
  if (!r.ok) { const e = new Error(j.code ? t("err." + j.code) : j.error || r.status); throw e; }
  return j;
}
const table = (head, rows, cls = "") => `<div class="scroll ${cls}"><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table></div>`;
// Money's folded detail tables (whole history): tournaments, ITM where known, profit and ROI per row
function detailTable(title, first, list, label, countTip) {
  if (!list || !list.length) return "";
  return `<details class="more"><summary>${t(title)}</summary>${table([first, countHead(countTip), ...itmHead(), t("col.profitUsd"), "ROI"],
    list.map(x => `<tr class="${fewClass(x.n, MIN_T)}" title="${fewTip(x.n, MIN_T, "t")}"><td>${label(x)}</td><td>${x.n}</td>${itmCells(x)}
      <td>${sgn(x.profit, 2)}</td><td>${x.roi_pct == null ? "–" : sgn(x.roi_pct, 0, "%")}</td></tr>`))}</details>`;
}
// small samples: greyed, with a tooltip (fewer than 10 tournaments or 30 hands)
const MIN_T = 10, MIN_H = 30;
const fewClass = (n, min) => n < min ? "few" : "";
const fewTip = (n, min, unit) => n < min ? esc(t("common.few", {min: t(unit === "h" ? "common.handsN" : "common.tournaments", {n: min})})) : "";
// ITM only where the files tell it: without bounties and in satellites (a bounty summary gives one total)
// "Tournaments" with what it counts in a tooltip (a dotted underline marks it)
const countHead = (tip = "col.countTip") => `<span class="tip" title="${esc(t(tip))}">${t("col.count")}</span>`;
const itmHead = () => [`<span class="tip" title="${esc(t("itm.tip"))}">${t("col.itm")}</span>`, t("col.itmPct")];
const itmCells = x => x.itm_n ? `<td>${t("itm.short", {itm: x.itm, n: x.itm_n})}</td><td>${pct(x.itm_pct)}</td>` : `<td class="m">–</td><td class="m">–</td>`;
function itmTile(itm, n) {
  return `<div class="${n ? fewClass(n, MIN_T) : ""}" title="${esc(t("itm.tip"))}${n && n < MIN_T ? " " + fewTip(n, MIN_T, "t") : ""}">${t("itm.title")}<b>${n ? pct(100 * itm / n) : "–"}</b><span class="m">${n ? t("itm.sub", {itm, n}) : t("itm.none")}</span></div>`;
}
// top 10 % / 15 % of the field: facts (place / players), with a 95 % bootstrap interval over tournaments
function topTiles(split) {
  const pl = split && split.all;
  if (!pl || !pl.n) return "";
  return [["top10", "top.title10"], ["top15", "top.title15"]].map(([k, title]) => {
    const x = pl[k], iv = x.interval, part = s => s && s.n ? pct(s[k].pct) : "–";
    return `<div class="${fewClass(pl.n, MIN_T)}" title="${esc(t("places.tip"))}">${t(title)}<b>${pct(x.pct)}</b><span class="m">${iv
      ? t("top.sub", {count: x.count, n: pl.n, lo: num(iv.low, 0), hi: num(iv.high, 0)}) : t("top.subShort", {count: x.count, n: pl.n})}<br>
      ${t("top.split", {s: part(split.start), l: part(split.late)})}</span></div>`;
  }).join("");
}
// where Hero finishes, as a share of the field, against an average player's share of each band
function placeChart(split) {
  if (!split || !split.all || !split.all.n) return "";
  const max = Math.max(60, ...["start", "late"].flatMap(k => split[k].bands.map(b => b.pct || 0)));
  // the average player's line only where the comparison is fair: entries from the start
  const bands = (pl, fair) => !pl.n ? `<p class="m">${t("places.none")}</p>` : pl.bands.map(b => `<div class="band"><span class="band-l">${t("band." + b.key)}</span>
      <span class="band-bar"><span class="band-fill" style="width:${100 * (b.pct || 0) / max}%"></span>
        ${fair ? `<span class="band-exp" style="left:${100 * b.expected / max}%" title="${esc(t("places.expected", {x: b.expected}))}"></span>` : ""}</span>
      <span class="band-v"><b>${pct(b.pct)}</b> <span class="m">(${b.count})</span></span></div>`).join("");
  return `<h2 title="${esc(t("places.tip"))}">${t("places.title")}</h2><p class="m">${t("places.introSplit")}</p>
    <div class="trio"><div class="box"><h3>${t("places.start")} · ${t("common.tournaments", {n: split.start.n})}</h3>${bands(split.start, true)}
      <p class="m" style="margin:6px 0 0"><span class="band-key"></span> ${t("places.expected", {x: "10 / 15 / 25 / 50"})}</p></div>
    <div class="box"><h3>${t("places.late")} · ${t("common.tournaments", {n: split.late.n})}</h3>${bands(split.late, false)}
      <p class="m" style="margin:6px 0 0">${t("places.lateNote")}</p></div></div>`;
}
// a satellite ticket: counted at face value on both sides
const TICKET_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>';
function ticketsBox(k, period) {
  const rows = k.items.slice(0, 6).map(x => `<tr><td>${shortDate(x.date)}</td><td style="text-align:left;white-space:normal">${esc(x.satellite)}</td>
    <td style="text-align:left;white-space:normal">${esc(x.target || "–")}</td><td>${money(x.value)}</td>
    <td style="text-align:left;white-space:normal">${x.used_in ? `${t("tk.used")} <a href="#/t/${x.used_in.tournament_id}">${esc(x.used_in.name)}</a>`
      : `<span class="m">${t("tk.unusedOne")}</span>`}</td></tr>`);
  return `<div class="box" style="margin:14px 0"><h3 style="margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">${TICKET_ICON}${t("tk.title")}
      <span style="text-transform:none;letter-spacing:0;font-weight:400"> · ${t(period ? "tk.period" : "tk.scope")}${period
        ? ` · <a href="#/analysis?tab=money">${t("tk.allHistory")}</a>` : ""}</span></h3>
    <p style="margin:0 0 6px">${t("tk.summary", {tickets: t("tk.count", {n: k.count}), value: `<b>${money(k.value)}</b>`})}${k.unused_value > 0 ? ` · <span style="color:var(--orange)">${t("tk.unused", {value: money(k.unused_value)})}</span>` : ""}</p>
    ${table([t("col.date"), t("col.satellite"), t("col.target"), t("col.value"), t("col.status")], rows, "names tickets")}</div>`;
}
// going through to the next day of a multi-day tournament: not a place and not a ticket
const DAY_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><path d="M4 18h5v-5h5V8h6"/><path d="M16 4l4 4-4 4"/></svg>';
const dayName = d => /^final/i.test(d) ? t("day.final") : t("day.n", {n: String(d).split(" ").pop()});
function advanced(x, short) {
  if (x.day_status === "not_played") {
    const label = t("adv.notPlayed", {day: dayName(x.advanced_to)});
    return short ? `<span class="m" title="${esc(label)}">${DAY_ICON}${label}</span>` : `<span style="font-size:1rem">${DAY_ICON}${label}</span>`;
  }
  const full = t("adv.label", {day: dayName(x.advanced_to), n: Number(x.advanced_chips || 0)});
  return short ? `<span title="${esc(full)}">${DAY_ICON}${dayName(x.advanced_to)}</span>` : `<span style="font-size:1rem">${DAY_ICON}${full}</span>`;
}
// results with a day's summary missing (PokerCraft does not always offer one): flagged wherever ROI is shown
const pendingNote = p => p && p.count ? `<p class="warn">${t("money.pending", {n: p.count})}</p>` : "";
const pendingMark = x => Number(x.summary_missing) ? ` <span class="m" title="${esc(t(Number(x.provisional) ? "list.provisional" : "list.dayMissing"))}">*</span>` : "";
// a tournament tag ("stake:micro", "target:$500 ...") as a readable label; an unknown tag shows as it is
function tagLabel(tag) {
  const [kind, ...rest] = String(tag).split(":"), value = rest.join(":");
  if (kind === "target") return t("tag.target", {x: esc(value)});
  const key = "tag." + (value ? kind + "." + value : kind), label = t(key);
  return label === key ? esc(tag) : label;
}
// the strongest showdown hand from its category and ranks ("strit do asa", "A-high straight")
const handName = h => h.category == null ? esc(h.hand) : t("hand.cat." + h.category, {top: t("rank.top." + h.ranks[0]),
  topn: t("rank.topn." + h.ranks[0]), a: t("rank.of." + h.ranks[0]), b: t("rank.of." + h.ranks[1]),
  an: t("rank.pl." + h.ranks[0]), bn: t("rank.pl." + h.ranks[1])});
const luckLink = () => `<a href="#/luck">${t("common.howLuck")}</a>`;

// ---- Dashboard -------------------------------------------------------------
// labels: period.<key>, period.<key>.last; the rarer ones sit under "More"
const PERIOD_MAIN = ["session", "24h", "7d", "14d", "30d"], PERIOD_MORE = ["3m", "6m", "max", "custom"];
const PERIODS = [...PERIOD_MAIN, ...PERIOD_MORE];
const periodQuery = (period, from, to) => period ? `?period=${encodeURIComponent(period)}`
  + (period === "custom" && from && to ? `&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}` : "") : "";
// "06.10 – 13.10", with the time when the period is shorter than two days (24 h, a session)
function periodRange(d) {
  const from = d.since || d.first_at;
  if (!from) return "";
  const short = d.period === "session" || d.period === "24h";
  const fmt = x => short ? dateTime(String(x).slice(0, 16)) : dateTime(String(x).slice(0, 10));
  return `${fmt(from)} – ${d.until ? fmt(d.until) : t("period.now")}`;
}
function periodControl(d) {
  const more = PERIOD_MORE.includes(d.period), c = d.custom || {};
  return `<div class="seg" id="periods">${PERIOD_MAIN.map(k => `<button data-p="${k}" class="${k === d.period ? "on" : ""}">${t("period." + k)}</button>`).join("")}
      <button id="p-more" class="${more ? "on" : ""}" aria-expanded="${more}">${more ? t("period." + d.period) : t("period.more")} ▾</button></div>
    <div class="seg" id="p-panel"${more ? "" : " hidden"}>${PERIOD_MORE.filter(k => k !== "custom").map(k => `<button data-p="${k}" class="${k === d.period ? "on" : ""}">${t("period." + k)}</button>`).join("")}
      <span class="p-custom"><label>${t("period.from")} <input type="date" id="p-from" value="${esc(c.from || "")}"></label>
      <label>${t("period.to")} <input type="date" id="p-to" value="${esc(c.to || "")}"></label>
      <button id="p-apply" class="${d.period === "custom" ? "on" : ""}">${t("period.apply")}</button></span></div>`;
}

async function viewDashboard(period, from, to) {
  const mine = routeSeq, q = periodQuery(period, from, to);
  const [{dashboard: d, session: s}, st] = await Promise.all([api("/api/dashboard" + q), api("/api/status")]);
  if (mine !== routeSeq) return;                         // the user went elsewhere while this was loading
  const banner = st.running ? `<p class="warn">${t("dash.importing", {done: st.done, total: st.total})}</p>` : "";
  if (!d.tournaments && !d.hands && d.period === "max") {
    app.innerHTML = banner + `<h1>${t("dash.welcome")}</h1><p>${t("dash.noData")}</p>
      ${st.demo ? "" : `<div class="box"><p>${t("demo.intro")}</p><p><button id="demo-on" class="primary">${t("demo.open")}</button></p></div>`}`;
    const on = document.getElementById("demo-on");
    if (on) on.onclick = () => setDemo(true, on);
    return;
  }
  // Dashboard v3 (14.10.2026): about 1.5 screens; the details live in the session screen, Analysis and Money
  let h = `<h1>${t("nav.dashboard")}${helpLink("dashboard")}</h1>` + banner;
  if (s) {
    const si = s.insights || {}, review = si.busts ? si.busts.length + si.beats.length + si.pots.lost.length + si.pots.won.length : 0;

// the dashboard's one chart: profit in $ or the result in BB (actual and without all-in luck); the choice is kept
let dashUnit = "money";
try { dashUnit = localStorage.getItem("dashChart") === "bb" ? "bb" : "money"; } catch (e) { /* storage blocked */ }
function dashChart(d) {
  const money_ = dashUnit === "money";
  document.querySelectorAll("#c-unit button").forEach(b => b.classList.toggle("on", b.dataset.c === dashUnit));
  document.getElementById("c-title").textContent = money_ ? t("dash.cashCumulative") : t("d3.bbChart");
  document.getElementById("c-legend").innerHTML = money_ ? "" : `<i style="background:var(--blue);margin-left:0"></i>${t("dash.legendActual")}<i style="background:var(--orange)"></i>${t("dash.legendAdjusted")} · ${luckLink()}`;
  charts = [];
  if (money_) addChart("c-main", d.profit_points, [{key: "total", color: "var(--blue)"}], v => money(v, 0),
    p => `<b>${esc(p.name)}</b> ${money(p.buyin)}<br>${t("chart.profitTip", {profit: sgn(p.profit, 2, " $"), total: sgn(p.total, 2, " $")})}`);
  else addChart("c-main", d.bb_points, [{key: "actual", color: "var(--blue)"}, {key: "adjusted", color: "var(--orange)", dash: true}],
    v => bbUnit(v, 0), p => `<b>${esc(p.name || "")}</b><br>${t("chart.luckTip", {net: sgn(p.net_bb), luck: sgn(p.luck_bb),
      actual: sgn(p.actual), adjusted: sgn(p.adjusted)})}`);
  document.getElementById("c-unit").onclick = e => {
    const b = e.target.closest("button[data-c]");
    if (!b || b.dataset.c === dashUnit) return;
    dashUnit = b.dataset.c;
    try { localStorage.setItem("dashChart", dashUnit); } catch (err) { /* kept for this visit */ }
    dashChart(d);
  };
}

// the luck badge: the server sends the English level as its id
const LEVELS = [["Very lucky", "▲▲", "up", "luck.veryLucky"], ["Lucky", "▲", "up", "luck.lucky"], ["Average", "●", "mid", "luck.average"],
                ["Bad run", "▼", "down", "luck.badRun"], ["Worst run", "▼▼", "down", "luck.worstRun"]];
function luckBox(b) {
  const scale = `<div class="lscale">${LEVELS.map(([id, sym, cls, key]) =>
    `<div class="lv ${cls} ${b.level === id ? "on" : ""}"><b>${sym}</b>${t(key)}</div>`).join("")}</div>`;
  const note = b.count ? t("luck.note", {allins: t("common.allins", {n: b.count}), luck: sgn(b.luck_bb, 1, " BB"),
      z: (b.z >= 0 ? "+" : "") + num(b.z, 2)}) + (b.small_sample ? ` · <b>${t("luck.small")}</b>` : "")
    : t("luck.noneInPeriod");
  const rare = b.count && b.one_in ? `<p style="margin:8px 0 0;font-size:.9rem">${t(b.direction === "worse" ? "luck.rareWorse" : "luck.rareBetter", {n: b.one_in})}</p>` : "";
  return `<div class="box"><h3>${t("dash.luck")}</h3>${scale}${rare}<p class="m" style="margin:6px 0 0">${note} · ${luckLink()}</p></div>`;
}
// ---- Last session: luck, the session against your usual play, hands to review --------------------------------
function sessionLuck(b) {
  const lv = LEVELS.find(l => l[0] === b.level), cls = lv?.[2] || "mid", sym = lv?.[1] || "";
  return `<p style="margin:8px 0 0"><span class="lv on ${cls}" style="display:inline-block;padding:2px 8px">${sym} ${lv ? t(lv[3]) : esc(b.level)}</span>
    <span class="m">${t("sess.luckLine", {allins: t("common.allins", {n: b.count}), luck: sgn(b.luck_bb, 1, " BB")})}${
      b.one_in && b.level !== "Average" ? t("sess.oneIn", {n: b.one_in}) : ""}${b.small_sample ? " · " + t("luck.small") : ""}</span></p>`;
}
function vsUsual(rows) {
  return `<p style="margin:6px 0 0" class="m">${t("vs.title")} ${rows.map(r => {
    const diff = r.confidence ? ` <b style="color:var(--orange)">${t(r.session > r.usual ? "vs.higher" : "vs.lower")}${r.confidence === "possible" ? t("vs.chance") : ""}</b>` : "";
    return `${r.stat} ${num(r.session, 1)}${r.unit} ${t("vs.usually", {x: num(r.usual, 1) + r.unit})}${diff}`;
  }).join(" · ")}</p>`;
}
function reviewHands(si) {
  const story = x => `${x.hero_cards ? cards(x.hero_cards) : "–"} vs ${x.rival ? esc(x.rival) + " " : ""}${x.rival_cards ? cards(x.rival_cards) : `<span class="m">${t("review.notShown")}</span>`}${
    x.board ? ` <span class="m">${t("review.on")}</span> ${cards(x.board)}` : ""}${x.equity != null ? ` <span class="m">· ${t("review.equity", {x: num(100 * x.equity, 0)})}</span>` : ""}`;
  // one cell for the hand (with what it was on a small line above) so it wraps on a phone, one for the result
  const row = (x, extra = "") => `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'">
    <td style="text-align:left;white-space:normal">${extra ? `<div class="m" style="font-size:.8rem">${extra}</div>` : ""}${story(x)}</td>
    <td style="vertical-align:top">${sgn(x.net_bb)}</td></tr>`;
  const groups = [
    [t("review.busts"), si.busts.map(x => row(x, esc(x.name)))],
    [t("review.beats"), si.beats.map(x => row(x, `${esc(x.kind)} · ${esc(x.name || "")}`))],
    [t("review.lost"), si.pots.lost.map(x => row(x, esc(x.name || "")))],
    [t("review.won"), si.pots.won.map(x => row(x, esc(x.name || "")))]].filter(g => g[1].length);
  const n = si.busts.length + si.beats.length + si.pots.lost.length + si.pots.won.length;
  return n ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--blue)">${t("review.title", {n})}</summary>
    ${groups.map(([title, rows]) => `<h3 style="font-size:.9rem;margin:10px 0 4px">${title}</h3>${table([t("col.hand"), "BB"], rows)}`).join("")}</details>` : "";
}

function bindPeriods() {
  const pick = async (period, from, to) => {
    try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                     body: JSON.stringify({dashboard_period: period, ...(from ? {dashboard_from: from, dashboard_to: to} : {})})});
    } catch (err) { /* still shown */ }
    viewDashboard(period, from, to);
  };
  const panel = document.getElementById("p-panel");
  for (const id of ["periods", "p-panel", "p-session"]) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", e => { const b = e.target.closest("button[data-p]"); if (b) pick(b.dataset.p); });
  }
  document.getElementById("p-more").onclick = e => {
    panel.hidden = !panel.hidden;
    e.currentTarget.setAttribute("aria-expanded", String(!panel.hidden));
  };
  document.getElementById("p-apply").onclick = () => {
    const from = document.getElementById("p-from").value, to = document.getElementById("p-to").value;
    if (from && to) pick("custom", from, to);
    else (from ? document.getElementById("p-to") : document.getElementById("p-from")).focus();
  };
}

// ---- Time charts: a date axis, a labelled value axis and a tooltip; drawn at the real width so text stays readable
let charts = [];
function addChart(id, pts, series, fmtY, tip, opts = {}) {
  const box = document.getElementById(id);
  const draw = () => drawTimeChart(box, pts, series, fmtY, tip, opts);
  charts.push({box, draw});
  draw();
}
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => charts.forEach(c => document.body.contains(c.box) && c.draw()), 120);
});
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
function drawTimeChart(box, pts, series, fmtY, tip, opts = {}) {
  if (pts.length < 2) { box.innerHTML = `<p class="m" style="padding:8px 12px">${t("chart.notEnough")}</p>`; return; }
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.max(170, Math.min(260, W * .38)));
  const L = 58, R = 14, B = 26, iw = W - L - R;
  const ts = pts.map(p => Date.parse(p.at.replace(" ", "T")));
  // x by time, or by position in the series (opts.byIndex: p.n, e.g. the hand number) with the date in the tooltip
  const xs = opts.byIndex ? pts.map(p => p.n) : ts;
  let t0 = Math.min(...xs), t1 = Math.max(...xs);
  if (t1 === t0) t1 = t0 + (opts.byIndex ? 1 : 3600e3);
  const vals = [...series.map(s => s.key), ...(opts.bands || []).flatMap(b => [b.lo, b.hi])].flatMap(k => pts.map(p => p[k]));
  const step = niceStep((Math.max(0, ...vals) - Math.min(0, ...vals)) / 4 || 1);
  const lo = Math.floor(Math.min(0, ...vals) / step) * step, hi = Math.ceil(Math.max(0, ...vals) / step) * step || step;
  const x = t => L + (t - t0) / (t1 - t0) * iw;
  // annotation labels go in rows above the plot so that labels close in time do not overlap
  const rowEnds = [], placed = (opts.markers || []).filter(m => !m.dot).map(m => {
    const mx = x(xs[m.i]), w = m.label.length * 6.3, end = mx > W - w - 10;
    const a = end ? mx - w - 4 : mx + 4, b = a + w;
    let row = rowEnds.findIndex(e => a > e + 8);
    if (row < 0) row = rowEnds.length < 3 ? rowEnds.length : rowEnds.indexOf(Math.min(...rowEnds));
    rowEnds[row] = b;
    return {...m, mx, row, end};
  });
  const T = 12 + rowEnds.length * 15, ih = H - T - B, y = v => T + (hi - v) / (hi - lo) * ih;
  let g = "";
  for (let v = lo; v <= hi + step / 2; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:${Math.abs(v) < step / 2 ? 1.6 : 1}"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${fmtY(Math.round(v * 100) / 100)}</text>`;
  }
  const spanH = (t1 - t0) / 3600e3, nx = Math.max(2, Math.min(6, Math.floor(iw / 110)));
  let prevLab = "";
  for (let k = 0; k <= nx; k++) {
    const t = t0 + (t1 - t0) * k / nx, d = new Date(t);
    const lab = opts.byIndex ? num(Math.round(t), 0) : spanH <= 36 ? timeLabel(d) : dayLabel(d);
    if (lab === prevLab) continue;                       // a few days on a wide axis: one label per day
    prevLab = lab;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${k === 0 ? "start" : k === nx ? "end" : "middle"}" style="fill:var(--muted);font-size:11px">${lab}</text>`;
  }
  // annotations: a dashed line and a label at the point they belong to; "dot" ones mark a single point (e.g. a bust)
  const marks = (opts.markers || []).filter(m => m.dot).map(m => m.color
      ? `<circle cx="${x(xs[m.i])}" cy="${y(pts[m.i][series[0].key])}" r="5" style="fill:${m.color};stroke:var(--bg);stroke-width:1.5"/>`
      : `<text x="${x(xs[m.i])}" y="${y(pts[m.i][series[0].key]) + 4}"
      text-anchor="middle" style="fill:var(--neg);font-size:14px;font-weight:700">✕</text>`).join("") + placed.map(m => {
    const ly = 12 + m.row * 15;
    return `<line x1="${m.mx}" x2="${m.mx}" y1="${ly - 4}" y2="${T + ih}" style="stroke:var(--orange);stroke-dasharray:4 3"/>
      <text x="${m.mx + (m.end ? -4 : 4)}" y="${ly + 4}" text-anchor="${m.end ? "end" : "start"}"
        style="fill:var(--orange);font-size:11px;font-weight:700">${m.title ? `<title>${esc(m.title)}</title>` : ""}${esc(m.label)}</text>`;
  }).join("");
  const bands = (opts.bands || []).map(b => `<polygon style="fill:${b.color};fill-opacity:${b.opacity || .16};stroke:none"
    points="${[...pts.map((p, i) => `${x(xs[i]).toFixed(1)},${y(p[b.hi]).toFixed(1)}`),
               ...pts.map((p, i) => `${x(xs[i]).toFixed(1)},${y(p[b.lo]).toFixed(1)}`).reverse()].join(" ")}"/>`).join("");
  const lines = series.map(s => `<polyline fill="none" style="stroke:${s.color};stroke-width:2;stroke-linejoin:round${s.dash ? ";stroke-dasharray:6 4" : ""}"
    points="${pts.map((p, i) => `${x(xs[i]).toFixed(1)},${y(p[s.key]).toFixed(1)}`).join(" ")}"/>`).join("");
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"${opts.onPick ? ' style="cursor:pointer"' : ""}>${g}${bands}${marks}${lines}
    <g id="hover" style="display:none"><line y1="${T}" y2="${T + ih}" style="stroke:var(--muted);stroke-dasharray:3 3"/>
      ${series.map(s => `<circle r="4" style="fill:${s.color};stroke:var(--bg);stroke-width:2"/>`).join("")}</g>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = box.querySelector("svg"), hov = svg.querySelector("#hover"), tipEl = box.querySelector(".tip");
  const show = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let i = 0;
    xs.forEach((t, k) => { if (Math.abs(x(t) - mx) < Math.abs(x(xs[i]) - mx)) i = k; });
    const px = x(xs[i]);
    hov.style.display = "";
    hov.querySelector("line").setAttribute("x1", px); hov.querySelector("line").setAttribute("x2", px);

// The server sends full snapshots (pot, stacks, bets, board); this code only draws them.
let replay = null, step = 0, playTimer = null;
const SPEEDS = {slow: 1500, normal: 900, fast: 450};
const VERBS = {folds: "folds", checks: "checks", calls: "calls", bets: "bets", raises: "raises to"};
const bbs = (x, bb) => num(x / bb, Math.abs(x / bb) >= 100 ? 0 : 1);
const pcard = (c, cls = "") => `<span class="pc s-${esc(c[1])} ${cls}">${esc(c[0])}<i>${SUIT[c[1]] || ""}</i></span>`;

function seatPoint(r, seat, f = 1) {
  // Seats are numbered clockwise; slot 0 (Hero) is bottom centre, angles grow clockwise on screen.
  const n = r.max_seats || Math.max(...r.steps[0].players.map(p => p.seat)), hero = r.steps[0].players.find(p => p.hero);
  const k = ((seat - (hero ? hero.seat : 1)) % n + n) % n, t = Math.PI / 2 + k * 2 * Math.PI / n;
  const narrow = matchMedia("(max-width:560px)").matches, rx = narrow ? 40 : 43, ry = narrow ? 41 : 39;
  return [50 + rx * f * Math.cos(t), 50 + ry * f * Math.sin(t)];
}
const at = ([x, y]) => `left:${x.toFixed(2)}%;top:${y.toFixed(2)}%`;

function logLine(s, r) {
  const bb = r.big_blind;
  if (s.kind === "start") return t("replay.blinds", {sb: num(r.small_blind, 0), bb: num(r.big_blind, 0)}) + (r.ante ? t("replay.ante", {x: num(r.ante, 0)}) : "");
  if (s.kind === "deal") return `<span class="cs">${cards(s.board)}</span>`;
  if (s.kind === "return") return `<span>${t("replay.returned", {who: s.action.nick === "Hero" ? "<b>Hero</b>" : esc(s.action.nick)})}</span><span>${bbs(s.action.amount, bb)} BB</span>`;
  if (s.kind === "result") {
    const w = s.players.filter(p => p.net > 0);
    return w.length ? w.map(p => `<span>${t("replay.wins", {who: p.hero ? "<b>Hero</b>" : esc(p.nick)})}</span><span>${sgn(p.net / bb, 1)} BB</span>`).join("") : t("replay.noWinner");
  }
  if (s.kind === "action") {
    const a = s.action, who = a.nick === "Hero" ? "<b>Hero</b>" : esc(a.nick);
    const amt = a.amount && a.type !== "folds" ? ` <span>${bbs(a.amount, bb)} BB</span>` : "";
    return `<span>${who} ${VERBS[a.type] || esc(a.type)}${a.all_in ? " <b>all-in</b>" : ""}</span>${amt}`;
  }
  return esc(s.label);
}

  const btn = r.steps[0].players.find(p => (p.position || "").startsWith("BTN"));
  app.innerHTML = `<p><a href="#/t/${r.tournament_id}">${t("replay.back")}</a></p>
    <h1>${t("replay.title", {i, n})}</h1><p class="m">${t("replay.info", {level: r.level, sb: num(r.small_blind, 0), bb: num(r.big_blind, 0),
      ante: num(r.ante, 0), table: esc(r.table), at: dateTime(r.played_at)})}</p>
    <div class="rt"><div>
      <div class="stage" id="stage"><div class="oval"></div>${empty}

        <div class="center"><div class="street" id="street"></div><div class="board" id="board"></div><div class="pot" id="pot"></div><div class="eqline" id="eq"></div></div>
        <div id="seats"></div></div>
      <div class="ctl">
        <button id="b0" title="${t("replay.startKey")}">⏮</button><button id="b1" title="${t("replay.backKey")}">◀</button>
        <button id="bp" class="primary" title="${t("replay.playKey")}">${t("replay.play")}</button>
        <button id="b2" title="${t("replay.nextKey")}">▶</button><button id="b3" title="${t("replay.endKey")}">⏭</button>
        <select id="spd" title="${t("replay.speed")}">${["slow", "normal", "fast"].map(k => `<option value="${k}" ${k === "normal" ? "selected" : ""}>${t("replay." + k)}</option>`).join("")}</select>
        <span class="m" id="cnt"></span>
        <label class="m" title="${t("replay.deckTip")}"><input type="checkbox" id="deck4" ${document.body.classList.contains("two-color") ? "" : "checked"}> ${t("replay.deck")}</label>
      </div>
      <p class="ctl">${r.prev_id ? `<a href="#/hand/${r.prev_id}">${t("replay.prev")}</a>` : ""} &nbsp; ${r.next_id ? `<a href="#/hand/${r.next_id}">${t("replay.next")}</a>` : ""} &nbsp; <button id="copy-h">${t("ex.copyHand")}</button></p><div id="copy-out"></div>${hsNav(r.hand_id || location.hash.split("/").pop())}
    </div><div class="log" id="log">${log}</div></div>`;
  document.getElementById("copy-h").onclick = () => copyFrom(`/api/text/hand/${r.hand_id}`, "copy-out");
  const go = k => { step = Math.max(0, Math.min(r.steps.length - 1, k)); drawStep(); };
  replay.go = go;
  document.getElementById("b0").onclick = () => { stopPlay(); go(0); };
  document.getElementById("b1").onclick = () => { stopPlay(); go(step - 1); };
  document.getElementById("b2").onclick = () => { stopPlay(); go(step + 1); };
  document.getElementById("b3").onclick = () => { stopPlay(); go(r.steps.length - 1); };
  document.getElementById("bp").onclick = togglePlay;
  document.getElementById("spd").onchange = () => { if (playTimer) { stopPlay(); togglePlay(); } };
  document.getElementById("deck4").onchange = e => setDeck(e.target.checked);
  document.getElementById("log").onclick = e => { const li = e.target.closest(".li"); if (li) { stopPlay(); go(+li.dataset.k); } };
  drawStep();
}

async function setDeck(fourColor) {
  document.body.classList.toggle("two-color", !fourColor);
  try { await api("/api/display", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                   body: JSON.stringify({four_color: fourColor})}); } catch (e) { /* still applied for this session */ }
}

function togglePlay() {
  if (playTimer) return stopPlay();
  if (step >= replay.steps.length - 1) replay.go(0);
  playTimer = setInterval(() => {
    if (!replay || !document.getElementById("stage")) return stopPlay();
    replay.go(step + 1);
    if (step >= replay.steps.length - 1) stopPlay();
  }, SPEEDS[document.getElementById("spd").value]);
  document.getElementById("bp").textContent = t("replay.pause");
}
function stopPlay() {
  clearInterval(playTimer); playTimer = null;
  const b = document.getElementById("bp"); if (b) b.textContent = t("replay.play");
}

function drawStep() {
  const r = replay, s = r.steps[step], bb = r.big_blind, prev = r.steps[step - 1];
  document.getElementById("street").textContent = s.result ? t("replay.result") : s.street;
  const fresh = step === 0 || !prev ? 0 : prev.board.length;
  document.getElementById("board").innerHTML = [0, 1, 2, 3, 4].map(k => s.board[k]
    ? pcard(s.board[k], k >= fresh && s.board.length > fresh && step ? "new" : "") : `<span class="pc slot"></span>`).join("");
  document.getElementById("pot").innerHTML = s.result
    ? t("replay.potPaid", {bb: bbs(r.total_pot, bb), chips: num(r.total_pot, 0)})
    : t("replay.pot", {bb: bbs(s.pot, bb), chips: num(s.pot, 0)});
  const hero = s.players.find(p => p.hero);
  document.getElementById("eq").innerHTML = !(hero && hero.equity != null && r.hero_allin) ? ""
    : s.result ? `${t("replay.eqResult", {eq: num(100 * r.hero_allin.equity, 1), luck: sgn(r.hero_allin.luck / bb, 1, " BB")})}
        <a href="#/luck" style="color:#fff">${t("replay.how")}</a>`
    : t("replay.eq", {eq: num(100 * hero.equity, 1)}) + (prev && prev.players.find(p => p.hero).equity == null ? t("replay.atAllin") : "");
  const eqChanged = p => { const q = prev && prev.players.find(x => x.nick === p.nick); return q && q.equity != null && q.equity !== p.equity; };
  document.getElementById("seats").innerHTML = s.players.map(p => {
    const won = s.result && (r.collected[p.nick] || 0) > 0;
    const cls = ["st", p.hero && "hero", p.folded && "fold", p.acting && "act", !p.acting && s.next === p.nick && "nxt", won && "win"].filter(Boolean).join(" ");
    const hole = p.folded && !p.hero ? "" : p.cards.length ? p.cards.map(c => pcard(c)).join("") : `<span class="pc back"></span><span class="pc back"></span>`;
    const bet = won ? `<div class="bet won" style="${at(seatPoint(r, p.seat, .6))}">+${bbs(r.collected[p.nick], bb)} BB</div>`
      : `<div class="bet ${p.commit ? "" : "off"}" style="${at(seatPoint(r, p.seat, .6))}">${p.commit ? bbs(p.commit, bb) : 0} BB</div>`;
    const res = p.net != null ? ` <span style="font-size:.78rem">${sgn(p.net / bb, 1)}</span>` : "";
    return `<div class="${cls}" style="${at(seatPoint(r, p.seat))}" title="${esc(t("replay.chips", {nick: p.nick, chips: num(p.stack, 0)}))}">
        <div class="hc">${hole}</div>
        <div class="box">${p.hero ? `<span class="pt">${esc(p.position || "")}</span>` : ""}
          ${p.equity != null && !s.result ? `<span class="badge eq ${eqChanged(p) ? "chg" : ""}">${num(100 * p.equity, 0)}%</span>` : ""}
          <div class="nick">${esc(p.nick)}</div><div class="stk">${bbs(p.stack, bb)} BB${res}</div>
          ${p.all_in && !s.result ? `<span class="badge ai">ALL-IN</span>` : ""}</div></div>${bet}`;
  }).join("");
  document.getElementById("cnt").textContent = `${step + 1} / ${r.steps.length}`;
  const log = document.getElementById("log");
  log.querySelectorAll(".li").forEach(li => li.classList.toggle("cur", +li.dataset.k === step));
  const cur = log.querySelector(".li.cur");
  if (cur && log.scrollHeight > log.clientHeight)
    log.scrollTop = Math.max(0, cur.offsetTop - log.offsetTop - log.clientHeight / 2 + cur.offsetHeight / 2);
}
document.addEventListener("keydown", e => {

// ---- Analysis ---------------------------------------------------------------
// Always the whole history. Built-in tips from clear rules; a finding shows only when it stands out from chance.
const conf = c => t(c === "likely" ? "conf.likely" : "conf.possible");
function findingNumber(l) {
  const inHands = t("find.inHands", {n: l.hands});
  if (l.kind === "vs_fold") return `${t("find.vsFold", {value: sgn(l.value, 2, " BB")})}
    <div class="m" style="font-weight:400">${t("find.vsFoldDetail", {played: sgn(l.played, 2), folded: sgn(l.folded, 2), hands: t("common.handsN", {n: l.hands})})}</div>`;
  if (l.kind === "vs_fold_total") return t("find.vsFoldTotal", {value: sgn(l.value, 0, " BB"), inHands});
  if (l.kind === "frequency") return `${t("find.freq", {value: num(l.value, 1), n: l.hands})} <div class="m" style="font-weight:400">${esc(l.guide)}</div>`;
  if (l.kind === "bb_per_100") return t("find.per100", {value: sgn(l.value, 1), inHands});
  return t("find.total", {value: sgn(l.value, 0, " BB"), inHands});
}
const worstList = hands => `<details><summary>${t("find.showWorst", {n: hands.length})}</summary>${table([t("col.when"), t("col.pos"), t("col.cards"), t("col.stack"), t("col.bbEvAdj"), "BB"],
  hands.map(x => `<tr class="click" onclick="location.hash='#/hand/${x.hand_id}'"><td>${dateTime(x.at)}</td><td>${esc(x.position || "")}</td>
    <td>${x.cards ? cards(x.cards) : "–"}</td><td>${bbUnit(x.stack_bb, 0)}</td><td>${sgn(x.adj_bb)}</td><td>${sgn(x.net_bb)}</td></tr>`))}</details>`;

const ANALYSIS_TABS = ["overview", "preflop", "depth", "leaks", "money", "variance"];   // labels: an.tab.<key>

// Analysis v2 stage 2: a finding as a card (cards only at q <= 0.05), with a mini-trend of the cumulative result by EV
function spark(values, good) {
  if (!values || values.length < 2) return "";
  const w = 130, hh = 34, lo = Math.min(0, ...values), hi = Math.max(0, ...values), y = v => (hh - 3 - (v - lo) / ((hi - lo) || 1) * (hh - 6)).toFixed(1);
  return `<span class="spark" title="${esc(t("card.trend"))}"><svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><line x1="0" x2="${w}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--line)"/>
    <polyline fill="none" style="stroke:${good ? "var(--pos)" : "var(--neg)"};stroke-width:2" points="${values.map((v, k) => `${(k * w / (values.length - 1)).toFixed(1)},${y(v)}`).join(" ")}"/></svg>
    <span class="m">${t("card.trend")}</span></span>`;
}
function findingCard(x, good) {
  const chip = x.q == null ? t("card.fact") : `${t("conf.likely")} · q = ${num(x.q, 3)}`;     // the all-in EV card is a fact, not a test
  return `<div class="box finding ${good ? "good" : "likely"}"><h3>${esc(x.title)} <span class="conf">${chip}</span></h3>
    <div class="card-row"><div class="big">${good ? esc(x.text) : findingNumber(x)}</div>${spark(x.spark, good)}</div>
    ${good ? "" : `<p style="margin:6px 0 0">${esc(x.tip)}</p><p class="m" style="margin:4px 0 0">${x.sample === "small" ? t("an.smallSample") + " " : ""}${t("an.about", {bb: num(x.cost_bb, 0)})}</p>`}
    ${!good && x.worst && x.worst.length ? worstList(x.worst) : ""}
    ${leakQuery(x.key) != null ? `<p style="margin:6px 0 0"><a href="#/hands?${leakQuery(x.key)}">${t("card.showHands")}</a></p>` : ""}</div>`;
}
// a finding's hands in the Hands tab: the same filters as the spot it tests
function leakQuery(key) {
  const lines = {line_open: "action=open_raise", line_3bet: "action=threebet", line_4bet_cold: "action=cold_4bet",
    line_open_shove: "action=open_shove", line_3bet_shove: "action=3bet_shove", bb_defence: "position=BB&action=call_vs_open",
    sb_complete: "position=SB&action=limp", sb_flat: "position=SB&action=call_vs_open", fold_to_3bet: "period=30d&action=fold_to_3bet",
    allin_ev: "all_in=1"};
  if (key in lines) return lines[key];
  if (key.startsWith("hand_")) return "cards=" + encodeURIComponent(key.slice(5));
  if (key.startsWith("position_")) return "position=" + encodeURIComponent(key.slice(9));
  const d = key.startsWith("depth_") && key.slice(6).match(/^(?:<(\d+)|(\d+)-(\d+)|(\d+)\+) BB$/);
  if (d) return d[1] ? "stack_max=" + d[1] : d[2] ? "stack_min=" + d[2] + "&stack_max=" + d[3] : "stack_min=" + d[4];
  return null;
}
function nearList(near, tested) {
  if (!near || !near.length) return "";
  return `<details class="more"><summary>${t("near.title", {n: near.length})}</summary><p class="m">${t("near.intro", {tested})}</p>
    ${table([t("col.spot"), t("col.hands"), t("col.result"), "q"], near.map(x => `<tr><td>${leakQuery(x.key) != null ? `<a href="#/hands?${leakQuery(x.key)}">${esc(x.title)}</a>` : esc(x.title)}</td><td>${num(x.hands, 0)}</td>
      <td>${x.kind === "bb_per_100" ? sgn(x.value, 1) + " bb/100" : x.kind === "frequency" ? pct(x.value) : sgn(-x.cost_bb, 0) + " BB"}</td><td>${num(x.q, 2)}</td></tr>`))}</details>`;
}
// the 13x13 grid: result per hand by EV against folding; colours mix into the card colour, so both themes work
function heatGrid(heat, min) {
  const R = "AKQJT98765432", cells = [];
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const k = i === j ? R[i] + R[j] : i < j ? R[i] + R[j] + "s" : R[j] + R[i] + "o", c = heat[k] || {n: 0, ev: 0};
    const few = c.n < min, v = Math.max(-1, Math.min(1, c.ev)), mix = Math.round(Math.abs(v) * 85);
    cells.push(`<button class="hc ${few ? "few" : v >= 0 ? "p" : "n"}" data-k="${k}" style="--mix:${mix}%" title="${esc(t("heat.tip", {hand: k, n: t("common.handsN", {n: c.n}), ev: sgn(c.ev, 2)}))}">${k}</button>`);
  }
  return `<div class="heatwrap"><div><div class="heat" id="heat">${cells.join("")}</div>
    <div class="heat-legend"><span class="hg"></span><span class="m">${t("heat.legend")}</span></div></div>
    <div class="box" id="heat-pick"><p class="m" style="margin:0">${t("heat.pick")}</p></div></div>`;
}
async function heatPick(k, heat, min) {

  box.innerHTML = `<b>${k}</b> <a class="m" href="#/hands?cards=${encodeURIComponent(k)}">${t("heat.search")}</a><p class="m">${t("heat.hands", {hand: k, n: t("common.handsN", {n: c.n}), ev: sgn(c.ev, 2), total: sgn(c.ev * c.n, 0)})}</p>
    ${c.n < min ? `<p class="m">${t("heat.few")}</p>` : ""}`;

  const r = await api(`/api/hands?cards=${encodeURIComponent(k)}`);

     <td>${bbUnit(x.stack_bb, 0)}</td><td>${sgn(x.vs_fold)}</td><td>${sgn(x.net_bb)}</td></tr>`), "scrollbox");

// Analysis v2: a rate over its opportunities, "31,1%" with n under it; greyed below the minimum; definitions in tooltips
const defHead = (label, key) => `<span class="def" title="${esc(t("def." + key))}">${label}</span>`;
function rateCell(r, key, title) {
  if (!r || !r.n) return `<td class="m">–</td>`;
  const tip = r.few ? t("common.few", {min: t("common.opps", {n: 30})}) : title || t("def." + key);
  return `<td class="${r.few ? "few" : ""}" title="${esc(tip)}">${pct(r.pct)}<small>${t("common.n", {n: num(r.n, 0)})}</small></td>`;
}
const STAT_LABEL = {vpip: "VPIP", pfr: "PFR", threebet: "3-bet"};
function trendArrow(tr, key) {
  if (!tr.arrow || tr.arrow.key !== key) return "";
  return ` <span class="${tr.arrow.up ? "pos" : "neg"}" title="${esc(t(tr.arrow.up ? "trend.up" : "trend.down"))}">${tr.arrow.up ? "▲" : "▼"}</span>`;
}
function trendNote(tr) {
  const stats = Object.entries(tr.stats);
  let state;
  if (!stats.length) state = t("trend.few", {recent: num(tr.recent_hands, 0), older: num(tr.older_hands, 0)});
  else {
    const [k, s] = tr.arrow ? [tr.arrow.key, tr.stats[tr.arrow.key]] : stats.reduce((a, b) => Math.abs(b[1].z) > Math.abs(a[1].z) ? b : a);
    state = t(tr.arrow ? "trend.shown" : "trend.none", {stat: STAT_LABEL[k], recent: pct(s.recent), older: pct(s.older)});
  }
  return `<p class="m">${t("trend.note", {state})}</p>`;
}
// the tile shows the rate only; how many chances it rests on is in the tooltip
function rateTile(label, key, r, tr) {
  const s = tr.stats[key];
  return `<div class="${r.few ? "few" : ""}" title="${esc(t("common.n", {n: num(r.n, 0)}))}"><span>${defHead(label, key)}${trendArrow(tr, key)}</span><b>${pct(r.pct)}</b>
    ${s ? `<span class="m">${t("trend.recent", {x: pct(s.recent)})}</span>` : ""}</div>`;
}
// cumulative BB over hand number: total, with and without showdown, and the total by all-in EV (dashed)

function preflopTable(rows, total, first, firstLabel, depth) {
  const head = [firstLabel, t("col.hands"), defHead("VPIP", "vpip"), defHead("PFR", "pfr"), defHead(t("col.rfi"), "rfi"),
    ...(depth ? [defHead(t("col.openShove"), "shove")] : []), defHead(t("col.threebet"), "threebet"),

// a 95 % interval as a small bar with the zero line; red when wholly below zero, green when above
function ciBar(iv) {
  if (!iv) return '<span class="m">–</span>';
  const lo = Math.min(-100, iv.low), hi = Math.max(100, iv.high), x = v => 100 * (v - lo) / (hi - lo);
  const cls = iv.high < 0 ? "neg" : iv.low > 0 ? "pos" : "mid";
  return `<span class="ci" title="${esc(t("an.ciTitle", {lo: num(iv.low, 0), hi: num(iv.high, 0)}))}"><span class="ci-zero" style="left:${x(0)}%"></span>
    <span class="ci-range ${cls}" style="left:${x(iv.low)}%;width:${Math.max(1.5, x(iv.high) - x(iv.low))}%"></span></span>
    <span class="m" style="font-size:.8rem">${num(iv.low, 0)}…${num(iv.high, 0)}%</span>`;
}
const verdict = g => g.confidence ? `<span class="conf ${g.profit < 0 ? "v-neg" : "v-pos"}">${esc(g.verdict)}${g.confidence === "possible" ? t("money.possible") : ""}</span>`
  : `<span class="m">${esc(g.verdict)}</span>`;

      <td class="vcell">${verdict(g)}</td>${extra(g)}</tr>`);
    const head = ["", countHead(), t("col.spend"), t("col.profitUsd"), "ROI", t("col.ci95"), t("col.verdict")];
    h += `<p>${t("money.roiLine", {roi: sgn(m.roi_pct, 0, "%"), tournaments: t("common.tournaments", {n: m.tournaments}),
          lo: num(ri.low, 0), hi: num(ri.high, 0)})}${m.roi_cash_pct != null && m.roi_cash_pct !== m.roi_pct
          ? ` <span class="m">${t("money.inclCashRoi", {roi: sgn(m.roi_cash_pct, 0, "%"), profit: sgn(m.cash_profit, 2, " $")})}</span>` : ""}</p>
      ${pendingNote(m.pending)}<p class="m">${t("money.judged", {groups: t("money.groups", {n: m.tested})})}</p>
      ${o.places && o.places.all && o.places.all.n ? `<h2 title="${esc(t("places.tip"))}">${t("places.money")}</h2><div class="k" style="margin-bottom:12px">${topTiles(o.places)}</div>` : ""}
      ${m.facts.length ? `<div class="box"><b>${t("money.facts")}</b><ul style="margin:6px 0 0 18px;padding:0">${m.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      <h2>${t("dash.byBuyin")}</h2>${table(head, rows(m.tiers))}
      <h2>${t("money.byFormat")}</h2>${table([...head, t("col.tickets")], rows(m.formats, g => `<td>${g.tickets ? money(g.tickets) : "–"}</td>`))}
      <p class="m">${t("money.cashOnly")}</p>
      <h2>${t("money.reVsFirst")}</h2>
      ${table(["", countHead("col.countReTip"), t("col.spent"), t("col.returned"), "ROI", t("col.ci95"), t("col.verdict"), t("col.startStack")],

          <td>${money(g.returned)}</td><td>${g.roi_pct == null ? "–" : sgn(g.roi_pct, 0, "%")}</td>
          <td style="white-space:nowrap">${ciBar(g.interval)}</td><td class="vcell">${verdict(g)}</td>
          <td>${g.avg_start_bb == null ? "–" : bbUnit(g.avg_start_bb, 1)}</td></tr>`), "wrap1")}
      <p class="m">${t("money.reNote")}</p>
      ${m.tickets && m.tickets.count ? ticketsBox(m.tickets, false) : ""}
      ${detailTable("money.byBuyinExact", t("col.buyin"), m.by_buyin, x => money(x.key))}
      ${detailTable("money.byCategory", t("col.tag"), m.by_tag, x => tagLabel(x.key), "col.countTagTip")}
      ${m.by_entry && m.by_entry.length ? detailTable("dash.lateVsStart", t("col.entered"), m.by_entry, x => t("entry." + x.key.split(":")[1]))

  }
  if (tab === "variance") h += `<div id="var"><p class="m">${t("var.loading")}</p></div>`;
  app.innerHTML = h;
  charts = [];
  if (tab === "overview") showdownChart(a.showdown);
  if (tab === "variance") loadVariance(mine);
  if (tab === "leaks") document.getElementById("heat").onclick = e => {
    const b = e.target.closest("button[data-k]");

// ---- Variance: the next N tournaments drawn from the ones played (pokertracker/variance.py) ----------------------
const varState = {n: 500, roi: null};
let varTimer = null;
const bi = (x, d = 0) => num(x, d) + NB + t("var.bi");
const biSgn = (x, d = 0) => sgn(x, d, " " + t("var.bi"));
async function loadVariance(seq) {
  const box = document.getElementById("var");
  const v = await api(`/api/variance?n=${varState.n}` + (varState.roi == null ? "" : `&roi=${varState.roi}`));
  if (seq !== routeSeq || !document.body.contains(box)) return;
  if (!v.result) { box.innerHTML = `<p class="m">${t("var.none")}</p>`; return; }
  const usd = x => v.abi_recent ? `≈${NB}${money(x * v.abi_recent, 0)}` : "";
  const r = v.result, dd = v.drawdown, what = varState.roi != null;
  const roiNow = what ? varState.roi : v.roi_played;
  box.innerHTML = `${v.small ? `<p class="warn">${t("var.small", {n: v.tournaments, min: v.small_below})}</p>` : ""}
    <p class="m">${t("var.intro", {n: t("common.tournaments", {n: v.tournaments}), runs: num(v.runs, 0)})}${v.unknown ? " " + t("var.unknown", {n: v.unknown}) : ""}</p>
    <div class="hs-row" style="align-items:center;gap:14px;margin:8px 0 12px">
      <span class="seg" style="margin:0">${v.horizons.map(n => `<button data-n="${n}" class="${n === v.n ? "on" : ""}">${t("var.next", {n: num(n, 0)})}</button>`).join("")}</span>
      <label style="display:flex;align-items:center;gap:8px">${t("var.whatIf")}
        <input type="range" id="var-roi" min="${v.roi_min}" max="${v.roi_max}" step="1" value="${Math.round(Math.max(v.roi_min, Math.min(v.roi_max, roiNow)))}" style="width:180px">
        <b id="var-roi-v">${sgn(roiNow, 0, "%")}</b></label>
      ${what ? `<button id="var-reset">${t("var.reset", {roi: num(v.roi_played, 0)})}</button>` : `<span class="m">${t("var.played", {roi: num(v.roi_played, 0)})}</span>`}
    </div>
    <div class="k">
      <div>${t("var.median", {n: num(v.n, 0)})}<b>${biSgn(r.median)}</b><span class="m">${usd(r.median)}</span></div>
      <div>${t("var.range")}<b style="font-size:1rem">${num(r.p5, 0)} … ${num(r.p95, 0)}</b><span class="m">${t("var.bi")}</span></div>
      <div>${t("var.loss")}<b>${num(r.loss_pct, 0)}%</b><span class="m">${t("var.lossSub", {n: num(v.n, 0)})}</span></div>
      <div>${t("var.drawdown")}<b>${bi(dd.median)}</b><span class="m">${t("var.drawdownSub", {p95: bi(dd.p95)})}</span></div>
    </div>
    <div class="box" style="margin:14px 0"><h3 class="boxh">${t("var.fanTitle", {n: num(v.n, 0)})}</h3><div class="tchart" id="c-var"></div>
      <p class="m" style="margin:6px 0 0">${t("var.fanNote")}</p></div>
    <div class="box"><b>${t("var.bankrollTitle")}</b><p style="margin:6px 0 0">${roiNow > 0
      ? t("var.bankroll", {k: num(v.bankroll, 0), n: num(v.n, 0), usd: v.abi_recent ? money(v.bankroll * v.abi_recent, 0) : "–", abi: money(v.abi_recent), last: v.abi_recent_n})
      : t("var.bankrollNeg", {roi: num(roiNow, 0)})}</p></div>
    <h2>${t("var.abiTitle")}</h2><div class="box"><div class="tchart" id="c-abi"></div>
      <p class="m" style="margin:6px 0 0">${t(v.abi.unit === "week" ? "var.abiWeek" : "var.abiMonth")}</p></div>
    <h2>${t("var.howTitle")}</h2><div class="box">${t("var.how")}</div>`;
  charts = [];
  addChart("c-var", v.fan.map(p => ({...p, at: ""})), [{key: "p50", color: "var(--blue)"}], x => num(x, 0),
    p => t("var.point", {n: num(p.n, 0), median: num(p.p50, 0), lo50: num(p.p25, 0), hi50: num(p.p75, 0), lo90: num(p.p5, 0), hi90: num(p.p95, 0)}),
    {byIndex: true, bands: [{lo: "p5", hi: "p95", color: "var(--blue)", opacity: .12}, {lo: "p25", hi: "p75", color: "var(--blue)", opacity: .22}]});
  addChart("c-abi", v.abi.points.map(p => ({...p, at: (v.abi.unit === "month" ? p.key + "-01" : p.key) + " 00:00"})),
    [{key: "abi", color: "var(--blue)"}], x => money(x, 0),
    p => t("var.abiPoint", {key: v.abi.unit === "month" ? p.key : dateTime(p.key), abi: money(p.abi), n: t("common.tournaments", {n: p.tournaments})}));
  box.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { varState.n = +b.dataset.n; loadVariance(seq); });
  const slider = document.getElementById("var-roi");
  slider.oninput = () => {
    document.getElementById("var-roi-v").innerHTML = sgn(+slider.value, 0, "%");
    clearTimeout(varTimer);
    varTimer = setTimeout(() => { varState.roi = +slider.value; loadVariance(seq); }, 250);
  };
  const reset = document.getElementById("var-reset");
  if (reset) reset.onclick = () => { varState.roi = null; loadVariance(seq); };
}
