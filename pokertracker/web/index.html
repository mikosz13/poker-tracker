// ---- Export: a hand or a result as text, CSV files into Downloads ---------------------------------------------
async function copyText(text, where) {                   // the clipboard, or the text selected for a manual copy
  const box = document.getElementById(where);
  try {
    await navigator.clipboard.writeText(text);
    box.innerHTML = `<p class="m">${t("ex.copied")}</p>`;
  } catch (e) {
    box.innerHTML = `<p class="m">${t("ex.copyFail")}</p><textarea class="copybox" rows="8" readonly>${esc(text)}</textarea>`;
    box.querySelector("textarea").select();
  }
}
async function copyFrom(url, where) {
  const r = await api(url + (url.includes("?") ? "&" : "?") + "lang=" + LANG);
  if (r.text) await copyText(r.text, where);
}
async function exportCsv(kind, query, where) {
  const r = await api("/api/export", {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                      body: JSON.stringify({kind, query, lang: LANG})});
  document.getElementById(where).innerHTML = `<p class="m">${t("ex.saved", {n: t("ex.rows", {n: r.rows}), path: esc(r.path)})}</p>`;
}

// ---- Hands: search every hand by spot, hand, stack and result -------------------------------------------------
const HS_ACTIONS = ["rfi", "open_raise", "open_shove", "limp", "call_vs_open", "threebet", "3bet_shove", "fold_vs_open",
                    "fold_to_3bet", "cold_4bet", "bb_check", "fold_unopened"];                          // labels: act.<key>
const HS_POS = ["UTG", "UTG+1", "MP", "LJ", "HJ", "CO", "BTN", "SB", "BB", "BTN/SB"];
const HS_PAGE = 100;
const hsQuery = f => Object.entries(f).filter(([, v]) => v !== "" && v != null).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
function hsNav(id) {                                     // next / previous across the last search, in the replayer
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem("hsNav") || "null"); } catch (e) { /* storage blocked: no search nav */ }
  const i = s ? s.ids.indexOf(id) : -1;
  if (i < 0) return "";
  return `<p class="ctl m">${t("hs.nav", {i: i + 1, n: num(s.count, 0)})} · ${i > 0 ? `<a href="#/hand/${s.ids[i - 1]}">${t("hs.prev")}</a> ` : ""}${
    i < s.ids.length - 1 ? `<a href="#/hand/${s.ids[i + 1]}">${t("hs.next")}</a> ` : ""}· <a href="${s.back}">${t("hs.back")}</a></p>`;
}
async function viewHands(qs) {
  const mine = routeSeq, f = Object.fromEntries(new URLSearchParams(qs));
  const tl = await api("/api/tournaments");
  if (mine !== routeSeq) return;
  const opt = (vals, cur, label, show) => `<option value="">${label}</option>` + [...new Set(vals)].filter(v => v !== "" && v != null)
    .sort((a, b) => a < b ? -1 : 1).map(v => `<option value="${esc(v)}" ${String(v) === (cur || "") ? "selected" : ""}>${show(v)}</option>`).join("");
  const sel = (id, opts) => `<select id="${id}">${opts}</select>`;
  const yn = (id, label) => sel(id, [["", `${label}: ${t("hs.any")}`], ["1", `${label}: ${t("hs.yes")}`], ["0", `${label}: ${t("hs.no")}`]]
    .map(([v, l]) => `<option value="${v}" ${(f[id] || "") === v ? "selected" : ""}>${l}</option>`).join(""));
  const picked = new Set((f.cards || "").split(",").filter(Boolean)), pos = new Set((f.position || "").split(",").filter(Boolean));
  const R = "AKQJT98765432", grid = [];
  for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
    const k = i === j ? R[i] + R[j] : i < j ? R[i] + R[j] + "s" : R[j] + R[i] + "o";
    grid.push(`<button data-k="${k}" class="${picked.has(k) ? "on" : ""}">${k}</button>`);
  }
  app.innerHTML = `<h1>${t("hs.title")}${helpLink("hands")}</h1><div class="box hs-filters">
    <div class="hs-row">${sel("period", PERIODS.filter(k => k !== "custom").map(k => `<option value="${k === "max" ? "" : k}" ${(f.period || "") === (k === "max" ? "" : k) ? "selected" : ""}>${t(k === "max" ? "filter.anyTime" : `period.${k}.last`)}</option>`).join(""))}
      ${sel("buyin", opt(tl.map(x => x.buyin_total), f.buyin, t("hs.anyBuyin"), money))}
      ${sel("format", opt(tl.map(x => x.format), f.format, t("hs.anyFormat"), v => t("format." + v)))}
      ${sel("action", `<option value="">${t("hs.anyAction")}</option>` + HS_ACTIONS.map(k => `<option value="${k}" ${f.action === k ? "selected" : ""}>${t("act." + k)}</option>`).join(""))}</div>
    <div class="hs-row"><span class="m">${t("hs.positions")}</span><span class="seg" id="hs-pos" style="margin:0">${HS_POS.map(p => `<button data-p="${p}" class="${pos.has(p) ? "on" : ""}">${p}</button>`).join("")}</span></div>
    <div class="hs-row">${yn("all_in", t("hs.allIn"))}${yn("showdown", t("hs.showdown"))}
      ${sel("result", [["", t("hs.anyResult")], ["won", t("hs.won")], ["lost", t("hs.lost")]].map(([v, l]) => `<option value="${v}" ${(f.result || "") === v ? "selected" : ""}>${l}</option>`).join(""))}
      <label class="m">${t("hs.minBb")} <input id="min_bb" type="number" min="0" step="1" value="${esc(f.min_bb || "")}"></label>
      <label class="m"><input id="ev" type="checkbox" ${f.ev === "1" ? "checked" : ""}> ${t("hs.byEv")}</label>
      <label class="m">${t("hs.stack")} ${t("hs.from")} <input id="stack_min" type="number" min="0" step="1" value="${esc(f.stack_min || "")}"></label>
      <label class="m">${t("hs.to")} <input id="stack_max" type="number" min="0" step="1" value="${esc(f.stack_max || "")}"></label>
      <button id="hs-clear">${t("hs.clear")}</button><button id="hs-csv">${t("ex.csv")}</button></div><div id="hs-csv-out"></div>
    <details ${picked.size ? "open" : ""}><summary>${t("hs.cards")} <span class="m" id="hs-picked">${picked.size ? t("hs.picked", {n: picked.size}) : ""}</span></summary>
      <p class="m" style="margin:4px 0">${t("hs.cardsTip")}</p><div class="hs-grid" id="hs-grid">${grid.join("")}</div></details></div>
    <p class="m" id="hs-sum"></p><div id="hs-list"></div><p><button id="hs-more" hidden></button></p>`;
  let rows = [], last = null;
  const read = () => {
    const g = id => document.getElementById(id);
    return {period: g("period").value, buyin: g("buyin").value, format: g("format").value, action: g("action").value,
            position: [...pos].join(","), cards: [...picked].join(","), all_in: g("all_in").value, showdown: g("showdown").value,
            result: g("result").value, min_bb: g("min_bb").value, ev: g("ev").checked ? "1" : "", stack_min: g("stack_min").value,
            stack_max: g("stack_max").value};
  };
  const row = h => `<tr class="click" data-id="${h.hand_id}"><td>${dateTime(h.played_at)}</td><td class="hs-name" title="${esc(h.name || "")}">${esc(h.name || "")}</td>
    <td>${esc(h.position || "")}</td><td>${h.cards ? cards(h.cards) : "–"}</td><td>${bbUnit(h.stack_bb, 0)}</td><td>${h.action ? t("spot." + h.action) : "–"}</td>
    <td>${sgn(h.net_bb)}</td><td>${sgn(h.adj_bb)}</td></tr>`;
  const draw = () => {
    document.getElementById("hs-sum").innerHTML = last.count ? t("hs.summary", {hands: t("common.handsN", {n: last.count}), net: sgn(last.net_bb, 1), adj: sgn(last.adj_bb, 1)}) : "";
    document.getElementById("hs-list").innerHTML = last.count ? table([t("col.when"), t("col.tournament"), t("col.pos"), t("col.cards"), t("col.stack"), t("col.action"), "BB", t("col.bbEvAdj")],
      rows.map(row), "wrap1 hslist") : `<p class="m">${t("hs.none")}</p>`;
    const more = document.getElementById("hs-more"), left = last.count - rows.length;
    more.hidden = left <= 0;
    more.textContent = t("hs.more", {n: num(left, 0)});
  };
  const run = async (append = false) => {
    const q = hsQuery(read()), seq = routeSeq;
    history.replaceState(null, "", "#/hands" + (q ? "?" + q : ""));
    const r = await api(`/api/search?${q}${q ? "&" : ""}offset=${append ? rows.length : 0}&limit=${HS_PAGE}`);
    if (seq !== routeSeq) return;
    rows = append ? rows.concat(r.hands) : r.hands;
    last = r;
    draw();
  };
  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(() => run(), 250); };
  app.querySelectorAll(".hs-filters select, .hs-filters input").forEach(el => el.addEventListener(el.type === "number" ? "input" : "change", later));
  document.getElementById("hs-pos").onclick = e => { const b = e.target.closest("button[data-p]"); if (!b) return;
    pos.has(b.dataset.p) ? pos.delete(b.dataset.p) : pos.add(b.dataset.p); b.classList.toggle("on"); later(); };
  // the grid: click a cell to pick it, drag across cells to pick or drop several at once
  let painting = null;
  const paint = b => { if (!b || painting === null) return; painting ? picked.add(b.dataset.k) : picked.delete(b.dataset.k);
    b.classList.toggle("on", painting); document.getElementById("hs-picked").textContent = picked.size ? t("hs.picked", {n: picked.size}) : ""; };
  const gridEl = document.getElementById("hs-grid");
  gridEl.addEventListener("pointerdown", e => { const b = e.target.closest("button[data-k]"); if (!b) return; e.preventDefault();
    painting = !picked.has(b.dataset.k); paint(b); });
  gridEl.addEventListener("pointerover", e => paint(e.target.closest("button[data-k]")));
  document.addEventListener("pointerup", () => { if (painting !== null) { painting = null; later(); } }, {once: false});
  document.getElementById("hs-clear").onclick = () => { location.hash = "#/hands"; };
  document.getElementById("hs-more").onclick = () => run(true);
  document.getElementById("hs-csv").onclick = () => exportCsv("hands", hsQuery(read()), "hs-csv-out");
  document.getElementById("hs-list").onclick = e => { const tr = e.target.closest("tr[data-id]"); if (!tr) return;
    try { sessionStorage.setItem("hsNav", JSON.stringify({ids: last.ids, count: last.count, back: location.hash})); } catch (err) { /* no search nav */ }
    location.hash = "#/hand/" + tr.dataset.id; };
  await run();
}

// ---- Import -----------------------------------------------------------------
let poller = null;
const REASONS = {"Sit & Go": "sng", "PLO/Omaha": "omaha", "other game": "other", "not in $": "currency", "cash game": "cash",
                 "freeroll": "freeroll", "unrecognised summary": "unrecognised", "ignored": "ignored"};
const fileList = files => `<ul style="margin:4px 0 0 18px;padding:0">${files.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
const resultBox = r => `<div class="box"><b>${t(r.source === "auto" ? "imp.auto" : "imp.done")}</b>
  <span class="m">${dateTime(String(r.finished_at || "").replace("T", " "))}</span><br>
  ${t("imp.result", {files: r.files, hand_files: r.hand_files, summary_files: r.summary_files, unchanged: r.unchanged,
    new: r.hands_new, dup: r.hands_duplicate, allins: r.allins, tournaments: r.tournaments})}
  ${Object.keys(r.ignored || {}).length ? `<p class="m">${t("imp.ignored", {list:
    Object.entries(r.ignored).map(([why, n]) => REASONS[why] ? t("imp.reason." + REASONS[why], {n}) : `${n} ${esc(why)}`).join(", ")})}</p>` : ""}
  ${Object.entries(r.ignored_files || {}).map(([why, files]) => `<div class="m" style="margin-top:6px">${t("imp.filesOf." + REASONS[why])}${fileList(files)}</div>`).join("")}
  ${(r.to_check || []).length ? `<div class="warn" style="margin-top:8px">${t("imp.formatWarning", {n: r.to_check.length})}${fileList(r.to_check)}</div>` : ""}
  <p><a href="#/">${t("imp.openDashboard")}</a></p>${r.skipped.length ? `<p class="m">${t("imp.skipped")} ${r.skipped.map(x => typeof x === "string" ? esc(x)          // saved by an older version
    : `${esc(x.file)}: ${t("imp.skip." + x.code, {detail: esc(x.detail)})}`).join("<br>")}</p>` : ""}</div>`;
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                                        body: JSON.stringify(body)});
const reasonText = r => t(REASONS[r] ? "reason." + REASONS[r] : "reason.other");
// tournaments with a checkbox each: ticked ones are imported or kept; ones a rule leaves out are greyed and disabled
function pickRows(list) {
  return list.map(r => {
    const note = r.reason ? reasonText(r.reason) : r.to_check ? t("reason.toCheck") : r.in_database ? t("imp.already") : "";
    return `<tr class="${r.reason ? "off" : ""}"><td><input type="checkbox" class="pick" data-id="${r.tournament_id}" ${r.reason ? "disabled" : "checked"}></td>
      <td>${r.date ? shortDate(r.date) : "–"}</td><td style="text-align:left;white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td>
      <td>${r.buyin == null ? "–" : money(r.buyin)}</td>
      <td>${r.hands || (r.hands_stored ? `<span class="m">${t("imp.inDb", {n: r.hands_stored})}</span>` : 0)}</td>
      <td>${t(r.summary ? "common.yes" : "common.no")}</td><td class="vcell m">${note}</td></tr>`;
  });
}
const pickHead = () => ["", t("col.date"), t("col.tournament"), t("col.buyin"), t("col.hands"), t("col.summary"), t("col.note")];
function bindPicks(box, button, label) {
  const picks = [...box.querySelectorAll("input.pick:not([disabled])")];
  const count = () => { button.textContent = label(picks.filter(c => c.checked).length); };
  picks.forEach(c => { c.onchange = count; });
  count();
  return {all: () => { picks.forEach(c => { c.checked = true; }); count(); },
          unticked: () => picks.filter(c => !c.checked).map(c => +c.dataset.id)};
}

let previewAsked = false;                               // a preview shows only for the import started on this screen
async function viewImport() {
  const mine = routeSeq, st = await api("/api/settings");
  if (mine !== routeSeq) return;
  if (st.demo) {
    app.innerHTML = `<h1>${t("nav.import")}</h1><p class="warn">${t("demo.noImport")}</p><p><button id="demo-off2" class="primary">${t("demo.back")}</button></p>`;
    document.getElementById("demo-off2").onclick = () => setDemo(false);
    return;
  }
  app.innerHTML = `<h1>${t("nav.import")}${helpLink("start")}</h1>
    <p>${t("imp.intro")}</p>
    <div class="filters"><input id="folder" style="flex:1;min-width:240px" placeholder="${esc(t("imp.placeholder"))}" value="${esc(st.import_folder || "")}">
    <button id="go" class="primary">${t("imp.go")}</button></div>
    <p><label><input type="checkbox" id="watch" ${st.watch ? "checked" : ""}> ${t("imp.watch")}</label><br>
       <label><input type="checkbox" id="rescan"> ${t("imp.rescan")}</label></p>
    <div id="out"></div><p class="m">${t("imp.database", {db: esc(st.database)})}</p>`;
  const out = document.getElementById("out"), btn = document.getElementById("go");
  const folder = () => document.getElementById("folder").value, rescan = () => document.getElementById("rescan").checked;
  const picker = p => {
    if (!p.tournaments.length) { out.innerHTML = `<div class="box">${t("imp.previewNone")}</div>`; return; }
    out.innerHTML = `<div class="box"><b>${t("imp.previewTitle", {tournaments: t("common.tournaments", {n: p.tournaments.length})})}</b>
      ${p.fuse ? `<p class="warn">${t("imp.formatWarning", {n: p.tournaments.filter(r => r.to_check).length})}</p>` : ""}
      ${table(pickHead(), pickRows(p.tournaments), "scrollbox picks")}
      <p class="m">${t("imp.untickNote")}</p>
      <div class="filters"><button id="pick-all">${t("imp.selectAll")}</button><button id="pick-go" class="primary"></button>
        <button id="pick-cancel">${t("common.cancel")}</button></div></div>`;
    const picks = bindPicks(out, document.getElementById("pick-go"), n => t("imp.importSelected", {n}));
    document.getElementById("pick-all").onclick = picks.all;
    document.getElementById("pick-cancel").onclick = () => { previewAsked = false; out.innerHTML = ""; };
    document.getElementById("pick-go").onclick = async () => {
      const off = new Set(picks.unticked());
      const ignore = p.tournaments.filter(r => off.has(r.tournament_id)).map(r => ({id: r.tournament_id, name: r.name, files: r.files}));
      previewAsked = false;
      try { await post("/api/import", {path: folder(), rescan: rescan(), ignore}); poll(); }
      catch (err) { out.innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
    };
  };
  const show = s => {
    if (s.running) {
      btn.disabled = true;
      out.innerHTML = `<div class="box"><b>${t(s.mode === "preview" ? "imp.previewing" : s.source === "auto" ? "imp.runningAuto" : "imp.running")}</b>
        <progress max="${s.total || 1}" value="${s.done}" style="width:100%"></progress>
        <p class="m">${t("imp.progress", {done: s.done, total: s.total})}${s.current ? " · " + esc(s.current) : ""}.${s.mode === "preview" ? "" : " " + t("imp.slow")}</p></div>`;
      return;
    }
    btn.disabled = false;
    if (s.error) out.innerHTML = `<p class="warn">${t("imp.failed", {e: esc(s.error)})}</p>`;
    else if (s.mode === "preview" && s.preview && previewAsked) picker(s.preview);
    else if (s.result || s.last_import) out.innerHTML = resultBox(s.result || s.last_import);
  };
  const poll = async () => {
    const s = await api("/api/status");
    show(s);
    clearTimeout(poller);
    if (s.running && location.hash === "#/import") poller = setTimeout(poll, 700);
  };
  btn.onclick = async () => {                             // first a preview: nothing is written until "Import selected"
    try { previewAsked = true; await post("/api/import/preview", {path: folder(), rescan: rescan()}); poll(); }
    catch (err) { out.innerHTML = `<p class="warn">${esc(err.message)}</p>`; }
  };
  document.getElementById("watch").onchange = e => post("/api/watch", {enabled: e.target.checked});
  poll();
}

// ---- After an automatic import: a notice on every screen, and a review of what came in -------------------------
const notice = document.getElementById("notice");
const markSeen = async at => { notice.innerHTML = ""; try { await post("/api/display", {import_seen: at}); } catch (e) { /* shown again later */ } };
async function checkNotice() {
  try {
    const s = await api("/api/status"), li = s.last_import;
    showDemoBar(s.demo);
    const show = !s.demo && li && li.source === "auto" && li.tournaments && li.finished_at !== s.import_seen && location.hash !== "#/review";
    notice.innerHTML = show ? `<div class="notice">${t("notice.auto", {tournaments: t("common.tournaments", {n: li.tournaments})})}
      <a href="#/review">${t("notice.review")}</a><button id="notice-x" title="${esc(t("notice.dismiss"))}">×</button></div>` : "";
    if (show) document.getElementById("notice-x").onclick = () => markSeen(li.finished_at);
  } catch (e) { /* the notice can wait */ }
}
setInterval(checkNotice, 15000);

// ---- Demo data: a separate database, shown until the player goes back to their own ----------------------------
const demoBar = document.getElementById("demo-bar");
function showDemoBar(on) {
  if (!on) { demoBar.innerHTML = ""; return; }
  if (demoBar.innerHTML) return;
  demoBar.innerHTML = `<div class="demo"><b>${t("demo.bar")}</b><span class="m">${t("demo.barHint")}</span><button id="demo-off">${t("demo.back")}</button></div>`;
  document.getElementById("demo-off").onclick = () => setDemo(false);
}
async function setDemo(on, btn) {
  if (btn) { btn.disabled = true; btn.textContent = t("demo.building"); }
  try {
    const r = await post("/api/demo", {on});
    showDemoBar(r.demo);
    if (location.hash === "#/" || location.hash === "") route(); else location.hash = "#/";
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = t("demo.open"); }
    alert(e.message);
  }
}

async function viewReview(msg) {
  const mine = routeSeq, r = await api("/api/review");
  if (mine !== routeSeq) return;
  if (r.finished_at) markSeen(r.finished_at);
  let h = `<h1>${t("rev.title")}</h1>${msg ? `<p class="box">${msg}</p>` : ""}`;
  if (!r.tournaments.length) { app.innerHTML = h + (msg ? "" : `<p class="m">${t("rev.none")}</p>`); return; }
  const rows = r.tournaments.map(x => ({tournament_id: x.tournament_id, date: x.date, name: x.name, buyin: x.buyin_total,
                                        hands: x.hands, summary: x.has_summary}));
  app.innerHTML = h + `<p class="m">${dateTime(String(r.finished_at || "").replace("T", " "))} · ${t("rev.intro")}</p>
    ${table(pickHead(), pickRows(rows), "scrollbox picks")}
    <div class="filters" style="margin-top:10px"><button id="pick-all">${t("imp.selectAll")}</button><button id="rev-save" class="primary">${t("rev.save")}</button></div>`;
  const picks = bindPicks(app, document.createElement("span"), () => "");
  document.getElementById("pick-all").onclick = picks.all;
  document.getElementById("rev-save").onclick = async () => {
    const ids = picks.unticked();
    if (ids.length) await post("/api/ignore", {ids});
    viewReview(ids.length ? t("rev.saved", {n: ids.length}) : "");
  };
}

// ---- Settings: the ignore list ---------------------------------------------------------------------------------
async function viewSettings(msg) {
  const mine = routeSeq, [x, st] = await Promise.all([api("/api/excluded"), api("/api/settings")]);
  if (mine !== routeSeq) return;
  const ign = x.ignored.map(r => `<tr><td>${dateTime(String(r.excluded_at || "").replace("T", " "))}</td>
    <td style="text-align:left;white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td>
    <td><button data-restore="${r.tournament_id}">${t("set.restore")}</button></td></tr>`);
  const rules = x.rules.map(r => `<tr><td style="white-space:normal">${esc(r.name || "#" + r.tournament_id)}</td><td>${reasonText(r.reason)}</td></tr>`);
  app.innerHTML = `<h1>${t("nav.settings")}${helpLink("backup")}</h1>${msg ? `<p class="box">${msg}</p>` : ""}
    <h2>${t("set.ignored")}</h2><p class="m">${t("set.ignoredIntro")}</p>
    ${ign.length ? table([t("col.ignoredAt"), t("col.tournament"), ""], ign, "names") : `<p class="m">${t("set.none")}</p>`}
    <h2>${t("set.rules")}</h2><p class="m">${t("set.rulesIntro")}</p>
    ${rules.length ? table([t("col.tournament"), t("col.reason")], rules) : `<p class="m">${t("set.rulesNone")}</p>`}
    <h2>${t("demo.title")}</h2><p class="m">${t(st.demo ? "demo.settingsOn" : "demo.settingsOff")}</p>
    <p><button id="demo-set">${t(st.demo ? "demo.back" : "demo.open")}</button></p>
    <h2>${t("bk.title")}</h2><p class="m">${t("bk.intro")}</p>
    <p><button id="bk-make">${t("bk.make")}</button></p><div id="bk-made"></div>
    <h3 style="font-size:.95rem">${t("bk.restoreTitle")}</h3>
    <p class="hs-row"><input id="bk-path" type="text" placeholder="${esc(t("bk.path"))}" style="flex:1;min-width:260px">
      ${window.pywebview && window.pywebview.api && window.pywebview.api.pick_db ? `<button id="bk-pick">${t("bk.pick")}</button>` : ""}
      <button id="bk-check">${t("bk.check")}</button></p><div id="bk-info"></div>`;
  // backup: a copy into Downloads; restore: check the file first, then confirm, then replace
  const demoSet = document.getElementById("demo-set");
  demoSet.onclick = () => setDemo(!st.demo, demoSet);
  const say = (where, html) => { document.getElementById(where).innerHTML = html; };
  const fail = (where, e) => say(where, `<p class="warn">${esc(e.message)}</p>`);
  document.getElementById("bk-make").onclick = async () => {
    try { const r = await post("/api/backup", {}); say("bk-made", `<p class="m">${t("bk.made", {path: esc(r.path)})}</p>`); } catch (e) { fail("bk-made", e); }
  };
  const pick = document.getElementById("bk-pick");
  if (pick) pick.onclick = async () => { const p = await window.pywebview.api.pick_db(); if (p) document.getElementById("bk-path").value = p; };
  document.getElementById("bk-check").onclick = async () => {
    const path = document.getElementById("bk-path").value.trim();
    try {
      const r = await post("/api/backup/check", {path});
      say("bk-info", `<p class="box">${t("bk.info", {version: r.version, tournaments: t("common.tournaments", {n: r.tournaments}),
        hands: t("common.handsN", {n: r.hands}), last: r.last_hand ? dateTime(r.last_hand) : "–"})}</p><p><button id="bk-restore">${t("bk.restore")}</button></p>`);
      document.getElementById("bk-restore").onclick = async () => {
        if (!confirm(t("bk.confirm"))) return;
        try { const x = await post("/api/backup/restore", {path}); viewSettings(t("bk.restored", {saved: esc(x.saved)})); } catch (e) { fail("bk-info", e); }
      };
    } catch (e) { fail("bk-info", e); }
  };
  app.querySelectorAll("[data-restore]").forEach(b => {
    b.onclick = async () => {
      const r = await post("/api/restore", {id: +b.dataset.restore});
      viewSettings(t(r.files_found ? "set.restored" : "set.restoredNoFiles"));
    };
  });
}

// ---- Router -----------------------------------------------------------------
let routeSeq = 0;                                       // views drawn after a newer route started are dropped
async function route(keepScroll) {
  routeSeq++;
  const h = location.hash || "#/", y = window.scrollY;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on",
    a.getAttribute("href") === h || h.startsWith(a.getAttribute("href") + "?")
      || (a.getAttribute("href") === "#/tournaments" && /^#\/(t|hand)\//.test(h))));
  if (!h.startsWith("#/hand/")) { replay = null; stopPlay(); }
  try {
    let m;
    if (h === "#/" || h === "#") await viewDashboard();
    else if (h === "#/tournaments" || h.startsWith("#/tournaments?")) {
      const q = new URLSearchParams(h.split("?")[1] || "");
      if (q.get("period")) Object.assign(filters, {period: q.get("period"), from: q.get("from") || "", to: q.get("to") || ""});
      await viewTournaments();
    }
    else if ((m = h.match(/^#\/t\/(\d+)$/))) await viewTournament(m[1]);
    else if ((m = h.match(/^#\/hand\/(\w+)$/))) await viewHand(m[1]);
    else if (h === "#/analysis" || h.startsWith("#/analysis?")) await viewAnalysis(new URLSearchParams(h.split("?")[1] || "").get("tab"));
    else if (h === "#/import") await viewImport();
    else if (h === "#/session") await viewSession();
    else if (h === "#/help" || h.startsWith("#/help/")) viewHelp(h.split("/")[2]);
    else if (h === "#/hands" || h.startsWith("#/hands?")) await viewHands(h.split("?")[1] || "");
    else if (h === "#/luck") viewLuck();
    else if (h === "#/review") await viewReview();
    else if (h === "#/settings") await viewSettings();
    else app.innerHTML = `<p>${t("common.notFound")}</p>`;
  } catch (err) { app.innerHTML = `<p class="warn">${t("common.error", {e: esc(err.message)})}</p>`; }
  window.scrollTo(0, keepScroll === true ? y : 0);
  checkNotice();
}
window.addEventListener("hashchange", () => route());
// the saved language, or the system language the first time
api("/api/settings").then(st => {
  document.body.classList.toggle("two-color", st.four_color === false);
  setTimeout(() => showDemoBar(st.demo));
  return st.lang;
}).catch(() => null).then(saved => setLang(LANGS.includes(saved) ? saved
  : (navigator.language || "").toLowerCase().startsWith("pl") ? "pl" : "en")).finally(() => route());
</script>
